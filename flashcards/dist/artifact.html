ess","deck":2,"type":"phrase","tag":"noun","en":"problem","fr":"problème","ex":"We need to solve this problem quickly.","exFr":"On doit résoudre ce problème rapidement.","id":"vocess:2:problem"},{"col":"vocess","deck":2,"type":"phrase","tag":"noun","en":"fact","fr":"fait","ex":"It's a fact that exercise improves your mood.","exFr":"C'est un fait que l'exercice améliore l'humeur.","id":"vocess:2:fact"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"good","fr":"bon","ex":"This restaurant has really good food.","exFr":"Ce restaurant a vraiment de la bonne nourriture.","id":"vocess:3:good"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"new","fr":"nouveau","ex":"I just bought a new pair of shoes.","exFr":"Je viens d'acheter une nouvelle paire de chaussures.","id":"vocess:3:new"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"first","fr":"premier","ex":"This is my first time visiting Paris.","exFr":"C'est la première fois que je visite Paris.","id":"vocess:3:first"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"last","fr":"dernier","ex":"We met for the last time three years ago.","exFr":"On s'est vus pour la dernière fois il y a trois ans.","id":"vocess:3:last"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"long","fr":"long","ex":"It was a long flight to Tokyo.","exFr":"C'était un long vol jusqu'à Tokyo.","id":"vocess:3:long"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"great","fr":"super, grand","ex":"That was a great film, I really enjoyed it.","exFr":"C'était un super film, je l'ai vraiment aimé.","id":"vocess:3:great"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"little","fr":"petit","ex":"There's a little café near my house.","exFr":"Il y a un petit café près de chez moi.","id":"vocess:3:little"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"own","fr":"propre (à soi)","ex":"She finally has her own apartment.","exFr":"Elle a enfin son propre appartement.","id":"vocess:3:own"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"other","fr":"autre","ex":"I'll ask the other team for help.","exFr":"Je vais demander de l'aide à l'autre équipe.","id":"vocess:3:other"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"old","fr":"vieux","ex":"This is a really old building, isn't it?","exFr":"C'est un bâtiment vraiment vieux, non ?","id":"vocess:3:old"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"right","fr":"correct / droite","ex":"You're right, we should leave earlier.","exFr":"Tu as raison, on devrait partir plus tôt.","id":"vocess:3:right"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"big","fr":"grand","ex":"They just moved into a really big house.","exFr":"Ils viennent d'emménager dans une très grande maison.","id":"vocess:3:big"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"high","fr":"haut, élevé","ex":"Prices have been really high this year.","exFr":"Les prix ont été vraiment élevés cette année.","id":"vocess:3:high"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"different","fr":"différent","ex":"We have very different opinions on this.","exFr":"On a des opinions très différentes là-dessus.","id":"vocess:3:different"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"small","fr":"petit","ex":"It's a small problem, don't worry.","exFr":"C'est un petit problème, ne t'inquiète pas.","id":"vocess:3:small"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"large","fr":"grand, vaste","ex":"They have a large garden behind the house.","exFr":"Ils ont un grand jardin derrière la maison.","id":"vocess:3:large"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"next","fr":"suivant, prochain","ex":"Let's discuss this at the next meeting.","exFr":"Discutons-en lors de la prochaine réunion.","id":"vocess:3:next"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"early","fr":"tôt, précoce","ex":"I usually wake up early in the morning.","exFr":"Je me réveille généralement tôt le matin.","id":"vocess:3:early"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"young","fr":"jeune","ex":"She started working at a very young age.","exFr":"Elle a commencé à travailler très jeune.","id":"vocess:3:young"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"important","fr":"important","ex":"This is a really important decision for us.","exFr":"C'est une décision vraiment importante pour nous.","id":"vocess:3:important"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"few","fr":"quelques (a few) / peu de","ex":"Only a few people came to the event.","exFr":"Seulement peu de gens sont venus à l'événement.","id":"vocess:3:few"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"public","fr":"public","ex":"This park is open to the public.","exFr":"Ce parc est ouvert au public.","id":"vocess:3:public"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"bad","fr":"mauvais","ex":"The weather has been really bad this week.","exFr":"Le temps a été vraiment mauvais cette semaine.","id":"vocess:3:bad"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"same","fr":"même","ex":"We're going through the same problem right now.","exFr":"On traverse le même problème en ce moment.","id":"vocess:3:same"},{"col":"vocess","deck":3,"type":"phrase","tag":"adj","en":"able","fr":"capable","ex":"I wasn't able to finish the report on time.","exFr":"Je n'ai pas pu finir le rapport à temps.","id":"vocess:3:able"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"though","fr":"bien que, quand même","ex":"It's expensive. I'll buy it, though.","exFr":"C'est cher. Je vais quand même l'acheter.","id":"vocess:4:though"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"whether","fr":"que ce soit, si","ex":"I don't know whether she's coming or not.","exFr":"Je ne sais pas si elle vient ou pas.","id":"vocess:4:whether"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"within","fr":"dans, à l'intérieur de","ex":"We need to finish this within a week.","exFr":"On doit finir ça dans un délai d'une semaine.","id":"vocess:4:within"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"beyond","fr":"au-delà de","ex":"This is beyond what I expected.","exFr":"C'est au-delà de ce que j'attendais.","id":"vocess:4:beyond"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"throughout","fr":"tout au long de","ex":"It rained throughout the whole trip.","exFr":"Il a plu pendant tout le voyage.","id":"vocess:4:throughout"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"towards","fr":"vers","ex":"She walked toward the exit.","exFr":"Elle a marché vers la sortie.","id":"vocess:4:towards"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"among","fr":"parmi","ex":"This is one of the best among all the options.","exFr":"C'est l'une des meilleures options parmi toutes.","id":"vocess:4:among"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"upon","fr":"sur, dès que","ex":"Upon arrival, please check in at the desk.","exFr":"Dès votre arrivée, veuillez vous enregistrer au comptoir.","id":"vocess:4:upon"},{"col":"vocess","deck":4,"type":"phrase","tag":"func","en":"according to","fr":"selon","ex":"According to the report, sales went up.","exFr":"Selon le rapport, les ventes ont augmenté.","id":"vocess:4:according-to"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"wake up","fr":"se réveiller","ex":"I always wake up at 7am.","exFr":"Je me réveille toujours à 7h.","id":"phv:1:wake-up"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"get up","fr":"se lever","ex":"Please get up, it's time for school.","exFr":"Lève-toi, c'est l'heure d'aller à l'école.","id":"phv:1:get-up"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"go on","fr":"continuer","ex":"Please go on with your story.","exFr":"Continue ton histoire, je t'écoute.","id":"phv:1:go-on"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"come back","fr":"revenir","ex":"He came back from his trip yesterday.","exFr":"Il est revenu de son voyage hier.","id":"phv:1:come-back"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"go out","fr":"sortir","ex":"We're going out tonight, do you want to join us?","exFr":"On sort ce soir, tu veux venir avec nous ?","id":"phv:1:go-out"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"put on","fr":"mettre (un vêtement)","ex":"He puts on his coat before leaving the house.","exFr":"Il met son manteau avant de sortir de la maison.","id":"phv:1:put-on"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"take off","fr":"enlever (un vêtement)","ex":"Please take off your shoes before coming in.","exFr":"Enlève tes chaussures avant d'entrer.","id":"phv:1:take-off"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"turn on","fr":"allumer","ex":"Could you turn on the light, please? It's dark.","exFr":"Tu peux allumer la lumière, s'il te plaît ? Il fait noir.","id":"phv:1:turn-on"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"turn off","fr":"éteindre","ex":"Don't forget to turn off the TV before you sleep.","exFr":"N'oublie pas d'éteindre la télé avant de dormir.","id":"phv:1:turn-off"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"switch on","fr":"allumer","ex":"Switch on the computer, we need to start working.","exFr":"Allume l'ordinateur, on doit commencer à travailler.","id":"phv:1:switch-on"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"switch off","fr":"éteindre","ex":"Switch off the lights before you leave the room.","exFr":"Éteins les lumières avant de quitter la pièce.","id":"phv:1:switch-off"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"sit down","fr":"s'asseoir","ex":"Please sit down and make yourself comfortable.","exFr":"Assieds-toi et mets-toi à l'aise.","id":"phv:1:sit-down"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"roll up","fr":"relever (les manches)","ex":"Roll up your sleeves, we have a lot of work to do.","exFr":"Retrousse tes manches, on a beaucoup de travail.","id":"phv:1:roll-up"},{"col":"phv","deck":1,"type":"phrase","tag":"verb","en":"write down","fr":"noter","ex":"Can you write down your address for me, please?","exFr":"Tu peux noter ton adresse pour moi, s'il te plaît ?","id":"phv:1:write-down"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"break down","fr":"tomber en panne","ex":"My computer has broken down again — it won't start.","exFr":"Mon ordinateur est encore tombé en panne — il ne démarre pas.","id":"phv:2:break-down"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"figure out","fr":"comprendre, trouver une solution","ex":"We need to figure out what really happened last night.","exFr":"On doit comprendre ce qui s'est vraiment passé hier soir.","id":"phv:2:figure-out"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"work out","fr":"faire du sport / trouver une solution","ex":"She works out at the gym every morning before work.","exFr":"Elle fait du sport à la salle tous les matins avant le travail.","id":"phv:2:work-out"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"come up with","fr":"trouver (une idée)","ex":"He came up with a brilliant idea to fix the problem.","exFr":"Il a trouvé une idée géniale pour résoudre le problème.","id":"phv:2:come-up-with"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"cut down on","fr":"réduire sa consommation de","ex":"I really need to cut down on sugar this year.","exFr":"J'ai vraiment besoin de réduire le sucre cette année.","id":"phv:2:cut-down-on"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"give up","fr":"abandonner","ex":"Don't give up now, you're almost at the finish line!","exFr":"N'abandonne pas maintenant, tu es presque arrivé !","id":"phv:2:give-up"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"get rid of","fr":"se débarrasser de","ex":"We need to get rid of these old habits once and for all.","exFr":"On doit se débarrasser de ces vieilles habitudes une fois pour toutes.","id":"phv:2:get-rid-of"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"run out of","fr":"manquer de","ex":"We ran out of milk this morning, can you buy some?","exFr":"On n'a plus de lait ce matin, tu peux en acheter ?","id":"phv:2:run-out-of"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"check out","fr":"régler la note et partir","ex":"We'll check out of the hotel tomorrow morning at 10am.","exFr":"On quittera l'hôtel demain matin à 10h.","id":"phv:2:check-out"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"check in","fr":"s'enregistrer à l'hôtel","ex":"We need to check in at the hotel before 3pm.","exFr":"On doit s'enregistrer à l'hôtel avant 15h.","id":"phv:2:check-in"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"fill in / fill out","fr":"remplir (un formulaire) — fill in (UK), fill out (US)","ex":"Please fill out this form with your name and address.","exFr":"Remplis ce formulaire avec ton nom et ton adresse.","id":"phv:2:fill-in-fill-out"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"hold on","fr":"patienter, tenir bon","ex":"Hold on a second, I'll be right there!","exFr":"Attends une seconde, j'arrive tout de suite !","id":"phv:2:hold-on"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"carry on","fr":"continuer","ex":"Carry on with your work, I'll wait for you here.","exFr":"Continue ton travail, je t'attends ici.","id":"phv:2:carry-on"},{"col":"phv","deck":2,"type":"phrase","tag":"verb","en":"find out","fr":"découvrir","ex":"We need to find out what really happened at the party.","exFr":"On doit découvrir ce qui s'est vraiment passé à la fête.","id":"phv:2:find-out"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"get along (with)","fr":"s'entendre avec","ex":"I get along really well with my sister, we never fight.","exFr":"Je m'entends très bien avec ma sœur, on ne se dispute jamais.","id":"phv:3:get-along-with"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"break up","fr":"rompre (un couple)","ex":"They decided to break up after three years together.","exFr":"Ils ont décidé de rompre après trois ans ensemble.","id":"phv:3:break-up"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"make up","fr":"inventer / se réconcilier","ex":"He couldn't think of a real excuse, so he made one up.","exFr":"Il n'a pas trouvé de vraie excuse, alors il en a inventé une.","id":"phv:3:make-up"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"cheer up","fr":"remonter le moral","ex":"She tried to cheer up her friend after a difficult week.","exFr":"Elle a essayé de remonter le moral de son amie après une semaine difficile.","id":"phv:3:cheer-up"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"look after","fr":"s'occuper de","ex":"Can you look after my dog this weekend? I'm away.","exFr":"Tu peux t'occuper de mon chien ce week-end ? Je suis absent.","id":"phv:3:look-after"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"bring up","fr":"élever (un enfant)","ex":"She was brought up by her grandparents in the countryside.","exFr":"Elle a été élevée par ses grands-parents à la campagne.","id":"phv:3:bring-up"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"take after","fr":"ressembler à","ex":"Everyone says she really takes after her mother.","exFr":"Tout le monde dit qu'elle ressemble vraiment à sa mère.","id":"phv:3:take-after"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"hang out","fr":"passer du temps avec","ex":"They love to hang out at the mall at weekends.","exFr":"Ils aiment passer du temps au centre commercial le week-end.","id":"phv:3:hang-out"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"catch up (with)","fr":"se rattraper, donner des nouvelles","ex":"We haven't seen each other in years, we need to catch up!","exFr":"On ne s'est pas vus depuis des années, il faut se raconter tout ça !","id":"phv:3:catch-up-with"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"root for","fr":"soutenir (une équipe)","ex":"Everyone in the stadium was rooting for the home team.","exFr":"Tout le monde dans le stade soutenait l'équipe locale.","id":"phv:3:root-for"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"pass out","fr":"s'évanouir","ex":"He passed out because of the heat during the race.","exFr":"Il s'est évanoui à cause de la chaleur pendant la course.","id":"phv:3:pass-out"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"show up","fr":"se montrer, arriver","ex":"She showed up at the party without an invitation.","exFr":"Elle est arrivée à la fête sans invitation.","id":"phv:3:show-up"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"come across","fr":"tomber sur (par hasard)","ex":"I came across an old friend at the supermarket yesterday.","exFr":"J'ai croisé un vieil ami au supermarché hier, par hasard.","id":"phv:3:come-across"},{"col":"phv","deck":3,"type":"phrase","tag":"verb","en":"shut up","fr":"se taire (familier)","ex":"Just be quiet for a second — shut up, please!","exFr":"Sois silencieux une seconde — tais-toi, s'il te plaît !","id":"phv:3:shut-up"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"pick up","fr":"aller chercher quelqu'un","ex":"I'll pick you up at 8pm, be ready!","exFr":"Je viendrai te chercher à 20h, sois prêt !","id":"phv:4:pick-up"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"put down","fr":"poser","ex":"He put the book down and went straight to bed.","exFr":"Il a posé le livre et est allé directement se coucher.","id":"phv:4:put-down"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"drop off","fr":"déposer quelqu'un","ex":"Can you drop me off at the train station on your way?","exFr":"Tu peux me déposer à la gare sur ton chemin ?","id":"phv:4:drop-off"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"give away","fr":"donner, distribuer","ex":"He gave away all his old toys to charity.","exFr":"Il a donné tous ses anciens jouets à une association.","id":"phv:4:give-away"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"go over","fr":"revoir, examiner","ex":"Let's go over the plans one more time before the meeting.","exFr":"Revoyons les plans une dernière fois avant la réunion.","id":"phv:4:go-over"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"keep up with","fr":"suivre le rythme","ex":"I can't keep up with all these new rules!","exFr":"Je n'arrive pas à suivre toutes ces nouvelles règles !","id":"phv:4:keep-up-with"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"look forward to","fr":"avoir hâte de","ex":"I'm really looking forward to the weekend.","exFr":"J'ai vraiment hâte que le week-end arrive.","id":"phv:4:look-forward-to"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"look for","fr":"chercher","ex":"Sorry, I'm looking for my wallet, have you seen it?","exFr":"Désolé, je cherche mon portefeuille, tu l'as vu ?","id":"phv:4:look-for"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"take up","fr":"se mettre à (une activité)","ex":"He decided to take up golf this year as a new hobby.","exFr":"Il a décidé de se mettre au golf cette année comme nouveau loisir.","id":"phv:4:take-up"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"turn up","fr":"augmenter le volume","ex":"Can you turn up the music? I can barely hear it.","exFr":"Tu peux monter le son de la musique ? Je l'entends à peine.","id":"phv:4:turn-up"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"zip up","fr":"fermer la fermeture éclair","ex":"Zip up your jacket, it's freezing outside.","exFr":"Ferme ta veste, il fait glacial dehors.","id":"phv:4:zip-up"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"break out","fr":"s'échapper","ex":"The prisoner managed to break out during the night.","exFr":"Le prisonnier a réussi à s'échapper pendant la nuit.","id":"phv:4:break-out"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"bring out","fr":"révéler, mettre en valeur","ex":"That blue shirt really brings out the colour of your eyes.","exFr":"Cette chemise bleue met vraiment en valeur la couleur de tes yeux.","id":"phv:4:bring-out"},{"col":"phv","deck":4,"type":"phrase","tag":"verb","en":"call off","fr":"annuler","ex":"The meeting was called off at the last minute.","exFr":"La réunion a été annulée à la dernière minute.","id":"phv:4:call-off"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get back to","fr":"répondre à quelqu'un plus tard","ex":"I'll get back to you by email tomorrow.","exFr":"Je te répondrai par email demain.","id":"phv:5:get-back-to"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get over","fr":"surmonter","ex":"It took her months to get over the breakup.","exFr":"Il lui a fallu des mois pour se remettre de la rupture.","id":"phv:5:get-over"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get away","fr":"s'évader, partir en vacances","ex":"We need to get away for a few days, just the two of us.","exFr":"On a besoin de s'évader quelques jours, juste nous deux.","id":"phv:5:get-away"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get by","fr":"se débrouiller","ex":"We don't earn much, but we manage to get by.","exFr":"On ne gagne pas grand-chose, mais on arrive à se débrouiller.","id":"phv:5:get-by"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get through (to)","fr":"réussir à joindre quelqu'un","ex":"I tried calling all morning but couldn't get through to him.","exFr":"J'ai essayé de l'appeler toute la matinée mais je n'ai pas réussi à le joindre.","id":"phv:5:get-through-to"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get into","fr":"se lancer dans, s'intéresser à","ex":"She's really getting into yoga lately.","exFr":"Elle s'est vraiment mise au yoga dernièrement.","id":"phv:5:get-into"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get out","fr":"sortir","ex":"Get out of the car, we're here!","exFr":"Sors de la voiture, on est arrivés !","id":"phv:5:get-out"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"get off","fr":"descendre (d'un bus, d'un train)","ex":"We need to get off at the next stop.","exFr":"On doit descendre au prochain arrêt.","id":"phv:5:get-off"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"go down","fr":"baisser, descendre","ex":"Prices have gone down a lot this year.","exFr":"Les prix ont beaucoup baissé cette année.","id":"phv:5:go-down"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"go up","fr":"augmenter","ex":"The price of coffee keeps going up.","exFr":"Le prix du café continue d'augmenter.","id":"phv:5:go-up"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"go off","fr":"se déclencher (alarme)","ex":"The alarm went off at 6am and scared everyone.","exFr":"L'alarme s'est déclenchée à 6h et a fait peur à tout le monde.","id":"phv:5:go-off"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"go ahead","fr":"allez-y, continuez","ex":"Go ahead, I'm listening.","exFr":"Vas-y, je t'écoute.","id":"phv:5:go-ahead"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"go through","fr":"traverser (une épreuve)","ex":"She's going through a really difficult time right now.","exFr":"Elle traverse une période vraiment difficile en ce moment.","id":"phv:5:go-through"},{"col":"phv","deck":5,"type":"phrase","tag":"verb","en":"go for","fr":"choisir, opter pour","ex":"I think I'll go for the chicken salad.","exFr":"Je pense que je vais prendre la salade de poulet.","id":"phv:5:go-for"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"come in","fr":"entrer","ex":"Come in, the door's open!","exFr":"Entre, la porte est ouverte !","id":"phv:6:come-in"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"come over","fr":"passer (chez quelqu'un)","ex":"Why don't you come over for dinner tonight?","exFr":"Pourquoi tu ne viendrais pas dîner ce soir ?","id":"phv:6:come-over"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"come round / come around","fr":"reprendre conscience","ex":"He fainted, but he came round a few minutes later.","exFr":"Il s'est évanoui, mais il a repris connaissance quelques minutes plus tard.","id":"phv:6:come-round-come-around"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"come along","fr":"venir avec, accompagner","ex":"We're going to the cinema, do you want to come along?","exFr":"On va au cinéma, tu veux venir avec nous ?","id":"phv:6:come-along"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"come down with","fr":"tomber malade de","ex":"I think I'm coming down with a cold.","exFr":"Je crois que je suis en train d'attraper un rhume.","id":"phv:6:come-down-with"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"look up","fr":"chercher (dans un dictionnaire)","ex":"If you don't know the word, look it up in the dictionary.","exFr":"Si tu ne connais pas le mot, cherche-le dans le dictionnaire.","id":"phv:6:look-up"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"look down on","fr":"mépriser","ex":"He always looks down on people who didn't go to university.","exFr":"Il méprise toujours les gens qui ne sont pas allés à l'université.","id":"phv:6:look-down-on"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"look into","fr":"enquêter sur","ex":"The police are looking into the case.","exFr":"La police enquête sur l'affaire.","id":"phv:6:look-into"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"look out","fr":"faire attention","ex":"Look out! There's a car coming!","exFr":"Attention ! Une voiture arrive !","id":"phv:6:look-out"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"look up to","fr":"admirer","ex":"She really looks up to her older sister.","exFr":"Elle admire vraiment beaucoup sa grande sœur.","id":"phv:6:look-up-to"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"think over","fr":"réfléchir à","ex":"Can I think it over and give you my answer tomorrow?","exFr":"Je peux y réfléchir et te donner ma réponse demain ?","id":"phv:6:think-over"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"set up","fr":"mettre en place, monter","ex":"It took us a whole weekend to set up the new office.","exFr":"Il nous a fallu tout un week-end pour installer le nouveau bureau.","id":"phv:6:set-up"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"set off","fr":"partir, se mettre en route","ex":"We need to set off early to avoid the traffic.","exFr":"On doit partir tôt pour éviter les embouteillages.","id":"phv:6:set-off"},{"col":"phv","deck":6,"type":"phrase","tag":"verb","en":"set out","fr":"se mettre en route / entreprendre de","ex":"He set out to prove that his idea would work.","exFr":"Il s'est mis en tête de prouver que son idée fonctionnerait.","id":"phv:6:set-out"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"bring back","fr":"rapporter","ex":"Can you bring back some bread when you come home?","exFr":"Tu peux rapporter du pain quand tu rentres ?","id":"phv:7:bring-back"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"bring down","fr":"faire baisser, faire tomber","ex":"The new policy helped bring down unemployment.","exFr":"La nouvelle politique a aidé à faire baisser le chômage.","id":"phv:7:bring-down"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"bring about","fr":"provoquer, causer","ex":"The new manager brought about a lot of changes.","exFr":"Le nouveau manager a provoqué beaucoup de changements.","id":"phv:7:bring-about"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"put off","fr":"reporter","ex":"Let's not put off this conversation any longer.","exFr":"Ne reportons plus cette conversation.","id":"phv:7:put-off"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"put up with","fr":"supporter","ex":"I don't know how she puts up with so much noise.","exFr":"Je ne sais pas comment elle supporte autant de bruit.","id":"phv:7:put-up-with"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"put away","fr":"ranger","ex":"Please put away your toys before dinner.","exFr":"Range tes jouets avant le dîner.","id":"phv:7:put-away"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"put together","fr":"assembler, monter","ex":"It took us hours to put together this presentation.","exFr":"Il nous a fallu des heures pour préparer cette présentation.","id":"phv:7:put-together"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"put forward","fr":"proposer","ex":"She put forward a great proposal at the meeting.","exFr":"Elle a proposé une excellente idée lors de la réunion.","id":"phv:7:put-forward"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"take back","fr":"retirer (ses propos)","ex":"I'm sorry, I take back what I said earlier.","exFr":"Je suis désolé, je retire ce que j'ai dit plus tôt.","id":"phv:7:take-back"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"take out","fr":"emmener, sortir avec","ex":"He's taking her out for dinner tonight.","exFr":"Il l'emmène dîner ce soir.","id":"phv:7:take-out"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"take over","fr":"prendre le relais, le contrôle","ex":"She's going to take over the project next month.","exFr":"Elle va prendre la direction du projet le mois prochain.","id":"phv:7:take-over"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"take in","fr":"héberger, accueillir","ex":"They decided to take in a stray cat.","exFr":"Ils ont décidé d'accueillir un chat errant.","id":"phv:7:take-in"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"take down","fr":"enlever, démonter","ex":"Can you take down this poster, it's old news now.","exFr":"Tu peux enlever cette affiche, ce n'est plus d'actualité.","id":"phv:7:take-down"},{"col":"phv","deck":7,"type":"phrase","tag":"verb","en":"turn into","fr":"se transformer en","ex":"The frog turned into a prince.","exFr":"La grenouille s'est transformée en prince.","id":"phv:7:turn-into"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"turn out","fr":"s'avérer","ex":"It turned out that he was right all along.","exFr":"Il s'est avéré qu'il avait raison depuis le début.","id":"phv:8:turn-out"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"turn down","fr":"refuser","ex":"She turned down the job offer.","exFr":"Elle a refusé l'offre d'emploi.","id":"phv:8:turn-down"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"turn around","fr":"redresser une situation","ex":"The company managed to turn things around last year.","exFr":"L'entreprise a réussi à redresser la situation l'année dernière.","id":"phv:8:turn-around"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"run into","fr":"rencontrer par hasard","ex":"I ran into my old teacher at the station.","exFr":"J'ai croisé mon ancien professeur à la gare, par hasard.","id":"phv:8:run-into"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"run away","fr":"s'enfuir","ex":"The dog ran away as soon as the door opened.","exFr":"Le chien s'est enfui dès que la porte s'est ouverte.","id":"phv:8:run-away"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"run over","fr":"écraser (avec un véhicule)","ex":"Be careful, you almost ran over that cat!","exFr":"Attention, tu as presque écrasé ce chat !","id":"phv:8:run-over"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"pull over","fr":"se garer sur le côté","ex":"The police asked him to pull over.","exFr":"La police lui a demandé de se garer sur le côté.","id":"phv:8:pull-over"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"pull through","fr":"s'en sortir, survivre","ex":"The doctors think she'll pull through.","exFr":"Les médecins pensent qu'elle va s'en sortir.","id":"phv:8:pull-through"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"hold up","fr":"retarder","ex":"Sorry I'm late, the traffic held me up.","exFr":"Désolé du retard, la circulation m'a retardé.","id":"phv:8:hold-up"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"hold off","fr":"retarder, repousser","ex":"Let's hold off on the decision until next week.","exFr":"Repoussons la décision à la semaine prochaine.","id":"phv:8:hold-off"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"speak up","fr":"parler plus fort","ex":"Can you speak up? I can't hear you.","exFr":"Tu peux parler plus fort ? Je ne t'entends pas.","id":"phv:8:speak-up"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"stand out","fr":"se démarquer","ex":"Her work really stands out from the rest.","exFr":"Son travail se démarque vraiment du reste.","id":"phv:8:stand-out"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"settle down","fr":"s'installer, se calmer","ex":"After years of travelling, they decided to settle down.","exFr":"Après des années de voyage, ils ont décidé de s'installer.","id":"phv:8:settle-down"},{"col":"phv","deck":8,"type":"phrase","tag":"verb","en":"calm down","fr":"se calmer","ex":"Calm down, everything is going to be fine.","exFr":"Calme-toi, tout va bien se passer.","id":"phv:8:calm-down"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"bring up","fr":"mentionner, soulever un sujet","ex":"There's something I want to bring up at the next meeting.","exFr":"Il y a quelque chose que je veux soulever à la prochaine réunion.","id":"phv:9:bring-up"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"get across","fr":"faire passer (un message)","ex":"Am I getting the message across clearly?","exFr":"Est-ce que je fais passer le message clairement ?","id":"phv:9:get-across"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"jump in","fr":"intervenir, prendre la parole","ex":"Do you mind if I jump in? I've got something to share.","exFr":"Ça te dérange si j'interviens ? J'ai quelque chose à dire.","id":"phv:9:jump-in"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"butt in","fr":"s'immiscer dans une conversation (grossier)","ex":"I was speaking with Sue and then Jim butted in.","exFr":"Je parlais avec Sue et Jim s'est immiscé dans la conversation.","id":"phv:9:butt-in"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"blurt out","fr":"lâcher sans réfléchir","ex":"I'm so sorry, I just blurted it out without thinking.","exFr":"Je suis vraiment désolé, je l'ai lâché sans réfléchir.","id":"phv:9:blurt-out"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"talk over","fr":"discuter pour trouver une solution","ex":"I know you're upset. Let's talk it over tonight.","exFr":"Je sais que tu es bouleversé. Discutons-en ce soir.","id":"phv:9:talk-over"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"talk round / talk around","fr":"convaincre, persuader","ex":"I didn't want to go but he succeeded in talking me round.","exFr":"Je ne voulais pas y aller mais il a réussi à me convaincre.","id":"phv:9:talk-round-talk-around"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"shut down","fr":"couper court, rejeter sèchement","ex":"My boss didn't like the suggestion. He shut me down straight away.","exFr":"Mon patron n'a pas aimé la suggestion. Il m'a coupé la parole directement.","id":"phv:9:shut-down"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"back up","fr":"soutenir, appuyer","ex":"Thanks for backing me up during the meeting.","exFr":"Merci de m'avoir soutenu pendant la réunion.","id":"phv:9:back-up"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"look back on","fr":"repenser à, regarder en arrière","ex":"I try to look back on my mistakes and learn from them.","exFr":"J'essaie de repenser à mes erreurs et d'en tirer des leçons.","id":"phv:9:look-back-on"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"look out for","fr":"veiller sur quelqu'un","ex":"My nephews are always looking out for each other at school.","exFr":"Mes neveux veillent toujours l'un sur l'autre à l'école.","id":"phv:9:look-out-for"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"look around","fr":"visiter, explorer un endroit","ex":"Before I book the venue, I'd like to come and look around.","exFr":"Avant de réserver la salle, j'aimerais venir la visiter.","id":"phv:9:look-around"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"look over","fr":"examiner rapidement","ex":"I'll look over the report tonight and let you know.","exFr":"Je vais parcourir le rapport ce soir et te dire ce que j'en pense.","id":"phv:9:look-over"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"look through","fr":"parcourir, feuilleter","ex":"I can spend hours looking through recipes for dinner inspiration.","exFr":"Je peux passer des heures à parcourir des recettes pour m'inspirer.","id":"phv:9:look-through"},{"col":"phv","deck":9,"type":"phrase","tag":"verb","en":"brush up on","fr":"se remettre à niveau, réviser","ex":"I'm brushing up on my Italian for a business trip in July.","exFr":"Je révise mon italien pour un voyage d'affaires en juillet.","id":"phv:9:brush-up-on"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"fill up","fr":"remplir jusqu'en haut","ex":"Can you fill up my glass with water, please?","exFr":"Tu peux remplir mon verre d'eau, s'il te plaît ?","id":"phv:10:fill-up"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"go without","fr":"se passer de quelque chose","ex":"They went without power for five days after the storm.","exFr":"Ils ont été sans électricité pendant cinq jours après la tempête.","id":"phv:10:go-without"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"come up","fr":"survenir, se présenter","ex":"Something's just come up so I need to cancel my appointment.","exFr":"Quelque chose vient de se présenter, je dois annuler mon rendez-vous.","id":"phv:10:come-up"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"come out","fr":"sortir, être révélé","ex":"After ten years, the truth finally came out.","exFr":"Après dix ans, la vérité a finalement été révélée.","id":"phv:10:come-out"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"come on","fr":"allez ! / se mettre en marche","ex":"Come on, we're going to be late!","exFr":"Allez, on va être en retard !","id":"phv:10:come-on"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"come down","fr":"baisser, descendre","ex":"There was a big storm last night and many trees came down.","exFr":"Il y a eu une grosse tempête hier soir et beaucoup d'arbres sont tombés.","id":"phv:10:come-down"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"come down on","fr":"punir, réprimander","ex":"My boss came down on me hard because I didn't finish the report.","exFr":"Mon patron m'a sévèrement réprimandé parce que je n'avais pas fini le rapport.","id":"phv:10:come-down-on"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"fight off","fr":"repousser (une maladie)","ex":"She came down with a cold but luckily she fought it off quickly.","exFr":"Elle a attrapé un rhume mais heureusement elle l'a surmonté rapidement.","id":"phv:10:fight-off"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"pass away","fr":"s'éteindre, décéder (poli)","ex":"When I talk about my dad, I say he passed away.","exFr":"Quand je parle de mon père, je dis qu'il s'est éteint.","id":"phv:10:pass-away"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"dip into","fr":"puiser dans (ses économies)","ex":"They dipped into their savings to pay for the renovation.","exFr":"Ils ont puisé dans leurs économies pour payer la rénovation.","id":"phv:10:dip-into"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"dress up","fr":"s'habiller élégamment","ex":"We dressed up for the occasion — it was a fancy dinner.","exFr":"On s'est habillés élégamment pour l'occasion — c'était un dîner chic.","id":"phv:10:dress-up"},{"col":"phv","deck":10,"type":"phrase","tag":"verb","en":"finish up","fr":"terminer, finir complètement <script>
/* ===================== DONNÉES ===================== */
const CARDS = DATA.cards;
const COLS = DATA.collections;
const GROUPS = DATA.groups;
const THUMBS = DATA.thumbs||{};
const COL = Object.fromEntries(COLS.map(c=>[c.id,c]));
const CARD = Object.fromEntries(CARDS.map(c=>[c.id,c]));
const BY_DECK = {};
for(const c of CARDS){ const k=c.col+':'+c.deck; (BY_DECK[k]=BY_DECK[k]||[]).push(c); }
const LVL = {1:'débutant',2:'intermédiaire',3:'avancé'};
const INTERVALS = [0,1,3,7,14,30,60];
const MASTER_BOX = 4;

/* ===================== ÉTAT PERSISTANT ===================== */
const KEY='flashcards-anglais-v1';
const DEFAULTS={mode:'fr',size:8,goal:10,auto:true,rate:0.92,voice:''};
let S = load();
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const s=JSON.parse(raw); s.settings={...DEFAULTS,...(s.settings||{})}; s.prog=s.prog||{}; s.days=s.days||{}; return s; } }catch(e){}
  return {settings:{...DEFAULTS},prog:{},days:{},last:null};
}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} },150); }
function todayIdx(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }
function todayKey(){ return String(todayIdx()); }

/* ===================== PROGRESSION ===================== */
function prog(id){ return S.prog[id]; }
function isMastered(id){ const p=S.prog[id]; return !!p && p.b>=MASTER_BOX; }
function isSeen(id){ const p=S.prog[id]; return !!p && p.b>=1; }
function isDue(id){ const p=S.prog[id]; return !!p && p.b>=1 && p.d<=todayIdx(); }
function dueCards(filter){ return CARDS.filter(c=>isDue(c.id) && (!filter||filter(c))); }
function markKnown(id,failedThisSession){
  const t=todayIdx(); let p=S.prog[id];
  if(!p){ p={b:1,d:t+1,s:0,l:0}; }
  else if(failedThisSession){ p.b=1; p.d=t+1; }
  else { p.b=Math.min(p.b+1,INTERVALS.length-1); p.d=t+INTERVALS[p.b]; }
  p.s=(p.s||0)+1; S.prog[id]=p; save();
}
function markFail(id){
  const t=todayIdx(); let p=S.prog[id]||{b:0,d:t,s:0,l:0};
  p.b=0; p.d=t; p.l=(p.l||0)+1; p.s=(p.s||0)+1; S.prog[id]=p; save();
}
function bumpToday(){ S.days[todayKey()]=(S.days[todayKey()]||0)+1; save(); }
function streak(){
  let n=0,t=todayIdx(); if(!S.days[String(t)]) t--; while(S.days[String(t)]){ n++; t--; } return n;
}

/* ===================== PAQUETS ===================== */
function deckCards(col,deck){ return BY_DECK[col+':'+deck]||[]; }
function groupsOf(col,deck){
  const cards=deckCards(col,deck); const size=S.settings.size; const n=cards.length;
  if(!n) return [];
  const k=Math.ceil(n/size); const base=Math.floor(n/k); const rem=n%k;
  const out=[]; let i=0;
  for(let g=0; g<k; g++){ const len=base+(g<rem?1:0); out.push(cards.slice(i,i+len)); i+=len; }
  return out;
}
function groupState(cards){
  const m=cards.filter(c=>isMastered(c.id)).length, s=cards.filter(c=>isSeen(c.id)).length, d=cards.filter(c=>isDue(c.id)).length;
  if(d) return 'due';
  if(s===cards.length) return 'done';
  if(s>0) return 'learn';
  return 'new';
}
function colStats(colId){
  const cs=CARDS.filter(c=>c.col===colId);
  return {total:cs.length, mastered:cs.filter(c=>isMastered(c.id)).length, seen:cs.filter(c=>isSeen(c.id)).length, due:cs.filter(c=>isDue(c.id)).length};
}
function nextGroup(from){
  // prochain paquet non terminé après "from" {col,deck,g} ; sinon premier non terminé de la collection ; sinon null
  const order=[]; for(const col of COLS){ col.decks.forEach((_,di)=>{ groupsOf(col.id,di+1).forEach((cards,gi)=>order.push({col:col.id,deck:di+1,g:gi,cards})); }); }
  let start=0;
  if(from){ const i=order.findIndex(o=>o.col===from.col&&o.deck===from.deck&&o.g===from.g); if(i>=0) start=i+1; }
  for(let i=0;i<order.length;i++){ const o=order[(start+i)%order.length]; if(from && o.col!==from.col && i>0 && (start+i)>=order.length) break; if(groupState(o.cards)!=='done') return o; }
  for(const o of order){ if(groupState(o.cards)!=='done') return o; }
  return null;
}
function randomGroup(){
  const pool=[]; for(const col of COLS){ col.decks.forEach((_,di)=>{ groupsOf(col.id,di+1).forEach((cards,gi)=>{ if(groupState(cards)!=='done') pool.push({col:col.id,deck:di+1,g:gi,cards}); }); }); }
  if(!pool.length) return null; return pool[Math.floor(Math.random()*pool.length)];
}

/* ===================== UTILITAIRES ===================== */
const $=sel=>document.querySelector(sel);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
function toast(msg,ms=1800){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function confetti(n=36){ const colors=['#E3A23C','#5FAE7E','#D9534F','#7FA8D9','#F4ECD8']; for(let i=0;i<n;i++){ const el=document.createElement('div'); el.className='confetti'; el.style.left=Math.random()*100+'vw'; el.style.background=colors[i%colors.length]; el.style.animationDuration=(2.2+Math.random()*1.6)+'s'; el.style.transform=`rotate(${Math.random()*360}deg)`; document.body.appendChild(el); setTimeout(()=>el.remove(),4200); } }
function pluriel(n,s,p){ return n+' '+(n>1?(p||s+'s'):s); }

/* ===================== VOIX (anglais britannique) ===================== */
let voices=[];
function loadVoices(){ try{ voices=speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function englishVoices(){ return voices.filter(v=>/^en([-_]|$)/i.test(v.lang)); }
function pickVoice(){
  const want=S.settings.voice; if(want){ const v=voices.find(v=>v.name===want); if(v) return v; }
  const en=englishVoices(); const gb=en.filter(v=>/en[-_]GB/i.test(v.lang));
  return gb.find(v=>/Google UK English Female/i.test(v.name)) || gb.find(v=>/Google/i.test(v.name)) || gb.find(v=>/Daniel|Serena|Kate|Martha|Arthur|Sonia|Libby|Hazel|Susan/i.test(v.name)) || gb[0]
      || en.find(v=>/Google/i.test(v.name)) || en[0] || null;
}
let speakingBtns=[];
function speak(text){
  if(!text) return;
  if(!('speechSynthesis' in window)){ toast('Synthèse vocale non disponible sur ce navigateur'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-GB';
  u.rate=S.settings.rate; u.pitch=1;
  const on=()=>document.querySelectorAll('.speak-btn').forEach(b=>b.classList.add('playing'));
  const off=()=>document.querySelectorAll('.speak-btn').forEach(b=>b.classList.remove('playing'));
  u.onstart=on; u.onend=off; u.onerror=off;
  setTimeout(()=>{ try{ speechSynthesis.speak(u); }catch(e){ off(); } },40);
}
function speechText(c){
  switch(c.type){
    case 'verb': return `${c.en}, ${c.pret.replace(/\s*\/\s*/g,', ')}, ${c.pp.replace(/\s*\(.*?\)/g,'').replace(/\s*\/\s*/g,', ')}`;
    case 'alpha': return c.en;
    case 'err': return c.en;
    case 'rule': return c.en.replace(/[≠—]/g,' ... ');
    default: return c.en.replace(/\s*\/\s*/g,' ... ');
  }
}

/* ===================== IMAGES WIKIPÉDIA ===================== */
const imgCache={};
async function wikiImage(c){
  if(!c.wiki) return c.fb||null;
  if(imgCache[c.wiki]!==undefined) return imgCache[c.wiki];
  try{
    const url=`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(c.wiki)}&prop=pageimages&format=json&pithumbsize=600&pilicense=any&redirects=1&origin=*`;
    const r=await fetch(url); const j=await r.json(); const page=Object.values(j.query.pages)[0];
    imgCache[c.wiki]=(page&&page.thumbnail&&page.thumbnail.source)||c.fb||null;
  }catch(e){ imgCache[c.wiki]=c.fb||null; }
  return imgCache[c.wiki];
}

/* ---------- SESSION ---------- */
function startGroup(col,deck,g){
  const groups=groupsOf(col,deck); const cards=groups[g]; if(!cards) return;
  S.last={col,deck,g}; save();
  sess={kind:'group',col,deck,g,title:`${COL[col].decks[deck-1]} · paquet ${g+1}/${groups.length}`,queue:shuffle(cards),pos:0,total:cards.length,failed:new Set(),answered:new Set(),firstTry:0,flipped:false};
  go({name:'session'});
}
function startReview(colId){
  let due=dueCards(colId?c=>c.col===colId:null);
  if(!due.length){ toast('Rien à réviser pour le moment'); return; }
  due.sort((a,b)=>S.prog[a.id].d-S.prog[b.id].d);
  const remaining=due.length; const batch=shuffle(due.slice(0,Math.max(S.settings.size,Math.min(10,due.length))).slice(0,S.settings.size));
  sess={kind:'review',col:colId||null,title:colId?`Révision · ${COL[colId].title}`:'Révision du jour',queue:batch,pos:0,total:batch.length,remaining,failed:new Set(),answered:new Set(),firstTry:0,flipped:false};
  go({name:'session'});
}
function current(){ return sess&&sess.queue[sess.pos]; }

function renderSession(){
  const c=current(); if(!c){ finish(); return; }

function speaksOnFront(c,mode){ if(c.type==='err'||c.type==='pron') return false; if(c.type==='num'||c.type==='alpha') return mode==='en'; return mode==='en'; }

function badges(c,colId){

function face(c,side,mode){
  const col=COL[c.col]; const deckName=col.decks[c.deck-1];
  const tag=`<div class="card-tag">${esc(deckName)}</div>`;
  const spk=`<button class="speak-btn" data-action="speak" title="Écouter (S)" aria-label="Écouter">🔊</button>`;

  const exFr=c.exFr?`<div class="example-fr">${esc(c.exFr)}</div>`:'';
  const note=c.note?`<div class="note">💡 ${esc(c.note)}</div>`:'';
  const B=badges(c,c.col);
  const frontIsFr = mode==='fr';
  switch(c.type){
    case 'noun': {
      const img=`<div class="img-wrap" id="imgwrap"><span class="ph">📷</span><img id="cardimg" alt=""></div>`;
      if(side==='front') return frontIsFr? `${tag}${B}<div class="main">${esc(c.fr)}</div>${hint}` : `${tag}${spk}${B}<div class="main">${esc(c.en)}</div><div class="ipa">${esc(c.ph||'')}</div>${hint}`;
      return frontIsFr? `${tag}${spk}${img}<div class="main mint">${esc(c.en)}</div><div class="ipa">${esc(c.ph||'')}</div>${exEn}${note}` : `${tag}${spk}${img}<div class="main">${esc(c.fr)}</div>${exEn}${note}`;
    }
    case 'verb': {
      const forms=`<div class="forms"><div><small>infinitif</small><b>${esc(c.en)}</b></div><div><small>prétérit</small><b>${esc(c.pret)}</b></div><div><small>participe</small><b>${esc(c.pp)}</b></div></div>`;
      if(side==='front') return frontIsFr? `${tag}${B}<div class="main">${esc(c.fr)}</div><div class="ipa">verbe irrégulier</div>${hint}` : `${tag}${spk}${B}<div class="main">${esc(c.en)}</div><div class="ipa">prétérit ? participe passé ?</div>${hint}`;
      return frontIsFr? `${tag}${spk}${forms}${exEn}${exFr}` : `${tag}${spk}<div class="main">${esc(c.fr)}</div>${forms}${exEn}${exFr}`;
    }
    case 'num': {
      const phon=col.phon?c.en.split(/[\s,]+/).map(w=>w.split('-').map(p=>col.phon[p.toLowerCase()]||p).join('-')).join(' '):'';
      if(side==='front') return frontIsFr? `${tag}${B}<div class="main huge">${fmtNum(c.num)}</div><div class="ipa">${esc(c.fr)}</div>${hint}` : `${tag}${spk}${B}<div class="main small">${esc(c.en)}</div>${hint}`;
      return frontIsFr? `${tag}${spk}<div class="main mint small">${esc(c.en)}</div><div class="pho">${esc(phon)}</div>` : `${tag}${spk}<div class="main huge">${fmtNum(c.num)}</div><div class="ipa">${esc(c.fr)}</div><div class="pho">${esc(phon)}</div>`;
    }
    case 'alpha': {
      if(side==='front') return `${tag}${B}<div class="main huge">${esc(c.en)}</div><div class="ipa">comment ça se dit ?</div>${hint}`;
      return `${tag}${spk}<div class="main huge mint">${esc(c.en)}</div><div class="main small">« ${esc(c.fr)} »</div><div class="ipa">${esc(c.ph||'')}</div>${exEn}${exFr}`;
    }
    case 'err': {
      if(side==='front') return `${tag}${B}<div class="ipa">❌ Corrige la phrase</div><div class="main bad small">${esc(c.bad)}</div><div class="example-fr">${esc(c.fr)}</div>${hint}`;
      return `${tag}${spk}<div class="ipa">✅ Correct</div><div class="main mint">${esc(c.en)}</div><div class="example-fr">${esc(c.fr)}</div>${note}`;
    }
    case 'pron': {
      if(side==='front') return `${tag}${B}<div class="ipa">Comment prononcer ?</div><div class="main">${esc(c.en)}</div><div class="example-fr">${esc(c.fr)}</div>${hint}`;
      return `${tag}${spk}<div class="main mint">${esc(c.en)}</div><div class="ipa">${esc(c.ph||'')}</div><div class="pho">≈ « ${esc(c.pho||'')} »</div>${note}`;
    }
    case 'rule': {
      if(side==='front') return frontIsFr? `${tag}${B}<div class="main small">${esc(c.fr)}</div>${c.exFr?`<div class="example-fr">${esc(c.exFr)}</div>`:''}${hint}` : `${tag}${spk}${B}<div class="main small">${esc(c.en)}</div>${hint}`;
      return frontIsFr? `${tag}${spk}<div class="main mint small">${esc(c.en)}</div>${c.pho?`<div class="pho">${esc(c.pho)}</div>`:''}${exEn}${exFr}${note}` : `${tag}${spk}<div class="main small">${esc(c.fr)}</div>${exEn}${exFr}${note}`;
    }
    default: { // phrase
      if(side==='front') return frontIsFr? `${tag}${B}<div class="main">${esc(c.fr)}</div>${c.exFr?`<div class="example">« ${esc(c.exFr)} »</div>`:''}${hint}` : `${tag}${spk}${B}<div class="main">${esc(c.en)}</div>${c.pho?`<div class="pho">${esc(c.pho)}</div>`:''}${exEn}${hint}`;
      return frontIsFr? `${tag}${spk}<div class="main mint">${esc(c.en)}</div>${c.pho?`<div class="pho">${esc(c.pho)}</div>`:''}${exEn}${exFr}${note}` : `${tag}${spk}<div class="main">${esc(c.fr)}</div>${exFr}${exEn}${note}`;
    }
  }
}
async function loadCardImage(c){
  const img=document.getElementById('cardimg'); const wrap=document.getElementById('imgwrap'); if(!img||!wrap) return;
  const show=()=>{ img.classList.add('on'); const ph=wrap.querySelector('.ph'); if(ph) ph.remove(); };
  const emb=THUMBS[c.wiki];
  if(emb){ img.onload=show; img.src=emb; }
  // puis, si le réseau le permet, une image plus grande
  const src=await wikiImage(c); if(!src||current()!==c) return;
  const hi=new Image(); hi.onload=()=>{ if(current()!==c) return; img.src=src; show(); }; hi.src=src;
}
function flip(){ if(!sess) return; sess.flipped=!sess.flipped; const el=document.getElementById('card'); if(el) el.classList.toggle('flipped',sess.flipped); const c=current(); if(sess.flipped && S.settings.auto && c && !speaksOnFront(c,S.settings.mode)) speak(speechText(c)); }
function answer(known){
  const c=current(); if(!c) return;
  const first=!sess.answered.has(c.id);
  if(first){ sess.answered.add(c.id); bumpToday(); }
  if(known){ markKnown(c.id,sess.failed.has(c.id)); if(first&&!sess.failed.has(c.id)) sess.firstTry++; sess.pos++; }
  else { markFail(c.id); sess.failed.add(c.id); sess.pos++; const at=Math.min(sess.pos+3,sess.queue.length); sess.queue.splice(at,0,c); toast('On la reverra dans un instant ↻',1200); }
  sess.flipped=false;
  if(sess.pos>=sess.queue.length) finish(); else { renderSession(); const el=document.getElementById('card'); if(el){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'),300); } }
}
function finish(){ try{ speechSynthesis.cancel(); }catch(e){} go({name:'end'}); }
function renderEnd(){
  const unique=sess.total, ft=sess.firstTry; const perfect=ft===unique;
  let title,sub,emoji;
  if(sess.kind==='review'){ const left=dueCards(sess.col?c=>c.col===sess.col:null).length; title=left?'Bien joué !':'Révision terminée 🏆'; emoji=left?'💪':'🎉'; sub=`${unique} cartes revues, ${ft} du premier coup.${left?` Il en reste ${left} à revoir aujourd'hui.`:' Plus rien à revoir aujourd\'hui !'}`; }
  else { title=perfect?'Paquet maîtrisé !':'Paquet terminé !'; emoji=perfect?'🏆':'🎉'; sub=`${unique} cartes · ${ft} du premier coup${perfect?' · sans faute !':''}. Elles reviendront dans la révision du jour.`; }
  const nxt=sess.kind==='group'?nextGroup({col:sess.col,deck:sess.deck,g:sess.g}):null;
  const left=sess.kind==='review'?dueCards(sess.col?c=>c.col===sess.col:null).length:0;
  const today=S.days[todayKey()]||0;
  app.innerHTML=`<div class="end"><span class="emoji">${emoji}</span><h2>${title}</h2><p>${esc(sub)}<br><span class="mono" style="font-size:11px">Aujourd'hui : ${today} cartes · 🔥 ${pluriel(streak(),'jour')}</span></p>
  <div class="stack">
    ${left?`<button class="btn-primary" data-action="review" data-col="${sess.col||''}">Continuer la révision (${left})</button>`:''}
    ${nxt?`<button class="btn-primary" data-action="go-group" data-col="${nxt.col}" data-deck="${nxt.deck}" data-g="${nxt.g}">Paquet suivant → ${esc(COL[nxt.col].decks[nxt.deck-1])} ${nxt.g+1}</button>`:''}
    ${sess.kind==='group'?`<button class="btn-secondary" data-action="go-group" data-col="${sess.col}" data-deck="${sess.deck}" data-g="${sess.g}">Refaire ce paquet</button>`:''}
    <button class="btn-secondary" data-action="${sess.kind==='group'?'col':'home'}" data-col="${sess.col||''}">${sess.kind==='group'?'Retour au thème':'Retour à l\'accueil'}</button>
  </div></div>`;
  if(perfect||sess.kind==='review') confetti(perfect?40:18);
}

/* ---------- GESTES SUR LA CARTE ---------- */
function attachCard(){
  const el=document.getElementById('card'); if(!el) return;
  let sx=0,sy=0,dx=0,dragging=false,moved=false,pid=null;
  el.addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; sx=e.clientX; sy=e.clientY; dx=0; dragging=true; moved=false; pid=e.pointerId; try{ el.setPointerCapture(pid); }catch(err){} });
  el.addEventListener('pointermove',e=>{ if(!dragging) return; dx=e.clientX-sx; const dy=e.clientY-sy; if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true; if(Math.abs(dx)>Math.abs(dy)){ el.classList.add('dragging'); el.style.transform=`translateX(${dx}px) rotate(${dx/30}deg) ${sess.flipped?'rotateY(180deg)':''}`; el.classList.toggle('drag-right',dx>60); el.classList.toggle('drag-left',dx<-60); } });
  const end=e=>{ if(!dragging) return; dragging=false; el.classList.remove('dragging','drag-left','drag-right'); el.style.transform='';
    if(Math.abs(dx)>80){ answer(dx>0); return; }
    if(!moved && !e.target.closest('button')) flip(); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
}

/* ---------- RÉGLAGES ---------- */
function openSettings(){
  const s=S.settings; const en=englishVoices(); const cur=pickVoice();
  const bg=document.createElement('div'); bg.className='sheet-bg'; bg.id='sheet';
  const opt=en.map(v=>`<option value="${esc(v.name)}" ${cur&&cur.name===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  bg.innerHTML=`<div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>Réglages</h3><button class="icon-btn" data-action="close-sheet">✕</button></div>
    <div class="setting"><div class="lbl"><b>Sens des cartes</b><small>FR → EN : tu dois trouver l'anglais (recommandé)</small></div><div class="seg"><button data-set="mode" data-v="fr" class="${s.mode==='fr'?'active':''}">FR→EN</button><button data-set="mode" data-v="en" class="${s.mode==='en'?'active':''}">EN→FR</button></div></div>
    <div class="setting"><div class="lbl"><b>Taille des paquets</b><small>Nombre de cartes par petit paquet</small></div><div class="seg">${[5,8,10].map(n=>`<button data-set="size" data-v="${n}" class="${s.size===n?'active':''}">${n}</button>`).join('')}</div></div>
    <div class="setting"><div class="lbl"><b>Objectif du jour</b><small>Cartes à faire chaque jour</small></div><div class="seg">${[5,10,20,30].map(n=>`<button data-set="goal" data-v="${n}" class="${s.goal===n?'active':''}">${n}</button>`).join('')}</div></div>
    <div class="setting"><div class="lbl"><b>Lecture automatique</b><small>Prononce l'anglais dès qu'il apparaît</small></div><div class="seg"><button data-set="auto" data-v="1" class="${s.auto?'active':''}">Oui</button><button data-set="auto" data-v="0" class="${!s.auto?'active':''}">Non</button></div></div>
    <div class="setting"><div class="lbl"><b>Vitesse de la voix</b></div><div class="seg"><button data-set="rate" data-v="0.8" class="${s.rate===0.8?'active':''}">Lente</button><button data-set="rate" data-v="0.92" class="${s.rate===0.92?'active':''}">Normale</button><button data-set="rate" data-v="1.05" class="${s.rate===1.05?'active':''}">Rapide</button></div></div>
    <div class="setting"><div class="lbl"><b>Voix anglaise</b><small>${en.length?`${en.length} voix anglaises disponibles · britannique choisie par défaut`:'Aucune voix anglaise trouvée : installe-en une dans les réglages du téléphone (Synthèse vocale → anglais Royaume-Uni)'}</small></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">${en.length?`<select data-set="voice"><option value="">Automatique (en-GB)</option>${opt}</select>`:''}<button class="small-btn" data-action="test-voice">▶ Tester</button></div></div>
    <div class="setting"><div class="lbl"><b>Progression</b><small>Sauvegardée dans ce navigateur. Exporte-la pour changer d'appareil.</small></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="small-btn" data-action="export">Exporter</button><button class="small-btn" data-action="import">Importer</button><button class="small-btn danger" data-action="reset">Effacer</button></div></div>
    <div id="io" class="hidden" style="padding:10px 0"><textarea id="iotext" rows="4" style="width:100%" placeholder="Colle ici ta sauvegarde exportée, puis « Charger »."></textarea><div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end"><button class="small-btn" data-action="copy">Copier</button><button class="small-btn" data-action="load">Charger</button></div></div>
    <p class="sub" style="margin-top:14px">Raccourcis clavier : espace = retourner · → je savais · ← à revoir · S = écouter · Échap = quitter.</p>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('click',e=>{ if(e.target===bg) closeSettings(); });
  bg.addEventListener('change',e=>{ const t=e.target; if(t.dataset.set==='voice'){ S.settings.voice=t.value; save(); } });
}
function closeSettings(){ const el=document.getElementById('sheet'); if(el) el.remove(); render(); }
function setSetting(k,v){
  if(k==='mode') S.settings.mode=v; else if(k==='size') S.settings.size=+v; else if(k==='goal') S.settings.goal=+v; else if(k==='auto') S.settings.auto=v==='1'; else if(k==='rate') S.settings.rate=+v;
  save(); const sheet=document.getElementById('sheet'); if(sheet){ sheet.remove(); openSettings(); }
}

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action],[data-set]'); if(!b) return;
  if(b.dataset.set){ setSetting(b.dataset.set,b.dataset.v); return; }
  const a=b.dataset.action; const d=b.dataset;
  switch(a){
    case 'settings': openSettings(); break;
    case 'close-sheet': closeSettings(); break;
    case 'mode': S.settings.mode=d.v; save(); render(); break;
    case 'col': go({name:'col',col:d.col}); break;
    case 'home': sess=null; go({name:'home'}); break;
    case 'group': case 'go-group': startGroup(d.col,+d.deck,+d.g); break;
    case 'next': { const n=nextGroup(S.last); if(n) startGroup(n.col,n.deck,n.g); break; }
    case 'random': { const n=randomGroup(); if(n) startGroup(n.col,n.deck,n.g); else toast('Tout est terminé !'); break; }
    case 'review': startReview(d.col||null); break;
    case 'quit': { try{speechSynthesis.cancel();}catch(err){} const col=sess&&sess.kind==='group'?sess.col:null; sess=null; go(col?{name:'col',col}:{name:'home'}); break; }
    case 'fail': answer(false); break;
    case 'known': answer(true); break;
    case 'speak': e.stopPropagation(); { const c=current(); if(c) speak(speechText(c)); } break;
    case 'speak-ex': e.stopPropagation(); { const c=current(); if(c&&c.ex) speak(c.ex); } break;
    case 'test-voice': speak("Hello! I've been travelling around Asia for three years. Do you fancy grabbing a coffee?"); break;
    case 'export': { const io=document.getElementById('io'); io.classList.remove('hidden'); document.getElementById('iotext').value=JSON.stringify(S); break; }
    case 'import': { const io=document.getElementById('io'); io.classList.remove('hidden'); document.getElementById('iotext').value=''; document.getElementById('iotext').focus(); break; }
    case 'copy': { const t=document.getElementById('iotext'); t.select(); try{ navigator.clipboard.writeText(t.value); toast('Copié !'); }catch(err){ document.execCommand('copy'); toast('Copié !'); } break; }
    case 'load': { try{ const v=JSON.parse(document.getElementById('iotext').value); if(!v||!v.prog) throw 0; S={...S,...v,settings:{...DEFAULTS,...(v.settings||{})}}; save(); toast('Progression chargée ✓'); closeSettings(); }catch(err){ toast('Sauvegarde invalide'); } break; }
    case 'reset': { if(b.dataset.armed){ S.prog={}; S.days={}; S.last=null; save(); toast('Progression effacée'); closeSettings(); } else { b.dataset.armed='1'; b.textContent='Confirmer ?'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent='Effacer'; } },4000); } break; }
  }
});
document.addEventListener('keydown',e=>{
  if(document.getElementById('sheet')){ if(e.key==='Escape') closeSettings(); return; }
  if(view.name!=='session') return;
  if(e.code==='Space'){ e.preventDefault(); flip(); }
  else if(e.code==='ArrowRight') answer(true);
  else if(e.code==='ArrowLeft') answer(false);
  else if(e.code==='KeyS'){ const c=current(); if(c) speak(speechText(c)); }
  else if(e.key==='Escape'){ const col=sess&&sess.kind==='group'?sess.col:null; sess=null; go(col?{name:'col',col}:{name:'home'}); }
});
window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} });

render();
</script>
