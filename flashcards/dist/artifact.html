<style>
:root{
  --bg:#1C2541;--bg-deep:#141B33;--bg-soft:#2A3768;
  --paper:#F4ECD8;--paper-line:#D9CDAF;--ink:#2A2330;
  --amber:#E3A23C;--coral:#D9534F;--mint:#5FAE7E;--sky:#7FA8D9;--muted:#8A93B8;--purple:#9B72CF;
  --card-bg:rgba(255,255,255,.05);--card-line:rgba(255,255,255,.1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{color-scheme:dark;}
body{background:var(--bg) radial-gradient(circle at 50% -10%,var(--bg-soft) 0%,var(--bg) 45%,var(--bg-deep) 100%);background-attachment:fixed;font-family:'Inter',system-ui,sans-serif;color:var(--paper);min-height:100vh;padding-block:16px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;line-height:1.45;}
button{font-family:inherit;color:inherit;}
.wrap{max-width:560px;margin:0 auto;}
.mono{font-family:'Space Mono',ui-monospace,monospace;}
.serif{font-family:'Fraunces',Georgia,serif;}
.eyebrow{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(24px,6vw,34px);margin:4px 0 4px;line-height:1.1;}
h2{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:18px;margin:22px 0 10px;}
p.sub{color:var(--muted);font-size:13.5px;margin:0 0 8px;}
.hidden{display:none!important;}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;min-height:40px;}
.topbar .title{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--card-line);background:var(--card-bg);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.icon-btn:active{transform:scale(.94);}

/* mode toggle */
.mode-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:4px;width:fit-content;margin:10px auto 0;}
.mode-btn{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--muted);background:transparent;transition:all .2s;}
.mode-btn.active{background:var(--paper);color:var(--ink);font-weight:700;}

/* today panel */
.panel{background:var(--card-bg);border:1px solid var(--card-line);border-radius:18px;padding:16px;margin-top:16px;}
.today-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.streak{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;color:var(--amber);}
.goal{display:flex;align-items:center;gap:12px;margin:10px 0 14px;}
.ring{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center;flex:0 0 auto;}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:'Space Mono',ui-monospace,monospace;font-size:12px;font-weight:700;}
.goal .txt{font-size:13.5px;color:var(--muted);}
.goal .txt b{color:var(--paper);font-weight:600;}
.big-btn{width:100%;border:none;border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px;margin-top:8px;transition:transform .1s;}
.big-btn:active{transform:scale(.98);}
.big-btn .ic{font-size:22px;flex:0 0 auto;}
.big-btn .lb{flex:1;min-width:0;}
.big-btn .lb b{display:block;font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:700;}
.big-btn .lb small{display:block;font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.big-btn.primary{background:var(--amber);color:var(--ink);}
.big-btn.secondary{background:rgba(255,255,255,.08);color:var(--paper);border:1px solid var(--card-line);}
.big-btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--card-line);}
.big-btn:disabled{opacity:.45;cursor:default;}

/* collection rows */
.group-title{display:flex;align-items:center;gap:8px;margin:26px 0 8px;font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--card-bg);border:1px solid var(--card-line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left;transition:background .15s,transform .1s;}
.row:hover{background:rgba(255,255,255,.08);}
.row:active{transform:scale(.99);}
.row .ic{font-size:24px;width:34px;text-align:center;flex:0 0 auto;}
.row .body{flex:1;min-width:0;}
.row .name{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:15.5px;line-height:1.2;}
.row .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center;}
.row .chev{color:var(--muted);font-size:18px;flex:0 0 auto;}
.bar{height:5px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:7px;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--mint));border-radius:999px;transition:width .35s;}
.bar.learn i{background:var(--sky);}
.due-pill{font-family:'Space Mono',ui-monospace,monospace;font-size:10.5px;color:var(--coral);background:rgba(217,83,79,.14);border-radius:999px;padding:1px 7px;}
.ok-pill{font-family:'Space Mono',ui-monospace,monospace;font-size:10.5px;color:var(--mint);background:rgba(95,174,126,.14);border-radius:999px;padding:1px 7px;}

/* deck list */
.deck{background:var(--card-bg);border:1px solid var(--card-line);border-radius:16px;padding:12px 14px;margin-bottom:10px;}
.deck-head{display:flex;align-items:center;gap:10px;}
.deck-num{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;color:var(--amber);width:22px;flex:0 0 auto;}
.deck-name{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:15px;flex:1;}
.deck-count{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.chip{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;border-radius:999px;padding:7px 12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--paper);cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;}
.chip:active{transform:scale(.96);}
.chip.done{border-color:rgba(95,174,126,.5);color:#9be0b8;background:rgba(95,174,126,.12);}
.chip.learn{border-color:rgba(127,168,217,.5);color:#bcd6f5;background:rgba(127,168,217,.12);}
.chip.due{border-color:rgba(217,83,79,.5);color:#f3a3a0;background:rgba(217,83,79,.12);}
.chip.next{border-color:var(--amber);color:var(--amber);background:rgba(227,162,60,.12);}
.chip small{opacity:.7;font-size:10px;}

/* session */
.sess-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.sess-top .counter{font-family:'Space Mono',ui-monospace,monospace;font-size:12px;color:var(--muted);}
.progress-track{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px 0 14px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--mint));border-radius:999px;width:0%;transition:width .35s ease;}
.stage{perspective:1400px;margin:6px 0 14px;touch-action:pan-y;}
.card{position:relative;width:100%;min-height:min(54vh,400px);cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);}
.card.dragging{transition:none;}
.card.flipped{transform:rotateY(180deg);}
.card.pop{animation:pop .3s ease;}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.03);}100%{transform:scale(1);}}
.face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px 44px;box-shadow:0 12px 0 0 rgba(0,0,0,.18),0 20px 40px rgba(0,0,0,.25);overflow:hidden;}
.face.front{background:var(--paper);color:var(--ink);border:2px solid var(--paper-line);}
.face.back{background:linear-gradient(160deg,#2C3B6E,#1F2C50);color:var(--paper);border:2px solid rgba(255,255,255,.12);transform:rotateY(180deg);}
.card-tag{font-family:'Space Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.55;position:absolute;top:16px;left:18px;right:64px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.badge{display:inline-block;font-family:'Space Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-weight:700;background:rgba(42,35,48,.08);color:#5a4f63;}
.face.back .badge{background:rgba(255,255,255,.12);color:#d7dcef;}
.badge.lvl1{background:rgba(95,174,126,.18);color:#2f6b45;}.badge.lvl2{background:rgba(127,168,217,.22);color:#2a4d75;}.badge.lvl3{background:rgba(217,83,79,.16);color:#a33632;}
.face.back .badge.lvl1{color:#9be0b8;}.face.back .badge.lvl2{color:#bcd6f5;}.face.back .badge.lvl3{color:#f3a3a0;}
.badge.comp{background:rgba(155,114,207,.18);color:#6a4a9c;}.face.back .badge.comp{color:#d3bff2;}
.main{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(20px,5.6vw,30px);line-height:1.22;margin:0 0 10px;max-width:100%;overflow-wrap:anywhere;}
.main.small{font-size:clamp(17px,4.6vw,24px);font-weight:700;}
.face.back .main{color:var(--amber);}
.face.back .main.mint{color:var(--mint);}
.main.huge{font-size:clamp(40px,14vw,72px);letter-spacing:.02em;}
.main.bad{color:#a33632;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(217,83,79,.6);}
.ipa{font-family:'Space Mono',ui-monospace,monospace;font-size:14px;opacity:.7;margin-bottom:8px;}
.pho{font-family:'Space Mono',ui-monospace,monospace;font-size:13px;color:var(--sky);margin-bottom:8px;}
.example{font-size:13.5px;line-height:1.55;font-style:italic;opacity:.75;max-width:360px;}
.example-fr{font-size:13px;line-height:1.55;opacity:.65;max-width:360px;margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12);}
.face.front .example-fr{border-color:rgba(42,35,48,.15);}
.note{font-size:12.5px;line-height:1.5;max-width:360px;margin-top:10px;padding:8px 12px;border-radius:10px;background:rgba(227,162,60,.14);color:#f5d9a3;text-align:left;}
.face.front .note{background:rgba(42,35,48,.07);color:#5a4f63;}
.forms{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:4px 0 10px;}
.forms div{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 10px;min-width:80px;}
.forms small{display:block;font-family:'Space Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;}
.forms b{font-family:'Fraunces',Georgia,serif;font-size:16px;}
.hint{font-family:'Space Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--sky);position:absolute;bottom:14px;left:0;right:0;opacity:.7;}
.face.front .hint{color:#7a86b0;}
.img-wrap{width:100%;max-width:300px;height:150px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25);margin:0 auto 10px;display:grid;place-items:center;position:relative;}
.img-wrap img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .4s;}
.img-wrap img.on{opacity:1;}
.img-wrap .ph{position:absolute;font-size:28px;opacity:.5;}
.speak-btn{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:transform .15s,background .15s;z-index:2;}
.face.front .speak-btn{background:rgba(42,35,48,.08);color:var(--ink);}
.face.back .speak-btn{background:rgba(255,255,255,.12);color:var(--paper);}
.speak-btn:active{transform:scale(.9);}
.speak-btn.playing{animation:pulse .6s ease-in-out infinite;background:var(--amber)!important;color:var(--ink)!important;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.mini-speak{border:none;background:transparent;cursor:pointer;font-size:14px;opacity:.7;padding:2px 6px;vertical-align:middle;}
.controls{display:flex;gap:10px;}
.action{flex:1;font-family:'Space Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border:none;border-radius:12px;padding:15px 10px;cursor:pointer;transition:transform .1s,opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.action:active{transform:scale(.97);}
.btn-review{background:rgba(217,83,79,.16);color:#f3a3a0;border:1px solid rgba(217,83,79,.4);}
.btn-known{background:rgba(95,174,126,.18);color:#9be0b8;border:1px solid rgba(95,174,126,.45);}
.swipe-hint{text-align:center;font-family:'Space Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px;opacity:.8;}
.drag-left .face.front,.drag-left .face.back{box-shadow:0 0 0 3px rgba(217,83,79,.6),0 20px 40px rgba(0,0,0,.25);}
.drag-right .face.front,.drag-right .face.back{box-shadow:0 0 0 3px rgba(95,174,126,.6),0 20px 40px rgba(0,0,0,.25);}

/* end screen */
.end{text-align:center;padding:36px 20px;background:var(--card-bg);border:1px solid var(--card-line);border-radius:20px;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.end .emoji{font-size:52px;display:block;margin-bottom:6px;}
.end h2{margin:0 0 6px;font-size:24px;font-weight:900;}
.end p{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.6;}
.end .stack{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;}
.end .stack button{font-family:'Space Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.04em;text-transform:uppercase;border:none;border-radius:12px;padding:14px;cursor:pointer;}
.btn-primary{background:var(--amber);color:var(--ink);font-weight:700;}
.btn-secondary{background:transparent;border:1px solid rgba(255,255,255,.2)!important;color:var(--paper);}

/* settings sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s;}
.sheet{background:#1F2A4F;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:18px 18px max(24px,env(safe-area-inset-bottom));border-top:1px solid var(--card-line);}
.sheet h3{font-family:'Fraunces',Georgia,serif;margin:0 0 14px;font-size:20px;}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--card-line);}
.setting .lbl b{display:block;font-size:14px;font-weight:600;}
.setting .lbl small{color:var(--muted);font-size:12px;}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;flex:0 0 auto;}
.seg button{border:none;background:transparent;color:var(--muted);font-family:'Space Mono',ui-monospace,monospace;font-size:11px;padding:6px 11px;border-radius:999px;cursor:pointer;}
.seg button.active{background:var(--paper);color:var(--ink);font-weight:700;}
select,textarea{font-family:inherit;font-size:13px;background:rgba(255,255,255,.08);color:var(--paper);border:1px solid var(--card-line);border-radius:10px;padding:8px;max-width:100%;}
select{max-width:200px;}
.small-btn{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--card-line);background:rgba(255,255,255,.06);color:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;}
.small-btn.danger{color:#f3a3a0;border-color:rgba(217,83,79,.4);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadein .2s;max-width:90vw;text-align:center;}
.confetti{position:fixed;top:-10px;width:10px;height:14px;opacity:.9;border-radius:2px;animation:fall linear forwards;z-index:50;pointer-events:none;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2;}}
.stats-line{font-family:'Space Mono',ui-monospace,monospace;font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px;}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:40px;opacity:.7;}
</style>

k":5,"type":"phrase","tag":"phrase","en":"I have to practise my English; otherwise, I won't make progress.","fr":"Je dois pratiquer mon anglais ; sinon, je ne progresserai pas.","src":"hist","lvl":2,"id":"mine:5:i-have-to-practise-my-english-otherwise-"},{"col":"mine","deck":5,"type":"phrase","tag":"phrase","en":"As soon as I find a client, I will send them a quote.","fr":"Dès que je trouverai un client, je lui enverrai un devis.","src":"hist","lvl":2,"note":"Après « as soon as », présent simple pour parler du futur (pas « will find »).","id":"mine:5:as-soon-as-i-find-a-client-i-will-send-t"},{"col":"mine","deck":5,"type":"phrase","tag":"phrase","en":"As long as I practise regularly, I can make progress.","fr":"Tant que je pratique régulièrement, je peux progresser.","src":"hist","lvl":2,"id":"mine:5:as-long-as-i-practise-regularly-i-can-ma"},{"col":"mine","deck":5,"type":"phrase","tag":"phrase","en":"Unless I practise regularly, I won't make progress.","fr":"À moins que je pratique régulièrement, je ne progresserai pas.","src":"hist","lvl":2,"note":"unless + sujet + verbe conjugué (jamais « unless to + verbe »).","id":"mine:5:unless-i-practise-regularly-i-won-t-make"},{"col":"mine","deck":5,"type":"phrase","tag":"phrase","en":"I work hard in order to improve my English.","fr":"Je travaille dur afin d'améliorer mon anglais.","src":"hist","lvl":2,"note":"in order to + base verbale.","id":"mine:5:i-work-hard-in-order-to-improve-my-engli"},{"col":"mine","deck":5,"type":"phrase","tag":"phrase","en":"I prefer practising instead of giving up.","fr":"Je préfère pratiquer plutôt que d'abandonner.","src":"hist","lvl":2,"note":"prefer + -ing ; instead of + -ing.","id":"mine:5:i-prefer-practising-instead-of-giving-up"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Although","fr":"Bien que","src":"hist","lvl":2,"ex":"Although I'm tired, I keep working.","exFr":"Bien que je sois fatigué, je continue à travailler.","note":"although + proposition (sujet + verbe).","id":"mine:6:although"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Despite","fr":"Malgré","src":"hist","lvl":2,"ex":"Despite the difficulty, I keep going.","exFr":"Malgré la difficulté, je continue.","note":"despite + nom ou forme en -ing (jamais « despite of »).","id":"mine:6:despite"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"However","fr":"Cependant","src":"hist","lvl":2,"ex":"I'm tired. However, I'm going to train.","exFr":"Je suis fatigué. Cependant, je vais m'entraîner.","id":"mine:6:however"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Therefore","fr":"Par conséquent","src":"hist","lvl":2,"ex":"I work regularly. Therefore, I make progress.","exFr":"Je travaille régulièrement. Par conséquent, je progresse.","id":"mine:6:therefore"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"In addition","fr":"De plus","src":"hist","lvl":2,"ex":"I want to improve. In addition, I want to gain confidence.","exFr":"Je veux progresser. De plus, je veux gagner en confiance.","id":"mine:6:in-addition"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Whereas","fr":"Tandis que / alors que","src":"hist","lvl":2,"ex":"I prefer working alone, whereas my friend prefers working in a team.","exFr":"Je préfère travailler seul, tandis que mon ami préfère travailler en équipe.","id":"mine:6:whereas"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"So","fr":"Donc / alors","src":"comp","lvl":1,"ex":"It was raining, so I trained at home.","exFr":"Il pleuvait, donc je me suis entraîné à la maison.","id":"mine:6:so"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"As a result","fr":"Par conséquent / en conséquence","src":"comp","lvl":2,"ex":"I practised every day. As a result, my speaking improved.","exFr":"J'ai pratiqué tous les jours. En conséquence, mon oral s'est amélioré.","id":"mine:6:as-a-result"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Besides","fr":"En outre / d'ailleurs","src":"comp","lvl":2,"ex":"I don't want to go out. Besides, I have work to do.","exFr":"Je ne veux pas sortir. D'ailleurs, j'ai du travail.","id":"mine:6:besides"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Nevertheless","fr":"Néanmoins","src":"comp","lvl":2,"ex":"It's hard. Nevertheless, I won't give up.","exFr":"C'est dur. Néanmoins, je n'abandonnerai pas.","id":"mine:6:nevertheless"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Since","fr":"Puisque / comme","src":"comp","lvl":2,"ex":"Since I work remotely, I can live anywhere.","exFr":"Puisque je travaille à distance, je peux vivre n'importe où.","note":"since = puisque (cause) ou depuis (temps) selon le contexte.","id":"mine:6:since"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Otherwise","fr":"Sinon","src":"hist","lvl":2,"ex":"I have to practise; otherwise, I won't make progress.","exFr":"Je dois pratiquer ; sinon, je ne progresserai pas.","id":"mine:6:otherwise"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"In fact","fr":"En fait","src":"comp","lvl":2,"ex":"In fact, discipline matters more than motivation.","exFr":"En fait, la discipline compte plus que la motivation.","id":"mine:6:in-fact"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"As long as","fr":"Tant que / à condition que","src":"hist","lvl":2,"ex":"I want to keep going as long as I'm making progress.","exFr":"Je veux continuer tant que je progresse.","id":"mine:6:as-long-as"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"As soon as","fr":"Dès que","src":"hist","lvl":2,"ex":"As soon as I find a client, I send them a quote.","exFr":"Dès que je trouve un client, je lui envoie un devis.","id":"mine:6:as-soon-as"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Unless","fr":"À moins que","src":"hist","lvl":2,"ex":"I won't make progress unless I practise regularly.","exFr":"Je ne progresserai pas à moins de pratiquer régulièrement.","id":"mine:6:unless"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"In order to","fr":"Afin de","src":"hist","lvl":2,"ex":"I want to practise regularly in order to speak more easily.","exFr":"Je veux pratiquer régulièrement afin de parler plus facilement.","id":"mine:6:in-order-to"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Instead of","fr":"Au lieu de","src":"hist","lvl":2,"ex":"I prefer working instead of wasting time.","exFr":"Je préfère travailler au lieu de perdre du temps.","note":"instead of + -ing.","id":"mine:6:instead-of"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"As well as","fr":"Ainsi que / aussi bien que","src":"comp","lvl":2,"ex":"I want to improve my speaking as well as my confidence.","exFr":"Je veux améliorer mon oral ainsi que ma confiance.","id":"mine:6:as-well-as"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Even though","fr":"Même si (contraste réel)","src":"hist","lvl":2,"ex":"Even though it's difficult, I keep going.","exFr":"Même si c'est difficile, je continue.","id":"mine:6:even-though"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Even if","fr":"Même si (hypothèse)","src":"comp","lvl":2,"ex":"Even if I feel tired, I'll go to the gym.","exFr":"Même si je me sens fatigué, j'irai à la salle.","note":"even if = situation hypothétique ; even though = fait réel.","id":"mine:6:even-if"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"If","fr":"Si (condition)","src":"comp","lvl":1,"ex":"If I work regularly, I will find more clients.","exFr":"Si je travaille régulièrement, je trouverai plus de clients.","id":"mine:6:if"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Whether","fr":"Si / que ce soit… ou… (incertitude)","src":"comp","lvl":2,"ex":"I don't know whether I'll stay or leave.","exFr":"Je ne sais pas si je vais rester ou partir.","note":"whether = si (choix entre deux possibilités).","id":"mine:6:whether"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Eventually","fr":"Finalement / au bout du compte","src":"hist","lvl":2,"ex":"My efforts will eventually pay off.","exFr":"Mes efforts finiront par payer.","id":"mine:6:eventually"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"As I go along","fr":"Au fur et à mesure","src":"hist","lvl":2,"ex":"I adjust my strategy as I go along.","exFr":"J'ajuste ma stratégie au fur et à mesure.","id":"mine:6:as-i-go-along"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Ultimately","fr":"En fin de compte","src":"comp","lvl":3,"ex":"Ultimately, consistency is what matters.","exFr":"En fin de compte, c'est la régularité qui compte.","id":"mine:6:ultimately"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"In the first place","fr":"En premier lieu / au départ","src":"comp","lvl":3,"ex":"I came here to grow my business in the first place.","exFr":"Au départ, je suis venu ici pour développer mon entreprise.","id":"mine:6:in-the-first-place"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Provided that","fr":"À condition que","src":"comp","lvl":3,"ex":"You can work from anywhere, provided that you have wifi.","exFr":"Tu peux travailler de n'importe où, à condition d'avoir le wifi.","id":"mine:6:provided-that"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"To be on the right track","fr":"Être sur la bonne voie","src":"comp","lvl":2,"ex":"I think I'm on the right track with my business.","exFr":"Je pense que je suis sur la bonne voie avec mon entreprise.","id":"mine:6:to-be-on-the-right-track"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Rather than","fr":"Plutôt que de","src":"comp","lvl":2,"ex":"I'd rather take action rather than wait.","exFr":"Je préfère agir plutôt que d'attendre.","id":"mine:6:rather-than"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"Even when","fr":"Même lorsque","src":"comp","lvl":2,"ex":"I keep going even when I don't feel motivated.","exFr":"Je continue même lorsque je ne suis pas motivé.","id":"mine:6:even-when"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"As","fr":"À mesure que","src":"comp","lvl":3,"ex":"As I practise, I feel more comfortable.","exFr":"À mesure que je pratique, je me sens plus à l'aise.","id":"mine:6:as"},{"col":"mine","deck":6,"type":"phrase","tag":"link","en":"On the one hand… on the other hand…","fr":"D'une part… d'autre part…","src":"comp","lvl":2,"ex":"On the one hand, I love travelling. On the other hand, I miss my family.","exFr":"D'une part, j'adore voyager. D'autre part, ma famille me manque.","id":"mine:6:on-the-one-hand-on-the-other-hand"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Want","fr":"Vouloir","src":"hist","lvl":1,"note":"want to + verbe : I want to work.","pho":"/wɒnt/ → « ouonnt »","id":"mine:7:want"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I want to work.","fr":"Je veux travailler.","src":"hist","lvl":1,"note":"want TO + verbe.","id":"mine:7:i-want-to-work"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I want to improve my English.","fr":"Je veux améliorer mon anglais.","src":"hist","lvl":1,"note":"❌ I want improve my English → ✅ I want to improve my English.","id":"mine:7:i-want-to-improve-my-english"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I will work.","fr":"Je travaillerai.","src":"hist","lvl":1,"note":"will + base verbale (futur).","pho":"/wɪl/ → « ouil »","id":"mine:7:i-will-work"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I won't work.","fr":"Je ne travaillerai pas.","src":"hist","lvl":1,"note":"won't = will not + base verbale.","pho":"/wəʊnt/ → « ouôounnt »","id":"mine:7:i-won-t-work"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I don't want to give up.","fr":"Je ne veux pas abandonner.","src":"hist","lvl":1,"note":"don't want to + verbe.","id":"mine:7:i-don-t-want-to-give-up"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I will find new clients.","fr":"Je trouverai de nouveaux clients.","src":"hist","lvl":1,"id":"mine:7:i-will-find-new-clients"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I won't earn more money.","fr":"Je ne gagnerai pas plus d'argent.","src":"hist","lvl":1,"id":"mine:7:i-won-t-earn-more-money"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I don't want to work ≠ I won't work","fr":"Je ne veux pas travailler (volonté) ≠ je ne travaillerai pas (futur)","src":"comp","lvl":2,"note":"want = vouloir ; will/won't = futur. Prononciation : want « ouonnt », won't « ouôounnt ».","id":"mine:7:i-don-t-want-to-work-i-won-t-work"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Even if ≠ Even though","fr":"Même si (hypothèse) ≠ même si / bien que (fait réel)","src":"comp","lvl":2,"note":"Even if it rains, I'll go (hypothèse). Even though it rained, I went (fait réel).","id":"mine:7:even-if-even-though"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"I used to do ≠ I'm used to doing ≠ I'm getting used to doing","fr":"Avant, je faisais ≠ je suis habitué à ≠ je m'habitue à","src":"comp","lvl":3,"note":"used to + base verbale = habitude passée ; be used to + -ing = être habitué ; get used to + -ing = s'habituer.","id":"mine:7:i-used-to-do-i-m-used-to-doing-i-m-getti"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Stop doing ≠ Stop to do","fr":"Arrêter de faire ≠ s'arrêter pour faire","src":"comp","lvl":2,"note":"I stopped smoking (j'ai arrêté de fumer) ≠ I stopped to smoke (je me suis arrêté pour fumer).","id":"mine:7:stop-doing-stop-to-do"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Over time ≠ Eventually ≠ As I go along","fr":"Avec le temps ≠ finalement ≠ au fur et à mesure","src":"comp","lvl":3,"note":"over time = progressivement ; eventually = finalement, au bout du compte ; as I go along = au fur et à mesure.","id":"mine:7:over-time-eventually-as-i-go-along"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Small talk ≠ Make conversation ≠ Start a conversation","fr":"Bavardage léger ≠ faire la conversation ≠ engager la conversation","src":"comp","lvl":2,"note":"It's small talk (sans « a »). Make conversation = entretenir la discussion. Start a conversation = la lancer.","id":"mine:7:small-talk-make-conversation-start-a-con"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Earn money ≠ Win a match","fr":"Gagner de l'argent ≠ gagner un match","src":"comp","lvl":1,"note":"earn = gagner (argent, salaire) ; win = gagner (compétition) ; gain = gagner (en confiance, en poids).","id":"mine:7:earn-money-win-a-match"},{"col":"mine","deck":7,"type":"rule","tag":"rule","en":"Make progress, make a mistake, make a decision — do sport, do prospecting","fr":"Faire des progrès / une erreur / une décision ≠ faire du sport / des efforts ?","src":"comp","lvl":2,"note":"make = créer, produire ; do = activité, tâche. Mais : make an effort.","id":"mine:7:make-progress-make-a-mistake-make-a-deci"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Keep moving forward","fr":"Continuer à avancer","src":"hist","lvl":1,"note":"❌ keep forward. ✅ keep + -ing : keep moving, keep going, keep improving.","id":"mine:8:keep-moving-forward"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"My business is growing.","fr":"Mon entreprise se développe.","src":"hist","lvl":1,"note":"Présent continu : be + -ing. Ne pas oublier « is ».","id":"mine:8:my-business-is-growing"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"My family prefers…","fr":"Ma famille préfère…","src":"hist","lvl":2,"note":"« family » = groupe singulier → verbe au singulier (prefers, is).","id":"mine:8:my-family-prefers"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Prefer working","fr":"Préférer travailler","src":"hist","lvl":1,"note":"❌ prefer work. ✅ prefer + -ing (ou prefer to + verbe).","id":"mine:8:prefer-working"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"In a team","fr":"En équipe","src":"hist","lvl":1,"note":"❌ in team. ✅ in a team / as a team.","id":"mine:8:in-a-team"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"The countryside","fr":"La campagne","src":"hist","lvl":1,"note":"Toujours avec « the » : I love the countryside.","id":"mine:8:the-countryside"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Progress is slow.","fr":"Les progrès sont lents.","src":"hist","lvl":2,"note":"« progress » est indénombrable : pas de « s », verbe au singulier.","id":"mine:8:progress-is-slow"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"to practise / practice","fr":"Pratiquer (verbe) / la pratique (nom)","src":"hist","lvl":2,"note":"Anglais britannique : practiSe = verbe, practiCe = nom. (Américain : practice partout.)","id":"mine:8:to-practise-practice"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Unless I practise regularly","fr":"À moins que je pratique régulièrement","src":"hist","lvl":2,"note":"unless + sujet + verbe conjugué. ❌ unless to practise.","id":"mine:8:unless-i-practise-regularly"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"In order to improve","fr":"Afin d'améliorer","src":"hist","lvl":2,"note":"in order to + base verbale.","id":"mine:8:in-order-to-improve"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Be able to speak","fr":"Être capable de parler","src":"hist","lvl":1,"note":"be able to + base verbale (remplace « can » au futur : I will be able to).","id":"mine:8:be-able-to-speak"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"More easily","fr":"Plus facilement","src":"hist","lvl":1,"note":"Comparatif d'un adverbe en -ly : more + adverbe.","id":"mine:8:more-easily"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"As soon as I find a client, I will send them a quote.","fr":"Dès que je trouverai un client, je lui enverrai un devis.","src":"hist","lvl":2,"note":"Après as soon as / when / if : présent simple pour le futur. « them » = pronom neutre singulier.","id":"mine:8:as-soon-as-i-find-a-client-i-will-send-t"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"As long as","fr":"Tant que (durée) / à condition que","src":"hist","lvl":2,"note":"Deux sens : « tant que » (durée) ou « à condition que » (condition).","id":"mine:8:as-long-as"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"As soon as","fr":"Dès que","src":"hist","lvl":1,"note":"as soon as + présent → futur dans la principale.","id":"mine:8:as-soon-as"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Even though","fr":"Même si (fait réel)","src":"hist","lvl":2,"note":"even though + fait réel ; even if + hypothèse.","id":"mine:8:even-though"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Although + clause / Despite + noun or -ing","fr":"Bien que + phrase / malgré + nom","src":"hist","lvl":2,"note":"Although it's hard, I keep going. Despite the difficulty, I keep going.","id":"mine:8:although-clause-despite-noun-or-ing"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"I don't want to work / I won't work","fr":"Je ne veux pas travailler / Je ne travaillerai pas","src":"hist","lvl":1,"note":"want = vouloir ; won't = futur négatif. Ne pas confondre.","id":"mine:8:i-don-t-want-to-work-i-won-t-work"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Make progress","fr":"Faire des progrès","src":"hist","lvl":1,"note":"❌ do progress. ✅ make progress.","id":"mine:8:make-progress"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"Do you want to…? / Are you…? / How long have you been…?","fr":"Ordre des mots dans les questions","src":"hist","lvl":2,"note":"Auxiliaire avant le sujet : Do you…, Are you…, Have you… Dans la condition : If I work… (pas d'inversion).","id":"mine:8:do-you-want-to-are-you-how-long-have-you"},{"col":"mine","deck":8,"type":"rule","tag":"rule","en":"If / Even if / Even though / Whether","fr":"Si (condition) / même si (hypothèse) / même si (contraste) / si (incertitude)","src":"hist","lvl":3,"note":"If = condition. Even if = hypothèse. Even though = contraste réel. Whether = si, entre deux possibi  you do for work while you travel around?","exFr":"Tu fais quoi comme travail pendant que tu voyages comme ça ?","id":"travel:3:what-do-you-do-for-work-while-you-travel"},{"col":"travel","deck":4,"type":"phrase","tag":"say","en":"We should grab a drink sometime.","fr":"On devrait se prendre un verre un de ces jours.","ex":"We should grab a drink sometime before you leave.","exFr":"On devrait se prendre un verre un de ces jours avant que tu partes.","id":"travel:4:we-should-grab-a-drink-sometime"},{"col":"travel","deck":4,"type":"phrase","tag":"ask","en":"Do you have Instagram? Let's stay in touch.","fr":"T'as Instagram ? Restons en contact.","ex":"Do you have Instagram? Let's stay in touch after this.","exFr":"T'as Instagram ? Restons en contact après ça.","id":"travel:4:do-you-have-instagram-let-s-stay-in-touc"},{"col":"travel","deck":4,"type":"phrase","tag":"say","en":"Small world, hope our paths cross again somewhere!","fr":"Petit monde, j'espère qu'on se recroisera quelque part !","ex":"Small world, hope our paths cross again somewhere!","exFr":"Petit monde, j'espère qu'on se recroisera quelque part !","id":"travel:4:small-world-hope-our-paths-cross-again-s"},{"col":"travel","deck":5,"type":"phrase","tag":"say","en":"I'm from Marseille, in the south of France.","fr":"Je suis de Marseille, dans le sud de la France.","ex":"I'm from Marseille, in the south of France.","exFr":"Je suis de Marseille, dans le sud de la France.","id":"travel:5:i-m-from-marseille-in-the-south-of-franc"},{"col":"travel","deck":5,"type":"phrase","tag":"say","en":"I run an online agency, web development and design.","fr":"Je dirige une agence en ligne, développement et design web.","ex":"I run an online agency, web development and design.","exFr":"Je dirige une agence en ligne, développement et design web.","id":"travel:5:i-run-an-online-agency-web-development-a"},{"col":"travel","deck":5,"type":"phrase","tag":"say","en":"I can work from anywhere, so I travel a lot.","fr":"Je peux travailler de n'importe où, donc je voyage beaucoup.","ex":"I can work from anywhere, so I travel a lot.","exFr":"Je peux travailler de n'importe où, donc je voyage beaucoup.","id":"travel:5:i-can-work-from-anywhere-so-i-travel-a-l"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"Three years ago, I left everything.","fr":"Il y a trois ans, j'ai tout quitté.","ex":"Three years ago, I left everything back home.","exFr":"Il y a trois ans, j'ai tout quitté là-bas.","id":"travel:6:three-years-ago-i-left-everything"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"I sold my motorbike, my car, and quit my job.","fr":"J'ai vendu ma moto, ma voiture, et quitté mon travail.","ex":"I sold my motorbike, my car, and quit my job.","exFr":"J'ai vendu ma moto, ma voiture, et quitté mon travail.","id":"travel:6:i-sold-my-motorbike-my-car-and-quit-my-j"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"I left with my savings.","fr":"Je suis parti avec mes économies.","ex":"I left with my savings and never looked back.","exFr":"Je suis parti avec mes économies et je n'ai jamais regardé en arrière.","id":"travel:6:i-left-with-my-savings"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"I just wasn't feeling good at home.","fr":"Je ne me sentais pas bien chez moi.","ex":"I just wasn't feeling good at home, so I needed a change.","exFr":"Je ne me sentais pas bien chez moi, donc j'avais besoin d'un changement.","id":"travel:6:i-just-wasn-t-feeling-good-at-home"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"I needed adventure.","fr":"J'avais besoin d'aventure.","ex":"I needed adventure and something new in my life.","exFr":"J'avais besoin d'aventure et de nouveauté dans ma vie.","id":"travel:6:i-needed-adventure"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"I was tired of the mentality back there.","fr":"J'en avais marre de la mentalité là-bas.","ex":"I was tired of the mentality back there, and some bad influences too.","exFr":"J'en avais marre de la mentalité là-bas, et de certaines mauvaises fréquentations aussi.","id":"travel:6:i-was-tired-of-the-mentality-back-there"},{"col":"travel","deck":6,"type":"phrase","tag":"say","en":"I decided to start a new life.","fr":"J'ai décidé de commencer une nouvelle vie.","ex":"I decided to start a new life somewhere else.","exFr":"J'ai décidé de commencer une nouvelle vie ailleurs.","id":"travel:6:i-decided-to-start-a-new-life"},{"col":"travel","deck":7,"type":"phrase","tag":"say","en":"I've travelled a lot in Asia.","fr":"J'ai beaucoup voyagé en Asie.","ex":"I've travelled a lot in Asia over the last three years.","exFr":"J'ai beaucoup voyagé en Asie ces trois dernières années.","id":"travel:7:i-ve-travelled-a-lot-in-asia"},{"col":"travel","deck":7,"type":"phrase","tag":"say","en":"I've been to Indonesia, Singapore, Malaysia, and Thailand.","fr":"Je suis allé en Indonésie, à Singapour, en Malaisie et en Thaïlande.","ex":"I've been to Indonesia, Singapore, Malaysia, and Thailand.","exFr":"Je suis allé en Indonésie, à Singapour, en Malaisie et en Thaïlande.","id":"travel:7:i-ve-been-to-indonesia-singapore-malaysi"},{"col":"travel","deck":7,"type":"phrase","tag":"say","en":"I've been to Nepal twice.","fr":"Je suis allé au Népal deux fois.","ex":"I've been to Nepal twice, the mountains are incredible.","exFr":"Je suis allé au Népal deux fois, les montagnes sont incroyables.","id":"travel:7:i-ve-been-to-nepal-twice"},{"col":"travel","deck":7,"type":"phrase","tag":"say","en":"I spent 7 months in Australia to save up money.","fr":"J'ai passé 7 mois en Australie pour économiser de l'argent.","ex":"I spent 7 months in Australia to save up money again.","exFr":"J'ai passé 7 mois en Australie pour économiser de l'argent à nouveau.","id":"travel:7:i-spent-7-months-in-australia-to-save-up"},{"col":"travel","deck":8,"type":"phrase","tag":"say","en":"Right now I'm in Cambodia for a few weeks.","fr":"En ce moment je suis au Cambodge pour quelques semaines.","ex" aimerais faire pareil.","ex":"That's awesome, I'd love to do that too someday.","exFr":"C'est génial, j'aimerais faire pareil un jour.","id":"travel:10:that-s-awesome-i-d-love-to-do-that-too"},{"col":"expr","deck":1,"type":"phrase","tag":"greet","en":"Hi! / Hello!","fr":"Bonjour !","ex":"Good morning. / Good afternoon.","exFr":"Bonjour (matin). / Bonjour (après-midi).","id":"expr:1:hi-hello"},{"col":"expr","deck":1,"type":"phrase","tag":"greet","en":"Good evening.","fr":"Bonsoir !","ex":"Good evening, how are you?","exFr":"Bonsoir, comment allez-vous ?","id":"expr:1:good-evening"},{"col":"expr","deck":1,"type":"phrase","tag":"ask","en":"How are you?","fr":"Comment allez-vous ?","ex":"I'm fine, thank you.","exFr":"Très bien, merci.","id":"expr:1:how-are-you"},{"col":"expr","deck":1,"type":"phrase","tag":"ask","en":"How are you doing?","fr":"Comment allez-vous ?","ex":"I'm okay, thanks.","exFr":"Ça va, merci.","id":"expr:1:how-are-you-doing"},{"col":"expr","deck":1,"type":"phrase","tag":"ask","en":"How about you?","fr":"Et vous ?","ex":"I'm fine, thanks. How about you?","exFr":"Je vais bien, merci. Et vous ?","id":"expr:1:how-about-you"},{"col":"expr","deck":1,"type":"phrase","tag":"say","en":"Nice to meet you.","fr":"Ravi de vous rencontrer.","ex":"Nice to meet you too.","exFr":"Moi aussi, ravi(e) de vous rencontrer.","id":"expr:1:nice-to-meet-you"},{"col":"expr","deck":1,"type":"phrase","tag":"say","en":"It's good to see you.","fr":"Content(e) de te voir.","ex":"It's good to see you again!","exFr":"Je suis content(e) de te revoir !","id":"expr:1:it-s-good-to-see-you"},{"col":"expr","deck":1,"type":"phrase","tag":"ask","en":"How do you do?","fr":"Enchanté de faire votre connaissance.","ex":"— How do you do? — How do you do?","exFr":"— Enchanté. — Enchanté.","id":"expr:1:how-do-you-do"},{"col":"expr","deck":1,"type":"phrase","tag":"say","en":"We haven't seen you for ages!","fr":"Cela fait des siècles qu'on ne vous a pas vu(e) !","ex":"We haven't seen you for ages! How our-address-please"},{"col":"expr","deck":3,"type":"phrase","tag":"say","en":"Here's my ID (Identity Card).","fr":"Voici ma carte d'identité.","ex":"Here's my ID, please check it.","exFr":"Voici ma carte d'identité, vérifiez-la s'il vous plaît.","id":"expr:3:here-s-my-id-identity-card"},{"col":"expr","deck":3,"type":"phrase","tag":"misc","en":"Don't forget your passport.","fr":"N'oubliez pas votre passeport.","ex":"Don't forget your passport before you leave.","exFr":"N'oubliez pas votre passeport avant de partir.","id":"expr:3:don-t-forget-your-passport"},{"col":"expr","deck":3,"type":"phrase","tag":"ask","en":"What do you do?","fr":"Que faites-vous ?","ex":"What do you do for a living?","exFr":"Que faites-vous dans la vie ?","id":"expr:3:what-do-you-do"},{"col":"expr","deck":3,"type":"phrase","tag":"ask","en":"Where do you work?","fr":"Où travaillez-vous ?","ex":"Where do you work these days?","exFr":"Où travaillez-vous en ce moment ?","id":"expr:3:where-do-you-work"},{"col":"expr","deck":3,"type":"phrase","tag":"ask","en":"So what do you do with yourself?","fr":"Que faites-vous dans la vie ?","ex":"So what do you do with yourself these days?","exFr":"Alors, que faites-vous dans la vie en ce moment ?","id":"expr:3:so-what-do-you-do-with-yourself"},{"col":"expr","deck":4,"type":"phrase","tag":"ask","en":"What are you doing tomorrow?","fr":"Que faites-vous demain ?","ex":"What are you doing tomorrow evening?","exFr":"Que faites-vous demain soir ?","id":"expr:4:what-are-you-doing-tomorrow"},{"col":"expr","deck":4,"type":"phrase","tag":"ask","en":"Would you like to come for dinner?","fr":"Est-ce que cela vous ferait plaisir de venir dîner ?","ex":"Would you like to come for dinner on Friday?","exFr":"Ça vous dirait de venir dîner vendredi ?","id":"expr:4:would-you-like-to-come-for-dinner"},{"col":"expr","deck":4,"type":"phrase","tag":"say","en":"I'd like to invite you to lunch.","fr":"Je voudrais vous inviter à déjeuner.","ex":"I'd like to invite you to lunch tomorrow "id":"expr:7:hello-do-come-in"},{"col":"expr","deck":7,"type":"phrase","tag":"ask","en":"Are you sure you wouldn't like to come in?","fr":"Vous êtes sûr(e) que vous ne voulez pas entrer ?","ex":"Are you sure you wouldn't like to come in for a coffee?","exFr":"Vous êtes sûr(e) que vous ne voulez pas entrer prendre un café ?","id":"expr:7:are-you-sure-you-wouldn-t-like-to-come-i"},{"col":"expr","deck":7,"type":"phrase","tag":"say","en":"So nice of you to come and visit us!","fr":"C'est si gentil à vous de venir nous voir.","ex":"So nice of you to come and visit us this weekend!","exFr":"C'est si gentil à vous de venir nous voir ce week-end !","id":"expr:7:so-nice-of-you-to-come-and-visit-us"},{"col":"expr","deck":7,"type":"phrase","tag":"ask","en":"May I offer you a drink?","fr":"Puis-je vous offrir un verre ?","ex":"May I offer you a drink before dinner?","exFr":"Puis-je vous offrir un verre avant le dîner ?","id":"expr:7:may-i-offer-you-a-drink"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"Now I've got to go.","fr":"Maintenant, il faut que je parte.","ex":"Now I've got to go, it was lovely seeing you.","exFr":"Maintenant, il faut que je parte, c'était un plaisir de te voir.","id":"expr:8:now-i-ve-got-to-go"},{"col":"expr","deck":8,"type":"phrase","tag":"ask","en":"Would you excuse me, please? I have to go.","fr":"Pouvez-vous m'excuser, s'il vous plaît ? Je dois partir.","ex":"Would you excuse me, please? I have to go now.","exFr":"Pouvez-vous m'excuser ? Je dois partir maintenant.","id":"expr:8:would-you-excuse-me-please-i-have-to-go"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"It was lovely meeting you.","fr":"Je suis ravi(e) de vous avoir rencontré.","ex":"It was lovely meeting you, see you soon!","exFr":"Je suis ravi(e) de vous avoir rencontré, à bientôt !","id":"expr:8:it-was-lovely-meeting-you"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"I had a great time.","fr":"Je me suis bien amusé(e).","ex":"I had a great time tonight, thank you.","exFr":"Je me suis bien amusé(e) ce soir, merci.","id":"expr:8:i-had-a-great-time"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"Thanks for asking me out.","fr":"Merci de m'avoir invité(e) à sortir.","ex":"Thanks for asking me out, I had a wonderful evening.","exFr":"Merci de m'avoir invité(e), j'ai passé une merveilleuse soirée.","id":"expr:8:thanks-for-asking-me-out"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"Have a safe trip back.","fr":"Bon retour !","ex":"Have a safe trip back home!","exFr":"Bon retour chez toi !","id":"expr:8:have-a-safe-trip-back"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"Thank you. Bye… Take care.","fr":"Merci. Au revoir. Prends soin de toi.","ex":"Thank you. Bye… Take care of yourself.","exFr":"Merci. Au revoir. Prends bien soin de toi.","id":"expr:8:thank-you-bye-take-care"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"Let's keep in touch!","fr":"Restons en contact.","ex":"Let's keep in touch, here's my number.","exFr":"Restons en contact, voici mon numéro.","id":"expr:8:let-s-keep-in-touch"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"If you come to Paris again, do let me know.","fr":"Si vous revenez à Paris, faites-le moi savoir.","ex":"If you come to Paris again, do let me know!","exFr":"Si vous revenez à Paris, faites-le moi savoir !","id":"expr:8:if-you-come-to-paris-again-do-let-me-kno"},{"col":"expr","deck":8,"type":"phrase","tag":"say","en":"Enjoy the rest of your trip.","fr":"Bonne fin de voyage.","ex":"Enjoy the rest of your trip, safe travels!","exFr":"Bonne fin de voyage, bon voyage !","id":"expr:8:enjoy-the-rest-of-your-trip"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"Nice day, isn't it?","fr":"Quel beau temps, n'est-ce pas ?","ex":"Nice day, isn't it? Perfect for a walk.","exFr":"Quel beau temps, n'est-ce pas ? Parfait pour se promener.","id":"expr:9:nice-day-isn-t-it"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"Lovely day today, isn't it?","fr":"Belle journée, n'est-ce pas ?","ex":"Lovely day today, isn't it? So sunny!","exFr":"Belle journée, n'est-ce pas ? Tellement ensoleillé !","id":"expr:9:lovely-day-today-isn-t-it"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"Are you having a good time?","fr":"Vous vous amusez bien ?","ex":"Are you having a good time at the party?","exFr":"Vous vous amusez bien à la fête ?","id":"expr:9:are-you-having-a-good-time"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"Do you know many people here?","fr":"Vous connaissez beaucoup de gens ici ?","ex":"Do you know many people here tonight?","exFr":"Vous connaissez beaucoup de gens ici ce soir ?","id":"expr:9:do-you-know-many-people-here"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"What's happening? / What's going on?","fr":"Qu'est-ce qu'il se passe ?","ex":"What's going on over there?","exFr":"Qu'est-ce qu'il se passe là-bas ?","id":"expr:9:what-s-happening-what-s-going-on"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"Are you a friend of Mrs Tracy's?","fr":"Vous êtes un ami de Mme Tracy ?","ex":"Are you a friend of Mrs Tracy's? She mentioned you.","exFr":"Vous êtes un ami de Mme Tracy ? Elle a parlé de vous.","id":"expr:9:are-you-a-friend-of-mrs-tracy-s"},{"col":"expr","deck":9,"type":"phrase","tag":"ask","en":"How do you know her?","fr":"Comment la connaissez-vous ?","ex":"How do you know her? Through work?","exFr":"Comment la connaissez-vous ? Par le travail ?","id":"expr:9:how-do-you-know-her"},{"col":"gymp","deck":1,"type":"phrase","tag":"ask","en":"How many sets do you have left?","fr":"Il te reste combien de séries ?","ex":"How many sets do you have left? I can wait.","exFr":"Il te reste combien de séries ? Je peux attendre.","id":"gymp:1:how-many-sets-do-you-have-left"},{"col":"gymp","deck":1,"type":"phrase","tag":"ask","en":"Are you using this machine?","fr":"Tu utilises cette machine ?","ex":"Excuse me, are you using this machine?","exFr":"Excuse-moi, tu utilises cette machine ?","id":"gymp:1:are-you-using-this-machine"},{"col":"gymp","deck":1,"type":"phrase","tag":"ask","en":"Can I work in with you?","fr":"Est-ce que je peux alterner avec toi entre les séries ?","ex":"Can I work in with you on the bench?","exFr":"Je peux alterner avec toi sur le banc ?","id":"gymp:1:can-i-work-in-with-you"},{"col":"gymp","deck":1,"type":"phrase","tag":"ask","en":"Is this seat taken?","fr":"Cette place est prise ?","ex":"Is this seat taken? Mind if I sit here?","exFr":"Cette place est prise ? Ça te dérange si je m'assois là ?","id":"gymp:1:is-this-seat-taken"},{"col":"gymp","deck":1,"type":"phrase","tag":"ask","en":"Could you spot me?","fr":"Peux-tu m'assurer / me surveiller pendant ma série ?","ex":"Could you spot me on this last set?","exFr":"Tu peux m'assurer sur cette dernière série ?","id":"gymp:1:could-you-spot-me"},{"col":"gymp","deck":1,"type":"phrase","tag":"say","en":"Nice lift!","fr":"Beau mouvement !","ex":"Nice lift! That was clean.","exFr":"Beau mouvement ! C'était propre.","id":"gymp:1:nice-lift"},{"col":"gymp","deck":1,"type":"phrase","tag":"say","en":"Good job!","fr":"Bon travail !","ex":"Good job! Keep it up.","exFr":"Bon travail ! Continue comme ça.","id":"gymp:1:good-job"},{"col":"gymp","deck":1,"type":"phrase","tag":"say","en":"Keep pushing!","fr":"Continue, ne lâche rien !","ex":"Keep pushing! You're almost done.","exFr":"Continue, ne lâche rien ! T'as presque fini.","id":"gymp:1:keep-pushing"},{"col":"gymp","deck":1,"type":"phrase","tag":"say","en":"One more rep!","fr":"Encore une répétition !","ex":"Come on, one more rep!","exFr":"Allez, encore une répétition !","id":"gymp:1:one-more-rep"},{"col":"gymp","deck":1,"type":"phrase","tag":"say","en":"You got this!","fr":"Tu peux le faire !","ex":"You got this! Last set.","exFr":"Tu peux le faire ! Dernière série.","id":"gymp:1:you-got-this"},{"col":"gymp","deck":2,"type":"phrase","tag":"say","en":"Let's warm up first.","fr":"Commençons par l'échau l-range-of-motion"},{"col":"gymp","deck":2,"type":"phrase","tag":"misc","en":"Engage your core.","fr":"Gaine tes abdominaux.","ex":"Engage your core before you lift.","exFr":"Gaine tes abdominaux avant de soulever.","id":"gymp:2:engage-your-core"},{"col":"gymp","deck":3,"type":"phrase","tag":"ask","en":"How much do you bench?","fr":"Combien tu développes au couché ?","ex":"How much do you bench these days?","exFr":"Combien tu développes au couché en ce moment ?","id":"gymp:3:how-much-do-you-bench"},{"col":"gymp","deck":3,"type":"phrase","tag":"ask","en":"What's your one-rep max?","fr":"Quel est ton maximum sur une répétition ?","ex":"What's your one-rep max on squat?","exFr":"Quel est ton max sur une répétition au squat ?","id":"gymp:3:what-s-your-one-rep-max"},{"col":"gymp","deck":3,"type":"phrase","tag":"say","en":"Let's add some weight.","fr":"Ajoutons un peu de poids.","ex":"Let's add some weight for the next set.","exFr":"Ajoutons un peu de poids pour la prochaine série.","id":"gymp:3:let-s-add-some-weight"},{"col":"gymp","deck":3,"type":"phrase","tag":"say","en":"That's too heavy.","fr":"C'est trop lourd.","ex":"That's too heavy, I can't control it.","exFr":"C'est trop lourd, je n'arrive pas à le contrôler.","id":"gymp:3:that-s-too-heavy"},{"col":"gymp","deck":3,"type":"phrase","tag":"say","en":"Drop the weight a bit.","fr":"Réduis un peu la charge.","ex":"Drop the weight a bit and focus on form.","exFr":"Réduis un peu la charge et concentre-toi sur la technique.","id":"gymp:3:drop-the-weight-a-bit"},{"col":"gymp","deck":3,"type":"phrase","tag":"misc","en":"Go to failure.","fr":"Va jusqu'à l'échec musculaire.","ex":"Go to failure on the last set.","exFr":"Va jusqu'à l'échec musculaire sur la dernière série.","id":"gymp:3:go-to-failure"},{"col":"gymp","deck":3,"type":"phrase","tag":"misc","en":"Feel the squeeze.","fr":"Concentre-toi sur la contraction musculaire.","ex":"Feel the squeeze at the top of the rep.","exFr":"Concentre-toi sur la contraction en haut de la répétition.","id":"gymp:3:feel-the-squeeze"},{"col":"gymp","deck":3,"type":"phrase","tag":"misc","en":"Time under tension.","fr":"Temps sous tension.","ex":"Increase your time under tension.","exFr":"Augmente ton temps sous tension.","id":"gymp:3:time-under-tension"},{"col":"gymp","deck":3,"type":"phrase","tag":"misc","en":"Progressive overload.","fr":"Surcharge progressive.","ex":"Progressive overload is key to growth.","exFr":"La surcharge progressive est la clé pour progresser.","id":"gymp:3:progressive-overload"},{"col":"gymp","deck":3,"type":"phrase","tag":"misc","en":"Mind-muscle connection.","fr":"Connexion cerveau-muscle.","ex":"Work on your mind-muscle connection.","exFr":"Travaille ta connexion cerveau-muscle.","id":"gymp:3:mind-muscle-connection"},{"col":"gymp","deck":4,"type":"phrase","tag":"say","en":"Let's do some cardio.","fr":"Faisons un peu de cardio.","ex":"Let's do some cardio after the weights.","exFr":"Faisons un peu de cardio après la muscu.","id":"gymp:4:let-s-do-some-cardio"},{"col":"gymp","deck":4,"type":"phrase","tag":"ask","en":"What's your pace?","fr":"Quelle est ton allure ?","ex":"What's your pace on the treadmill?","exFr":"Quelle est ton allure sur le tapis de course ?","id":"gymp:4:what-s-your-pace"},{"col":"gymp","deck":4,"type":"phrase","tag":"say","en":"Increase the speed.","fr":"Augmente la vitesse.","ex":"Increase the speed for the last minute.","exFr":"Augmente la vitesse pour la dernière minute.","id":"gymp:4:increase-the-speed"},{"col":"gymp","deck":4,"type":"phrase","tag":"say","en":"Lower the resistance.","fr":"Réduis la résistance.","ex":"Lower the resistance if it's too hard.","exFr":"Réduis la résistance si c'est trop difficile.","id":"gymp:4:lower-the-resistance"},{"col":"gymp","deck":4,"type":"phrase","tag":"misc","en":"Keep your heart rate up.","fr":"Garde un rythme cardiaque élevé.","ex":"Keep your heart rate up for fat burning.","exFr":"Garde un rythme cardiaque élevé pour brûler des graisses.","id":"gymp:4:keep- isc","en":"Macros","fr":"Macronutriments","ex":"I track my macros every day.","exFr":"Je suis mes macros tous les jours.","id":"gymp:6:macros"},{"col":"gymp","deck":6,"type":"phrase","tag":"misc","en":"Gainz","fr":"Gains musculaires (argot)","ex":"Look at those gainz!","exFr":"Regarde ces gains musculaires !","id":"gymp:6:gainz"},{"col":"gymp","deck":7,"type":"phrase","tag":"ask","en":"What's your PR?","fr":"C'est quoi ton record ?","ex":"What's your PR on bench press?","exFr":"C'est quoi ton record au développé couché ?","id":"gymp:7:what-s-your-pr"},{"col":"gymp","deck":7,"type":"phrase","tag":"say","en":"Bro, that's insane!","fr":"Frérot, c'est incroyable !","ex":"Bro, that's insane! How much was that?","exFr":"Frérot, c'est incroyable ! Ça pesait combien ?","id":"gymp:7:bro-that-s-insane"},{"col":"gymp","deck":7,"type":"phrase","tag":"say","en":"Lightweight!","fr":"C'est léger !","ex":"Lightweight! Come on, add more plates!","exFr":"C'est léger ! Allez, ajoute des disques !","id":"gymp:7:lightweight"},{"col":"gymp","deck":7,"type":"phrase","tag":"say","en":"We're getting those gains!","fr":"On fait du muscle !","ex":"We're getting those gains this month!","exFr":"On fait du muscle ce mois-ci !","id":"gymp:7:we-re-getting-those-gains"},{"col":"gymp","deck":7,"type":"phrase","tag":"misc","en":"Leg day today.","fr":"Aujourd'hui, c'est jour des jambes.","ex":"Leg day today, let's go!","exFr":"Aujourd'hui, c'est jour des jambes, allons-y !","id":"gymp:7:leg-day-today"},{"col":"gymp","deck":7,"type":"phrase","tag":"misc","en":"Never skip leg day.","fr":"Ne saute jamais le jour des jambes.","ex":"Never skip leg day, trust me.","exFr":"Ne saute jamais le jour des jambes, crois-moi.","id":"gymp:7:never-skip-leg-day"},{"col":"gymp","deck":7,"type":"phrase","tag":"say","en":"The pump is crazy!","fr":"La congestion est incroyable !","ex":"The pump is crazy after this set!","exFr":"La congestion est incroyable après cette série !","id":"gymp:7:the-pump-is-crazy"},{"col":"gym , wish me luck.","exFr":"C'est le jour des jambes pour moi, souhaite-moi bonne chance.","id":"gymp:10:it-s-leg-day-for-me"},{"col":"gymp","deck":10,"type":"phrase","tag":"say","en":"I'm doing a full-body workout.","fr":"Je fais une séance corps entier.","ex":"I'm doing a full-body workout today.","exFr":"Je fais une séance corps entier aujourd'hui.","id":"gymp:10:i-m-doing-a-full-body-workout"},{"col":"gymp","deck":10,"type":"phrase","tag":"ask","en":"How was your workout?","fr":"Comment s'est passée ta séance ?","ex":"How was your workout this morning?","exFr":"Comment s'est passée ta séance ce matin ?","id":"gymp:10:how-was-your-workout"},{"col":"gymp","deck":10,"type":"phrase","tag":"say","en":"It was great!","fr":"C'était super !","ex":"It was great! I hit a new PR.","exFr":"C'était super ! J'ai battu un nouveau record.","id":"gymp:10:it-was-great"},{"col":"gymp","deck":10,"type":"phrase","tag":"say","en":"It was tough but worth it.","fr":"C'était difficile mais ça en valait la peine.","ex":"It was tough but worth it, I'm exhausted.","exFr":"C'était difficile mais ça en valait la peine, je suis épuisé.","id":"gymp:10:it-was-tough-but-worth-it"},{"col":"gymp","deck":11,"type":"phrase","tag":"ask","en":"Can you spot me on this set?","fr":"Tu peux m'assurer sur cette série ?","ex":"Can you spot me on this last set?","exFr":"Tu peux m'assurer sur cette dernière série ?","id":"gymp:11:can-you-spot-me-on-this-set"},{"col":"gymp","deck":11,"type":"phrase","tag":"say","en":"Of course.","fr":"Bien sûr.","ex":"Of course, I've got you.","exFr":"Bien sûr, je suis là pour toi.","id":"gymp:11:of-course"},{"col":"gymp","deck":11,"type":"phrase","tag":"say","en":"No worries.","fr":"Pas de souci.","ex":"No worries, anytime.","exFr":"Pas de souci, quand tu veux.","id":"gymp:11:no-worries"},{"col":"gymp","deck":12,"type":"phrase","tag":"ask","en":"Do you play any sports besides working out?","fr":"Tu fais d'autres sports à part la musculation ?","ex":"Do you play any sports besides working out?","exFr":"Tu fais d'autres sports à part la musculation ?","id":"gymp:12:do-you-play-any-sports-besides-working-o"},{"col":"gymp","deck":12,"type":"phrase","tag":"say","en":"Yeah, I play football at weekends.","fr":"Oui, je joue au football le week-end.","ex":"Yeah, I play football at weekends with friends.","exFr":"Oui, je joue au football le week-end avec des amis.","id":"gymp:12:yeah-i-play-football-at-weekends"},{"col":"gymp","deck":12,"type":"phrase","tag":"say","en":"I like running and swimming.","fr":"J'aime courir et nager.","ex":"I like running and swimming too.","exFr":"J'aime aussi courir et nager.","id":"gymp:12:i-like-running-and-swimming"},{"col":"gymp","deck":12,"type":"phrase","tag":"ask","en":"Do you follow a specific diet?","fr":"Tu suis un régime particulier ?","ex":"Do you follow a specific diet for training?","exFr":"Tu suis un régime particulier pour l'entraînement ?","id":"gymp:12:do-you-follow-a-specific-diet"},{"col":"gymp","deck":12,"type":"phrase","tag":"say","en":"I try to eat high-protein meals.","fr":"J'essaie de manger riche en protéines.","ex":"I try to eat high-protein meals every day.","exFr":"J'essaie de manger riche en protéines tous les jours.","id":"gymp:12:i-try-to-eat-high-protein-meals"},{"col":"gymp","deck":12,"type":"phrase","tag":"say","en":"Not really, I just eat healthy.","fr":"Pas vraiment, j'essaie juste de manger sainement.","ex":"Not really, I just eat healthy in general.","exFr":"Pas vraiment, j'essaie juste de manger sainement en général.","id":"gymp:12:not-really-i-just-eat-healthy"},{"col":"gymp","deck":13,"type":"phrase","tag":"ask","en":"Do you have Instagram?","fr":"Tu as Instagram ?","ex":"Do you have Instagram? I'll follow you.","exFr":"Tu as Instagram ? Je vais te suivre.","id":"gymp:13:do-you-have-instagram"},{"col":"gymp","deck":13,"type":"phrase","tag":"ask","en":"Yeah, what's your username?","fr":"Oui, c'est quoi ton pseudo ?","ex":"Yeah, what's your username on there?","exFr":"Oui, c'est
