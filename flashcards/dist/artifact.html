 prendre du muscle.","ex":"I'm trying to build muscle and get stronger.","exFr":"J'essaie de prendre du muscle et devenir plus fort.","id":"gymp:14:i-m-trying-to-build-muscle"},{"col":"gymp","deck":14,"type":"phrase","tag":"say","en":"Keep it up, you're doing great.","fr":"Continue comme ça, tu te débrouilles bien.","ex":"Keep it up, you're doing great so far.","exFr":"Continue comme ça, tu te débrouilles bien jusqu'ici.","id":"gymp:14:keep-it-up-you-re-doing-great"},{"col":"gymp","deck":14,"type":"phrase","tag":"say","en":"Thanks, I appreciate it.","fr":"Merci, ça me fait plaisir.","ex":"Thanks, I appreciate it, see you around.","exFr":"Merci, ça me fait plaisir, à bientôt.","id":"gymp:14:thanks-i-appreciate-it"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I'm pretty independent.","fr":"Je suis plutôt indépendant.","ex":"I'm pretty independent, I've been travelling solo for three years.","exFr":"Je suis plutôt indépendant, je voyage en solo depuis trois ans.","id":"adj:1:i-m-pretty-independent"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I've become really adaptable.","fr":"Je suis devenu très adaptable.","ex":"I've become really adaptable after moving between so many countries.","exFr":"Je suis devenu très adaptable après avoir bougé dans autant de pays.","id":"adj:1:i-ve-become-really-adaptable"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I'm quite curious.","fr":"Je suis assez curieux.","ex":"I'm quite curious, I love learning about new cultures.","exFr":"Je suis assez curieux, j'adore découvrir de nouvelles cultures.","id":"adj:1:i-m-quite-curious"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I'm pretty laid-back.","fr":"Je suis plutôt détendu.","ex":"I'm pretty laid-back, I don't like rigid plans.","exFr":"Je suis plutôt détendu, je n'aime pas les plans trop rigides.","id":"adj:1:i-m-pretty-laid-back"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I'm quite spontaneous.","fr":"Je suis assez spontané.","ex":"I'm quite spontaneous, I often decide where to go at the last minute.","exFr":"Je suis assez spontané, je décide souvent où aller à la dernière minute.","id":"adj:1:i-m-quite-spontaneous"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I feel more confident now.","fr":"Je me sens plus confiant maintenant.","ex":"I feel more confident speaking English now than before.","exFr":"Je me sens plus confiant pour parler anglais maintenant qu'avant.","id":"adj:1:i-feel-more-confident-now"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"You have to be patient.","fr":"Il faut être patient.","ex":"You have to be patient when things don't go as planned.","exFr":"Il faut être patient quand les choses ne se passent pas comme prévu.","id":"adj:1:you-have-to-be-patient"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I'm pretty easygoing.","fr":"Je suis plutôt facile à vivre.","ex":"I'm pretty easygoing, I can sleep anywhere and eat anything.","exFr":"Je suis plutôt facile à vivre, je peux dormir n'importe où et manger n'importe quoi.","id":"adj:1:i-m-pretty-easygoing"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"I've become resourceful.","fr":"Je suis devenu débrouillard.","ex":"Running a business remotely has made me pretty resourceful.","exFr":"Gérer une entreprise à distance m'a rendu plutôt débrouillard.","id":"adj:1:i-ve-become-resourceful"},{"col":"adj","deck":1,"type":"phrase","tag":"greet","en":"Travelling made me open-minded.","fr":"Voyager m'a rendu ouvert d'esprit.","ex":"Travelling made me a lot more open-minded about different lifestyles.","exFr":"Voyager m'a rendu beaucoup plus ouvert d'esprit sur les différents modes de vie.","id":"adj:1:travelling-made-me-open-minded"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"Everyone's been really friendly.","fr":"Tout le monde a été très sympa.","ex":"Everyone here has been really friendly so far.","exFr":"Tout le monde a été très sympa ici jusqu'à présent.","id":"adj:2:everyone-s-been-really-friendly"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"He's really funny.","fr":"Il est vraiment drôle.","ex":"The guy I met at the hostel was really funny.","exFr":"Le mec que j'ai rencontré à l'auberge était vraiment drôle.","id":"adj:2:he-s-really-funny"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"She had an interesting story.","fr":"Elle avait une histoire intéressante.","ex":"She had such an interesting story to tell about her travels.","exFr":"Elle avait une histoire tellement intéressante à raconter sur ses voyages.","id":"adj:2:she-had-an-interesting-story"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"The locals are so generous.","fr":"Les locaux sont tellement généreux.","ex":"The locals here are incredibly generous, even with strangers.","exFr":"Les locaux ici sont incroyablement généreux, même avec des inconnus.","id":"adj:2:the-locals-are-so-generous"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"He seemed really genuine.","fr":"Il avait l'air vraiment sincère.","ex":"He seemed genuine, not just trying to sell me something.","exFr":"Il avait l'air sincère, pas juste en train d'essayer de me vendre quelque chose.","id":"adj:2:he-seemed-really-genuine"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"My roommate is super talkative.","fr":"Mon coloc est super bavard.","ex":"My roommate at the hostel is super talkative, we chatted all night.","exFr":"Mon coloc à l'auberge est super bavard, on a discuté toute la nuit.","id":"adj:2:my-roommate-is-super-talkative"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"This community is welcoming.","fr":"Cette communauté est accueillante.","ex":"The community here is really welcoming to travellers.","exFr":"La communauté ici est vraiment accueillante envers les voyageurs.","id":"adj:2:this-community-is-welcoming"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"She's very down-to-earth.","fr":"Elle a les pieds sur terre.","ex":"She's very down-to-earth for someone who's travelled so much.","exFr":"Elle a vraiment les pieds sur terre pour quelqu'un qui a autant voyagé.","id":"adj:2:she-s-very-down-to-earth"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"He was so kind to us.","fr":"Il a été tellement gentil avec nous.","ex":"The owner of the guesthouse was so kind to us during our stay.","exFr":"Le propriétaire de la guesthouse a été tellement gentil avec nous pendant notre séjour.","id":"adj:2:he-was-so-kind-to-us"},{"col":"adj","deck":2,"type":"phrase","tag":"greet","en":"He's really outgoing.","fr":"Il est vraiment extraverti.","ex":"He's outgoing, he talks to everyone at the bar.","exFr":"Il est extraverti, il parle à tout le monde au bar.","id":"adj:2:he-s-really-outgoing"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"The driver was pretty rude.","fr":"Le chauffeur a été plutôt impoli.","ex":"The taxi driver was pretty rude about the price.","exFr":"Le chauffeur de taxi a été plutôt impoli à propos du prix.","id":"adj:3:the-driver-was-pretty-rude"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"Some tourists are arrogant.","fr":"Certains touristes sont arrogants.","ex":"Some tourists can be really arrogant with the locals.","exFr":"Certains touristes peuvent être vraiment arrogants avec les locaux.","id":"adj:3:some-tourists-are-arrogant"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"The tour was kind of boring.","fr":"La visite était un peu ennuyeuse.","ex":"The tour was kind of boring, honestly, too long and slow.","exFr":"La visite était un peu ennuyeuse, franchement, trop longue et lente.","id":"adj:3:the-tour-was-kind-of-boring"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"It's annoying when that happens.","fr":"C'est agaçant quand ça arrive.","ex":"It's annoying when people try to overcharge you as a tourist.","exFr":"C'est agaçant quand les gens essaient de te surfacturer en tant que touriste.","id":"adj:3:it-s-annoying-when-that-happens"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"That guy looked pretty shady.","fr":"Ce type avait l'air louche.","ex":"That guy selling tickets outside looked pretty shady.","exFr":"Ce type qui vendait des billets dehors avait l'air louche.","id":"adj:3:that-guy-looked-pretty-shady"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"Street vendors can be pushy.","fr":"Les vendeurs de rue peuvent être insistants.","ex":"The street vendors can be really pushy sometimes.","exFr":"Les vendeurs de rue peuvent être vraiment insistants parfois.","id":"adj:3:street-vendors-can-be-pushy"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"It felt kind of weird.","fr":"C'était un peu bizarre.","ex":"It felt weird being the only foreigner there.","exFr":"C'était bizarre d'être le seul étranger là-bas.","id":"adj:3:it-felt-kind-of-weird"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"The schedule is unreliable.","fr":"Les horaires ne sont pas fiables.","ex":"The bus schedule here is completely unreliable.","exFr":"Les horaires de bus ici ne sont vraiment pas fiables.","id":"adj:3:the-schedule-is-unreliable"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"Some conversations are exhausting.","fr":"Certaines conversations sont épuisantes.","ex":"Some conversations in a foreign language can be really exhausting.","exFr":"Certaines conversations dans une langue étrangère peuvent être vraiment épuisantes.","id":"adj:3:some-conversations-are-exhausting"},{"col":"adj","deck":3,"type":"phrase","tag":"misc","en":"He got a bit clingy.","fr":"Il est devenu un peu collant.","ex":"He got a bit clingy after we hung out just once.","exFr":"Il est devenu un peu collant après qu'on ait traîné ensemble une seule fois.","id":"adj:3:he-got-a-bit-clingy"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"The beach is beautiful.","fr":"La plage est magnifique.","ex":"The beach here is absolutely beautiful, especially at sunset.","exFr":"La plage ici est absolument magnifique, surtout au coucher du soleil.","id":"adj:4:the-beach-is-beautiful"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"The market gets crowded.","fr":"Le marché devient bondé.","ex":"The market gets really crowded at weekends.","exFr":"Le marché devient vraiment bondé le week-end.","id":"adj:4:the-market-gets-crowded"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"I found a peaceful spot.","fr":"J'ai trouvé un endroit paisible.","ex":"I found a peaceful spot just outside the city.","exFr":"J'ai trouvé un endroit paisible juste à l'extérieur de la ville.","id":"adj:4:i-found-a-peaceful-spot"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"The traffic here is chaotic.","fr":"La circulation ici est chaotique.","ex":"The traffic here is completely chaotic, especially at rush hour.","exFr":"La circulation ici est complètement chaotique, surtout aux heures de pointe.","id":"adj:4:the-traffic-here-is-chaotic"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"This area feels too touristy.","fr":"Ce coin fait trop touristique.","ex":"This part of town feels too touristy for me.","exFr":"Cette partie de la ville fait trop touristique pour moi.","id":"adj:4:this-area-feels-too-touristy"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"Cambodia is really affordable.","fr":"Le Cambodge est vraiment abordable.","ex":"Cambodia is really affordable compared to Australia.","exFr":"Le Cambodge est vraiment abordable comparé à l'Australie.","id":"adj:4:cambodia-is-really-affordable"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"I feel pretty safe here.","fr":"Je me sens plutôt en sécurité ici.","ex":"I feel pretty safe walking around at night here.","exFr":"Je me sens plutôt en sécurité en me baladant la nuit ici.","id":"adj:4:i-feel-pretty-safe-here"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"We stayed in a remote village.","fr":"On a logé dans un village isolé.","ex":"We stayed in a remote village for a few days, no wifi at all.","exFr":"On a logé dans un village isolé pendant quelques jours, sans wifi du tout.","id":"adj:4:we-stayed-in-a-remote-village"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"The night market is vibrant.","fr":"Le marché de nuit est vivant.","ex":"The night market has such a vibrant atmosphere.","exFr":"Le marché de nuit a une ambiance tellement vivante.","id":"adj:4:the-night-market-is-vibrant"},{"col":"adj","deck":4,"type":"phrase","tag":"ask","en":"I want something more authentic.","fr":"Je veux quelque chose de plus authentique.","ex":"I'm looking for a more authentic experience, away from the tourists.","exFr":"Je cherche une expérience plus authentique, loin des touristes.","id":"adj:4:i-want-something-more-authentic"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"This soup is delicious.","fr":"Cette soupe est délicieuse.","ex":"This noodle soup is absolutely delicious.","exFr":"Cette soupe de nouilles est absolument délicieuse.","id":"adj:5:this-soup-is-delicious"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"This dish is really spicy.","fr":"Ce plat est vraiment épicé.","ex":"Careful, this dish is really spicy, more than it looks.","exFr":"Fais gaffe, ce plat est vraiment épicé, plus qu'il n'en a l'air.","id":"adj:5:this-dish-is-really-spicy"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"The fruit is so fresh here.","fr":"Les fruits sont tellement frais ici.","ex":"The fruit here is so fresh and cheap.","exFr":"Les fruits ici sont tellement frais et pas chers.","id":"adj:5:the-fruit-is-so-fresh-here"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"Street food is really cheap.","fr":"La street food est vraiment pas chère.","ex":"Street food is really cheap in Phnom Penh.","exFr":"La street food est vraiment pas chère à Phnom Penh.","id":"adj:5:street-food-is-really-cheap"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"That was a bit greasy.","fr":"C'était un peu gras.","ex":"That fried rice was a bit too greasy for me.","exFr":"Ce riz frit était un peu trop gras pour moi.","id":"adj:5:that-was-a-bit-greasy"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"The food was pretty bland.","fr":"La nourriture était plutôt fade.","ex":"The food at that hotel was pretty bland, no spices at all.","exFr":"La nourriture à cet hôtel était plutôt fade, aucune épice.","id":"adj:5:the-food-was-pretty-bland"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"I tried some exotic fruits.","fr":"J'ai goûté des fruits exotiques.","ex":"I tried some exotic fruits I'd never even seen before.","exFr":"J'ai goûté des fruits exotiques que je n'avais même jamais vus avant.","id":"adj:5:i-tried-some-exotic-fruits"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"This iced coffee is addictive.","fr":"Ce café glacé est addictif.","ex":"This iced coffee is addictive, I drink it every single day.","exFr":"Ce café glacé est addictif, j'en bois tous les jours.","id":"adj:5:this-iced-coffee-is-addictive"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"That meal was so filling.","fr":"Ce repas était tellement rassasiant.","ex":"That meal was so filling, I couldn't move afterwards.","exFr":"Ce repas était tellement rassasiant, je ne pouvais plus bouger après.","id":"adj:5:that-meal-was-so-filling"},{"col":"adj","deck":5,"type":"phrase","tag":"ask","en":"That restaurant is overpriced.","fr":"Ce restaurant est trop cher.","ex":"That restaurant near the hotel is overpriced for what it is.","exFr":"Ce restaurant près de l'hôtel est trop cher pour ce que c'est.","id":"adj:5:that-restaurant-is-overpriced"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"The bed is really comfortable.","fr":"Le lit est vraiment confortable.","ex":"The bed in my guesthouse is really comfortable, better than expected.","exFr":"Le lit dans ma guesthouse est vraiment confortable, mieux que prévu.","id":"adj:6:the-bed-is-really-comfortable"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"The room is pretty basic.","fr":"La chambre est assez basique.","ex":"The room is basic, but it does the job.","exFr":"La chambre est basique, mais elle fait le travail.","id":"adj:6:the-room-is-pretty-basic"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"I look for a clean place.","fr":"Je cherche un endroit propre.","ex":"I always look for a clean, quiet place to stay.","exFr":"Je cherche toujours un endroit propre et calme pour rester.","id":"adj:6:i-look-for-a-clean-place"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"It's really noisy at night.","fr":"C'est vraiment bruyant la nuit.","ex":"The street outside my room is really noisy at night.","exFr":"La rue devant ma chambre est vraiment bruyante la nuit.","id":"adj:6:it-s-really-noisy-at-night"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"The apartment is spacious.","fr":"L'appartement est spacieux.","ex":"The apartment I rented is surprisingly spacious for the price.","exFr":"L'appartement que j'ai loué est étonnamment spacieux pour le prix.","id":"adj:6:the-apartment-is-spacious"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"That room felt cramped.","fr":"Cette chambre était exiguë.","ex":"The last hostel room felt really cramped, barely space to move.","exFr":"La dernière chambre d'auberge était vraiment exiguë, à peine de la place pour bouger.","id":"adj:6:that-room-felt-cramped"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"This guesthouse is cosy.","fr":"Cette guesthouse est douillette.","ex":"This little guesthouse is cosy and pretty cheap too.","exFr":"Cette petite guesthouse est douillette et pas chère non plus.","id":"adj:6:this-guesthouse-is-cosy"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"It looked a bit shabby.","fr":"Ça avait l'air un peu miteux.","ex":"The place looked a bit shabby, but it was fine for one night.","exFr":"L'endroit avait l'air un peu miteux, mais c'était bien pour une nuit.","id":"adj:6:it-looked-a-bit-shabby"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"I need a quiet place to work.","fr":"J'ai besoin d'un endroit calme pour bosser.","ex":"I need a quiet place to work during the day.","exFr":"J'ai besoin d'un endroit calme pour travailler la journée.","id":"adj:6:i-need-a-quiet-place-to-work"},{"col":"adj","deck":6,"type":"phrase","tag":"ask","en":"The building is a bit run-down.","fr":"Le bâtiment est un peu délabré.","ex":"The building is a bit run-down, but the location is great.","exFr":"Le bâtiment est un peu délabré, mais l'emplacement est top.","id":"adj:6:the-building-is-a-bit-run-down"},{"col":"adj","deck":7,"type":"phrase","tag":"greet","en":"I'm excited to explore again.","fr":"J'ai hâte d'explorer encore.","ex":"I'm excited to explore a new country again.","exFr":"J'ai hâte d'explorer un nouveau pays encore une fois.","id":"adj:7:i-m-excited-to-explore-again"},{"col":"adj","deck":7,"type":"phrase","tag":"misc","en":"I was exhausted after that.","fr":"J'étais épuisé après ça.","ex":"I was exhausted after that overnight bus ride.","exFr":"J'étais épuisé après ce trajet en bus de nuit.","id":"adj:7:i-was-exhausted-after-that"},{"col":"adj","deck":7,"type":"phrase","tag":"misc","en":"I sometimes get homesick.","fr":"Le mal du pays me prend parfois.","ex":"I sometimes get homesick, especially around Christmas.","exFr":"Le mal du pays me prend parfois, surtout à Noël.","id":"adj:7:i-sometimes-get-homesick"},{"col":"adj","deck":7,"type":"phrase","tag":"misc","en":"Big cities feel overwhelming.","fr":"Les grandes villes peuvent être écrasantes.","ex":"Big cities like Bangkok can feel overwhelming at first.","exFr":"Les grandes villes comme Bangkok peuvent sembler écrasantes au début.","id":"adj:7:big-cities-feel-overwhelming"},{"col":"adj","deck":7,"type":"phrase","tag":"greet","en":"I feel grateful for this life.","fr":"Je me sens reconnaissant pour cette vie.","ex":"I feel grateful for the life I've built while travelling.","exFr":"Je me sens reconnaissant pour la vie que j'ai construite en voyageant.","id":"adj:7:i-feel-grateful-for-this-life"},{"col":"adj","deck":7,"type":"phrase","tag":"misc","en":"I was a bit nervous at first.","fr":"J'étais un peu nerveux au début.","ex":"I was a bit nervous before speaking English to strangers.","exFr":"J'étais un peu nerveux avant de parler anglais à des inconnus.","id":"adj:7:i-was-a-bit-nervous-at-first"},{"col":"adj","deck":7,"type":"phrase","tag":"greet","en":"I feel much more relaxed now.","fr":"Je me sens beaucoup plus détendu maintenant.","ex":"I feel much more relaxed since I slowed down my pace.","exFr":"Je me sens beaucoup plus détendu depuis que j'ai ralenti le rythme.","id":"adj:7:i-feel-much-more-relaxed-now"},{"col":"adj","deck":7,"type":"phrase","tag":"greet","en":"I stay motivated to learn.","fr":"Je reste motivé pour apprendre.","ex":"Meeting other travellers keeps me motivated to keep learning English.","exFr":"Rencontrer d'autres voyageurs me garde motivé pour continuer à apprendre l'anglais.","id":"adj:7:i-stay-motivated-to-learn"},{"col":"adj","deck":7,"type":"phrase","tag":"misc","en":"Solo travel can get lonely.","fr":"Voyager seul peut devenir solitaire.","ex":"Solo travel can get lonely sometimes, even in a group hostel.","exFr":"Voyager seul peut devenir solitaire parfois, même dans une auberge pleine de monde.","id":"adj:7:solo-travel-can-get-lonely"},{"col":"adj","deck":7,"type":"phrase","tag":"greet","en":"I feel really free.","fr":"Je me sens vraiment libre.","ex":"I feel free, I can work and live wherever I want.","exFr":"Je me sens libre, je peux travailler et vivre où je veux.","id":"adj:7:i-feel-really-free"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"That trek was amazing.","fr":"Ce trek était incroyable.","ex":"That trek in Nepal was an amazing experience.","exFr":"Ce trek au Népal était une expérience incroyable.","id":"adj:8:that-trek-was-amazing"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"It's been unforgettable.","fr":"C'était inoubliable.","ex":"Meeting people from all over the world has been unforgettable.","exFr":"Rencontrer des gens du monde entier a été inoubliable.","id":"adj:8:it-s-been-unforgettable"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"It was thrilling at first.","fr":"C'était grisant au début.","ex":"Riding a scooter through the city was thrilling at first.","exFr":"Conduire un scooter dans la ville était grisant au début.","id":"adj:8:it-was-thrilling-at-first"},{"col":"adj","deck":8,"type":"phrase","tag":"misc","en":"That was terrifying.","fr":"C'était terrifiant.","ex":"That boat ride during the storm was terrifying.","exFr":"Ce trajet en bateau pendant la tempête était terrifiant.","id":"adj:8:that-was-terrifying"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"It's so relaxing.","fr":"C'est tellement relaxant.","ex":"A day at the beach is exactly what I needed, so relaxing.","exFr":"Une journée à la plage, c'est exactement ce qu'il me fallait, tellement relaxant.","id":"adj:8:it-s-so-relaxing"},{"col":"adj","deck":8,"type":"phrase","tag":"say","en":"It's been challenging.","fr":"Ça a été difficile.","ex":"Learning English while travelling has been challenging but worth it.","exFr":"Apprendre l'anglais en voyageant a été difficile mais ça en valait la peine.","id":"adj:8:it-s-been-challenging"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"It's been really rewarding.","fr":"Ça a été vraiment gratifiant.","ex":"Building my agency remotely has been really rewarding.","exFr":"Construire mon agence à distance a été vraiment gratifiant.","id":"adj:8:it-s-been-really-rewarding"},{"col":"adj","deck":8,"type":"phrase","tag":"misc","en":"It can feel risky.","fr":"Ça peut sembler risqué.","ex":"Travelling without a fixed plan can feel risky sometimes.","exFr":"Voyager sans plan fixe peut sembler risqué parfois.","id":"adj:8:it-can-feel-risky"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"It was totally worthwhile.","fr":"Ça en valait vraiment la peine.","ex":"That long trip to the temple was totally worthwhile.","exFr":"Ce long trajet jusqu'au temple en valait vraiment la peine.","id":"adj:8:it-was-totally-worthwhile"},{"col":"adj","deck":8,"type":"phrase","tag":"greet","en":"It was life-changing.","fr":"Ça a changé ma vie.","ex":"Leaving everything behind three years ago was life-changing.","exFr":"Tout quitter il y a trois ans a changé ma vie.","id":"adj:8:it-was-life-changing"},{"col":"adj","deck":9,"type":"phrase","tag":"say","en":"I've been really busy.","fr":"J'ai été vraiment occupé.","ex":"I've been really busy with client projects this week.","exFr":"J'ai été vraiment occupé avec des projets clients cette semaine.","id":"adj:9:i-ve-been-really-busy"},{"col":"adj","deck":9,"type":"phrase","tag":"greet","en":"My schedule is flexible.","fr":"Mon emploi du temps est flexible.","ex":"My schedule is flexible, so I can travel whenever I want.","exFr":"Mon emploi du temps est flexible, donc je peux voyager quand je veux.","id":"adj:9:my-schedule-is-flexible"},{"col":"adj","deck":9,"type":"phrase","tag":"say","en":"I'm more productive in the morning.","fr":"Je suis plus productif le matin.","ex":"I'm more productive in the morning before it gets too hot.","exFr":"Je suis plus productif le matin avant qu'il fasse trop chaud.","id":"adj:9:i-m-more-productive-in-the-morning"},{"col":"adj","deck":9,"type":"phrase","tag":"misc","en":"Some weeks are pretty stressful.","fr":"Certaines semaines sont assez stressantes.","ex":"Some weeks with clients can be pretty stressful.","exFr":"Certaines semaines avec des clients peuvent être assez stressantes.","id":"adj:9:some-weeks-are-pretty-stressful"},{"col":"adj","deck":9,"type":"phrase","tag":"say","en":"I need a reliable wifi.","fr":"J'ai besoin d'un wifi fiable.","ex":"I need a reliable wifi connection to work properly.","exFr":"J'ai besoin d'une connexion wifi fiable pour bien travailler.","id":"adj:9:i-need-a-reliable-wifi"},{"col":"adj","deck":9,"type":"phrase","tag":"misc","en":"Some clients are demanding.","fr":"Certains clients sont exigeants.","ex":"Some clients can be pretty demanding sometimes.","exFr":"Certains clients peuvent être assez exigeants parfois.","id":"adj:9:some-clients-are-demanding"},{"col":"adj","deck":9,"type":"phrase","tag":"say","en":"I try to be efficient.","fr":"J'essaie d'être efficace.","ex":"I try to be efficient so I have time to explore.","exFr":"J'essaie d'être efficace pour avoir du temps pour explorer.","id":"adj:9:i-try-to-be-efficient"},{"col":"adj","deck":9,"type":"phrase","tag":"greet","en":"It keeps me creative.","fr":"Ça me garde créatif.","ex":"Web design lets me stay creative every day.","exFr":"Le design web me permet de rester créatif tous les jours.","id":"adj:9:it-keeps-me-creative"},{"col":"adj","deck":9,"type":"phrase","tag":"say","en":"I'm self-employed.","fr":"Je suis à mon compte.","ex":"Being self-employed means I set my own hours.","exFr":"Être à mon compte veut dire que je fixe mes propres horaires.","id":"adj:9:i-m-self-employed"},{"col":"adj","deck":9,"type":"phrase","tag":"misc","en":"My income is unpredictable.","fr":"Mes revenus sont imprévisibles.","ex":"My income is a bit unpredictable, it depends on the clients.","exFr":"Mes revenus sont un peu imprévisibles, ça dépend des clients.","id":"adj:9:my-income-is-unpredictable"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"I've always been adventurous.","fr":"J'ai toujours été aventurier.","ex":"I've always been adventurous, even as a kid.","exFr":"J'ai toujours été aventurier, même quand j'étais gamin.","id":"adj:10:i-ve-always-been-adventurous"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"I was determined to leave.","fr":"J'étais déterminé à partir.","ex":"I was determined to leave and build a different life.","exFr":"J'étais déterminé à partir et construire une vie différente.","id":"adj:10:i-was-determined-to-leave"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"It made me more grounded.","fr":"Ça m'a rendu plus posé.","ex":"Travelling for years has actually made me more grounded.","exFr":"Voyager pendant des années m'a en fait rendu plus posé.","id":"adj:10:it-made-me-more-grounded"},{"col":"adj","deck":10,"type":"phrase","tag":"misc","en":"I get restless easily.","fr":"Je deviens vite agité.","ex":"I get restless if I stay in one place too long.","exFr":"Je deviens vite agité si je reste trop longtemps au même endroit.","id":"adj:10:i-get-restless-easily"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"I'm pretty content with my life.","fr":"Je suis plutôt satisfait de ma vie.","ex":"I'm pretty content with the life I've built so far.","exFr":"Je suis plutôt satisfait de la vie que j'ai construite jusqu'à présent.","id":"adj:10:i-m-pretty-content-with-my-life"},{"col":"adj","deck":10,"type":"phrase","tag":"misc","en":"My plans are still uncertain.","fr":"Mes plans sont encore incertains.","ex":"My plans after Cambodia are still uncertain.","exFr":"Mes plans après le Cambodge sont encore incertains.","id":"adj:10:my-plans-are-still-uncertain"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"I'm proud of what I've built.","fr":"Je suis fier de ce que j'ai construit.","ex":"I'm proud of what I've built with my agency.","exFr":"Je suis fier de ce que j'ai construit avec mon agence.","id":"adj:10:i-m-proud-of-what-i-ve-built"},{"col":"adj","deck":10,"type":"phrase","tag":"say","en":"I get a bit nostalgic.","fr":"Je deviens un peu nostalgique.","ex":"I get a bit nostalgic when I think about Marseille.","exFr":"Je deviens un peu nostalgique quand je pense à Marseille.","id":"adj:10:i-get-a-bit-nostalgic"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"I stay optimistic.","fr":"Je reste optimiste.","ex":"I stay optimistic even when things don't go as planned.","exFr":"Je reste optimiste même quand les choses ne se passent pas comme prévu.","id":"adj:10:i-stay-optimistic"},{"col":"adj","deck":10,"type":"phrase","tag":"greet","en":"I feel more fulfilled now.","fr":"Je me sens plus épanoui maintenant.","ex":"Honestly, I feel more fulfilled now than I ever did in France.","exFr":"Honnêtement, je me sens plus épanoui maintenant que je ne l'ai jamais été en France.","id":"adj:10:i-feel-more-fulfilled-now"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to hang out","fr":"traîner (avec des gens)","ex":"We hung out at the beach until sunset.","exFr":"On a traîné à la plage jusqu'au coucher du soleil.","pho":"hang aoute","id":"voc:1:to-hang-out"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to figure out","fr":"comprendre / trouver","ex":"I need to figure out my next destination.","exFr":"Je dois trouver ma prochaine destination.","pho":"figuieur aoute","id":"voc:1:to-figure-out"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to end up","fr":"finir par","ex":"We ended up staying three extra days.","exFr":"On a fini par rester trois jours de plus.","pho":"ènde ap","id":"voc:1:to-end-up"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to get along","fr":"bien s'entendre","ex":"We got along really well from the start.","exFr":"On s'est super bien entendus dès le début.","pho":"guette euh-long","id":"voc:1:to-get-along"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to check out","fr":"regarder / essayer","ex":"You should check out that rooftop bar.","exFr":"Tu devrais essayer ce bar sur le toit.","pho":"tchèque aoute","id":"voc:1:to-check-out"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to run into","fr":"tomber sur qqn par hasard","ex":"I ran into her again at the market.","exFr":"Je suis retombé sur elle au marché.","pho":"reune inntou","id":"voc:1:to-run-into"},{"col":"voc","deck":1,"type":"phrase","tag":"verb","en":"to catch up","fr":"se remettre à jour / papoter" nuits.","pho":"bouk eu hostoul","id":"voc:4:to-book-a-hostel"},{"col":"voc","deck":4,"type":"phrase","tag":"trip","en":"an overnight bus","fr":"un bus de nuit","ex":"We took an overnight bus to save money.","exFr":"On a pris un bus de nuit pour économiser.","pho":"eun auveur-naïte basse","id":"voc:4:an-overnight-bus"},{"col":"voc","deck":4,"type":"phrase","tag":"trip","en":"to wing it","fr":"improviser","ex":"We didn't plan anything, we just winged it.","exFr":"On n'a rien prévu, on a juste improvisé.","pho":"tou ouigne itt","id":"voc:4:to-wing-it"},{"col":"voc","deck":4,"type":"phrase","tag":"trip","en":"a visa run","fr":"un aller-retour pour renouveler le visa","ex":"I need to do a visa run next week.","exFr":"Je dois faire un aller-retour visa la semaine prochaine.","pho":"eu vizeu reunn","id":"voc:4:a-visa-run"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"kind of","fr":"un peu / en quelque sorte","ex":"I'm kind of tired today.","exFr":"Je suis un peu fatigué aujourd'hui.","pho":"kaïnd euv","id":"voc:5:kind-of"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"sort of","fr":"plus ou moins","ex":"It's sort of complicated to explain.","exFr":"C'est plus ou moins compliqué à expliquer.","pho":"sort euv","id":"voc:5:sort-of"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"honestly","fr":"honnêtement","ex":"Honestly, I didn't expect that.","exFr":"Honnêtement, je ne m'attendais pas à ça.","pho":"onnistli","id":"voc:5:honestly"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"to be fair","fr":"pour être juste","ex":"To be fair, it wasn't his fault.","exFr":"Pour être juste, ce n'était pas de sa faute.","pho":"tou bi fèr","id":"voc:5:to-be-fair"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"basically","fr":"en gros","ex":"Basically, I just improvise everything.","exFr":"En gros, j'improvise tout.","pho":"béissiquli","id":"voc:5:basically"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"or something","fr":"ou un truc comme ça","ex":"Let's grab a coffee or something.","exFr":"Allons prendre un café ou un truc comme ça.","pho":"or somssingn","id":"voc:5:or-something"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"and stuff","fr":"et tout ça","ex":"We talked about travel and stuff.","exFr":"On a parlé de voyage et tout ça.","pho":"annde staffe","id":"voc:5:and-stuff"},{"col":"voc","deck":5,"type":"phrase","tag":"filler","en":"pretty much","fr":"quasiment","ex":"I've pretty much seen everything here.","exFr":"J'ai quasiment tout vu ici.","pho":"priti meutch","id":"voc:5:pretty-much"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"and","fr":"et","ex":"I love travelling and meeting new people.","exFr":"J'adore voyager et rencontrer de nouvelles personnes.","id":"con:1:and"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"also","fr":"aussi","ex":"I speak French. I also speak a bit of Spanish.","exFr":"Je parle français. Je parle aussi un peu espagnol.","id":"con:1:also"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"moreover","fr":"de plus","ex":"The flight was cheap. Moreover, the seats were comfortable.","exFr":"Le vol était pas cher. De plus, les sièges étaient confortables.","id":"con:1:moreover"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"furthermore","fr":"en outre / de plus","ex":"The hostel is clean. Furthermore, it's close to the beach.","exFr":"L'auberge est propre. En outre, elle est proche de la plage.","id":"con:1:furthermore"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"in addition","fr":"en plus / de plus","ex":"In addition to English, I'm learning Thai.","exFr":"En plus de l'anglais, j'apprends le thaï.","id":"con:1:in-addition"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"besides","fr":"en plus / d'ailleurs","ex":"Besides surfing, I also enjoy hiking.","exFr":"En plus du surf, j'aime aussi la randonnée.","id":"con:1:besides"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"as well as","fr":"ainsi que","ex":"She speaks English as well as French.","exFr":"Elle parle anglais ainsi que français.","id":"con:1:as-well-as"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"not only... but also","fr":"non seulement... mais aussi","ex":"He's not only friendly but also very helpful.","exFr":"Il n'est pas seulement sympa, mais aussi très serviable.","id":"con:1:not-only-but-also"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"what's more","fr":"qui plus est","ex":"The view is amazing. What's more, it's free.","exFr":"La vue est incroyable. Qui plus est, c'est gratuit.","id":"con:1:what-s-more"},{"col":"con","deck":1,"type":"phrase","tag":"add","en":"plus","fr":"en plus","ex":"The apartment is cheap, plus it has wifi.","exFr":"L'appartement est pas cher, en plus il a le wifi.","id":"con:1:plus"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"but","fr":"mais","ex":"I wanted to stay, but my visa expired.","exFr":"Je voulais rester, mais mon visa a expiré.","id":"con:2:but"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"however","fr":"cependant / toutefois","ex":"The city is beautiful. However, it's very crowded.","exFr":"La ville est belle. Cependant, elle est très bondée.","id":"con:2:however"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"although","fr":"bien que","ex":"Although it was raining, we went hiking.","exFr":"Bien qu'il ait plu, nous sommes allés randonner.","id":"con:2:although"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"even though","fr":"même si","ex":"Even though I was tired, I kept working.","exFr":"Même si j'étais fatigué, j'ai continué à travailler.","id":"con:2:even-though"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"despite","fr":"malgré","ex":"Despite the heat, the market was full of people.","exFr":"Malgré la chaleur, le marché était plein de monde.","id":"con:2:despite"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"in spite of","fr":"malgré","ex":"In spite of the delay, we made it on time.","exFr":"Malgré le retard, nous sommes arrivés à l'heure.","id":"con:2:in-spite-of"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"on the other hand","fr":"d'un autre côté","ex":"I love the food here. On the other hand, it's very spicy.","exFr":"J'adore la nourriture ici. D'un autre côté, c'est très épicé.","id":"con:2:on-the-other-hand"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"whereas","fr":"alors que / tandis que","ex":"I prefer the mountains, whereas she prefers the beach.","exFr":"Je préfère la montagne, alors qu'elle préfère la plage.","id":"con:2:whereas"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"yet","fr":"pourtant","ex":"The room was small, yet very cosy.","exFr":"La chambre était petite, et pourtant très chaleureuse.","id":"con:2:yet"},{"col":"con","deck":2,"type":"phrase","tag":"opp","en":"nevertheless","fr":"néanmoins","ex":"It was expensive. Nevertheless, it was worth it.","exFr":"C'était cher. Néanmoins, ça en valait la peine.","id":"con:2:nevertheless"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"because","fr":"parce que","ex":"I stayed home because it was raining.","exFr":"Je suis resté à la maison parce qu'il pleuvait.","id":"con:3:because"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"since","fr":"puisque","ex":"Since you're here, let's grab a coffee.","exFr":"Puisque tu es là, allons boire un café.","id":"con:3:since"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"as","fr":"comme / puisque","ex":"As it was late, we decided to leave.","exFr":"Comme il était tard, nous avons décidé de partir.","id":"con:3:as"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"due to","fr":"en raison de","ex":"The flight was delayed due to bad weather.","exFr":"Le vol a été retardé en raison du mauvais temps.","id":"con:3:due-to"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"owing to","fr":"en raison de","ex":"Owing to the strike, the trains aren't running.","exFr":"En raison de la grève, les trains ne circulent pas.","id":"con:3:owing-to"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"because of","fr":"à cause de","ex":"We got lost because of the bad map.","exFr":"Nous nous sommes perdus à cause de la mauvaise carte.","id":"con:3:because-of"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"thanks to","fr":"grâce à","ex":"Thanks to you, I found the right bus.","exFr":"Grâce à toi, j'ai trouvé le bon bus.","id":"con:3:thanks-to"},{"col":"con","deck":3,"type":"phrase","tag":"cause","en":"given that","fr":"étant donné que","ex":"Given that it's a holiday, everything is closed.","exFr":"Étant donné que c'est un jour férié, tout est fermé.","id":"con:3:given-that"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"so","fr":"donc","ex":"It was late, so we took a taxi.","exFr":"Il était tard, donc nous avons pris un taxi.","id":"con:4:so"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"therefore","fr":"par conséquent","ex":"The road was closed, therefore we took another route.","exFr":"La route était fermée, par conséquent nous avons pris un autre chemin.","id":"con:4:therefore"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"thus","fr":"ainsi","ex":"He didn't book early, thus he paid more.","exFr":"Il n'a pas réservé tôt, ainsi il a payé plus cher.","id":"con:4:thus"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"as a result","fr":"résultat / par conséquent","ex":"She missed the bus. As a result, she was late for work.","exFr":"Elle a raté le bus. Résultat, elle est arrivée en retard au travail.","id":"con:4:as-a-result"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"consequently","fr":"par conséquent","ex":"Prices went up, consequently fewer tourists came.","exFr":"Les prix ont augmenté, par conséquent moins de touristes sont venus.","id":"con:4:consequently"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"hence","fr":"d'où","ex":"He studies hard, hence his good grades.","exFr":"Il étudie dur, d'où ses bonnes notes.","id":"con:4:hence"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"that's why","fr":"c'est pourquoi","ex":"I love the sea, that's why I moved to the coast.","exFr":"J'adore la mer, c'est pourquoi j'ai déménagé sur la côte.","id":"con:4:that-s-why"},{"col":"con","deck":4,"type":"phrase","tag":"cause","en":"as a consequence","fr":"en conséquence","ex":"The bridge collapsed. As a consequence, traffic was diverted.","exFr":"Le pont s'est effondré. En conséquence, la circulation a été déviée.","id":"con:4:as-a-consequence"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"then","fr":"puis / alors","ex":"We had lunch, then we went to the museum.","exFr":"Nous avons déjeuné, puis nous sommes allés au musée.","id":"con:5:then"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"after that","fr":"après ça","ex":"I finished work, and after that I called my parents.","exFr":"J'ai fini le travail, et après ça j'ai appelé mes parents.","id":"con:5:after-that"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"before","fr":"avant","ex":"Check the weather before you leave.","exFr":"Vérifie la météo avant de partir.","id":"con:5:before"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"while","fr":"pendant que","ex":"I read a book while waiting for the train.","exFr":"J'ai lu un livre pendant que j'attendais le train.","id":"con:5:while"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"meanwhile","fr":"pendant ce temps","ex":"He was cooking dinner. Meanwhile, I set the table.","exFr":"Il préparait le dîner. Pendant ce temps, j'ai mis la table.","id":"con:5:meanwhile"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"afterwards","fr":"par la suite","ex":"We watched the sunset and afterwards had dinner.","exFr":"Nous avons regardé le coucher de soleil et ensuite nous avons dîné.","id":"con:5:afterwards"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"eventually","fr":"finalement","ex":"It took hours, but we eventually found the hotel.","exFr":"Ça a pris des heures, mais nous avons fini par trouver l'hôtel.","id":"con:5:eventually"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"finally","fr":"enfin / finalement","ex":"After three flights, we finally arrived home.","exFr":"Après trois vols, nous sommes enfin arrivés chez nous.","id":"con:5:finally"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"first","fr":"d'abord","ex":"First, book your flight, then find a hostel.","exFr":"D'abord, réserve ton vol, ensuite trouve une auberge.","id":"con:5:first"},{"col":"con","deck":5,"type":"phrase","tag":"time","en":"next","fr":"ensuite","ex":"Next, we're heading to Vietnam.","exFr":"Ensuite, nous partons pour le Vietnam.","id":"con:5:next"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"if","fr":"si","ex":"If it rains, we'll stay inside.","exFr":"S'il pleut, nous resterons à l'intérieur.","id":"con:6:if"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"unless","fr":"à moins que","ex":"I won't go unless you come with me.","exFr":"Je n'irai pas à moins que tu viennes avec moi.","id":"con:6:unless"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"provided that","fr":"à condition que","ex":"You can stay here, provided that you help clean.","exFr":"Tu peux rester ici, à condition que tu aides à nettoyer.","id":"con:6:provided-that"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"as long as","fr":"tant que","ex":"As long as you have wifi, you can work anywhere.","exFr":"Tant que tu as le wifi, tu peux travailler n'importe où.","id":"con:6:as-long-as"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"otherwise","fr":"sinon","ex":"Book now, otherwise the flight will be full.","exFr":"Réserve maintenant, sinon le vol sera complet.","id":"con:6:otherwise"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"in case","fr":"au cas où","ex":"Take a jacket in case it gets cold.","exFr":"Prends une veste au cas où il ferait froid.","id":"con:6:in-case"},{"col":"con","deck":6,"type":"phrase","tag":"opp","en":"even if","fr":"même si","ex":"I'll go even if it's raining.","exFr":"J'irai même s'il pleut.","id":"con:6:even-if"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"for example","fr":"par exemple","ex":"Some countries are cheap, for example Vietnam.","exFr":"Certains pays sont pas chers, par exemple le Vietnam.","id":"con:7:for-example"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"for instance","fr":"par exemple","ex":"I love spicy food, Thai curry for instance.","exFr":"J'adore la nourriture épicée, le curry thaï par exemple.","id":"con:7:for-instance"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"such as","fr":"tel que / comme","ex":"Cities such as Bangkok are great for digital nomads.","exFr":"Des villes comme Bangkok sont géniales pour les nomades digitaux.","id":"con:7:such-as"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"like","fr":"comme","ex":"I enjoy activities like surfing and diving.","exFr":"J'aime les activités comme le surf et la plongée.","id":"con:7:like"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"namely","fr":"à savoir","ex":"Two things matter most, namely time and money.","exFr":"Deux choses comptent le plus, à savoir le temps et l'argent.","id":"con:7:namely"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"in particular","fr":"en particulier","ex":"I love Asian food, in particular Vietnamese pho.","exFr":"J'adore la cuisine asiatique, en particulier le pho vietnamien.","id":"con:7:in-particular"},{"col":"con","deck":7,"type":"phrase","tag":"add","en":"specifically","fr":"plus précisément","ex":"I'm looking for a place, specifically near the beach.","exFr":"Je cherche un logement, plus précisément près de la plage.","id":"con:7:specifically"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"similarly","fr":"de la même manière","ex":"I love hiking. Similarly, my brother enjoys mountain trips.","exFr":"J'adore la randonnée. De la même manière, mon frère aime les voyages en montagne.","id":"con:8:similarly"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"likewise","fr":"de même","ex":"She wants to learn English. Likewise, I want to improve my Spanish.","exFr":"Elle veut apprendre l'anglais. De même, je veux améliorer mon espagnol.","id":"con:8:likewise"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"in the same way","fr":"de la même façon","ex":"He organises his day in the same way I do.","exFr":"Il organise sa journée de la même façon que moi.","id":"con:8:in-the-same-way"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"compared to","fr":"comparé à","ex":"This city is quiet compared to Bangkok.","exFr":"Cette ville est calme comparée à Bangkok.","id":"con:8:compared-to"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"just like","fr":"tout comme","ex":"This beach is beautiful, just like the one in Bali.","exFr":"Cette plage est magnifique, tout comme celle de Bali.","id":"con:8:just-like"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"unlike","fr":"contrairement à","ex":"Unlike last year, I'm travelling alone this time.","exFr":"Contrairement à l'année dernière, je voyage seul cette fois.","id":"con:8:unlike"},{"col":"con","deck":8,"type":"phrase","tag":"time","en":"in contrast","fr":"en revanche","ex":"The north is cold. In contrast, the south is tropical.","exFr":"Le nord est froid. En revanche, le sud est tropical.","id":"con:8:in-contrast"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"in conclusion","fr":"en conclusion","ex":"In conclusion, this was the best trip of my life.","exFr":"En conclusion, c'était le meilleur voyage de ma vie.","id":"con:9:in-conclusion"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"to sum up","fr":"pour résumer","ex":"To sum up, the country is cheap, safe, and beautiful.","exFr":"Pour résumer, le pays est pas cher, sûr et magnifique.","id":"con:9:to-sum-up"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"overall","fr":"dans l'ensemble","ex":"Overall, I had an amazing experience in Asia.","exFr":"Dans l'ensemble, j'ai vécu une expérience incroyable en Asie.","id":"con:9:overall"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"in short","fr":"en bref","ex":"In short, I'd recommend this hostel to everyone.","exFr":"En bref, je recommanderais cette auberge à tout le monde.","id":"con:9:in-short"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"all in all","fr":"tout compte fait","ex":"All in all, the trip went really well.","exFr":"Tout compte fait, le voyage s'est très bien passé.","id":"con:9:all-in-all"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"to conclude","fr":"pour conclure","ex":"To conclude, I think remote work changed my life.","exFr":"Pour conclure, je pense que le travail à distance a changé ma vie.","id":"con:9:to-conclude"},{"col":"con","deck":9,"type":"phrase","tag":"add","en":"in summary","fr":"en résumé","ex":"In summary, book early and pack light.","exFr":"En résumé, réserve tôt et voyage léger.","id":"con:9:in-summary"},{"col":"con","deck":10,"type":"phrase","tag":"cause","en":"in order to","fr":"afin de","ex":"I saved money in order to travel longer.","exFr":"J'ai économisé de l'argent afin de voyager plus longtemps.","id":"con:10:in-order-to"},{"col":"con","deck":10,"type":"phrase","tag":"cause","en":"so that","fr":"pour que / de sorte que","ex":"I woke up early so that I could catch the sunrise.","exFr":"Je me suis levé tôt pour pouvoir voir le lever du soleil.","id":"con:10:so-that"},{"col":"con","deck":10,"type":"phrase","tag":"cause","en":"so as to","fr":"de façon à","ex":"I left early so as to avoid the traffic.","exFr":"Je suis parti tôt de façon à éviter les embouteillages.","id":"con:10:so-as-to"},{"col":"con","deck":10,"type":"phrase","tag":"cause","en":"with the aim of","fr":"dans le but de","ex":"I moved abroad with the aim of learning English.","exFr":"J'ai déménagé à l'étranger dans le but d'apprendre l'anglais.","id":"con:10:with-the-aim-of"},{"col":"con","deck":10,"type":"phrase","tag":"cause","en":"for the purpose of","fr":"dans le but de","ex":"We met for the purpose of planning the trip.","exFr":"Nous nous sommes rencontrés dans le but de planifier le voyage.","id":"con:10:for-the-purpose-of"},{"col":"con","deck":10,"type":"phrase","tag":"cause","en":"to (+ infinitif)","fr":"pour (+ infinitif)","ex":"I travelled to Asia to learn English.","exFr":"J'ai voyagé en Asie pour apprendre l'anglais.","id":"con:10:to-infinitif"},{"col":"forsince","deck":1,"type":"phrase","tag":"greet","en":"I've lived in Asia for three years.","fr":"Je vis en Asie depuis trois ans.","ex":"I've lived in Asia for three years, mostly Vietnam and Cambodia.","exFr":"Je vis en Asie depuis trois ans, surtout au Vietnam et au Cambodge.","id":"forsince:1:i-ve-lived-in-asia-for-three-years"},{"col":"forsince","deck":1,"type":"phrase","tag":"greet","en":"I've run my agency for two years.","fr":"Je dirige mon agence depuis deux ans.","ex":"I've run my agency for two years now, it's growing slowly.","exFr":"Je dirige mon agence depuis deux ans maintenant, ça pousse doucement.","id":"forsince:1:i-ve-run-my-agency-for-two-years"},{"col":"forsince","deck":1,"type":"phrase","tag":"greet","en":"I haven't been back to France for a long time.","fr":"Je ne suis pas retourné en France depuis longtemps.","ex":"I haven't been back to France for a long time, maybe two years.","exFr":"Je ne suis pas retourné en France depuis longtemps, peut-être deux ans.","id":"forsince:1:i-haven-t-been-back-to-france-for-a-long"},{"col":"forsince","deck":1,"type":"phrase","tag":"greet","en":"I've had this laptop for six months.","fr":"J'ai cet ordinateur depuis six mois.","ex":"I've had this laptop for six months and it still works great.","exFr":"J'ai cet ordinateur depuis six mois et il marche encore super bien.","id":"forsince:1:i-ve-had-this-laptop-for-six-months"},{"col":"forsince","deck":1,"type":"phrase","tag":"greet","en":"She's been waiting for twenty minutes.","fr":"Elle attend depuis vingt minutes.","ex":"She's been waiting for twenty minutes, we should hurry.","exFr":"Elle attend depuis vingt minutes, on devrait se dépêcher.","id":"forsince:1:she-s-been-waiting-for-twenty-minutes"},{"col":"forsince","deck":1,"type":"phrase","tag":"greet","en":"I haven't sent an email for two weeks.","fr":"Je n'ai pas envoyé d'email depuis deux semaines.","ex":"I haven't sent a prospecting email for two weeks, I need to restart.","exFr":"Je n'ai pas envoyé d'email de prospection depuis deux semaines, je dois m'y remettre.","id":"forsince:1:i-haven-t-sent-an-email-for-two-weeks"},{"col":"forsince","deck":2,"type":"phrase","tag":"ask","en":"I've lived in Da Nang since 2022.","fr":"Je vis à Da Nang depuis 2022.","ex":"I've lived in Da Nang since 2022, I really like it here.","exFr":"Je vis à Da Nang depuis 2022, j'aime vraiment cet endroit.","id":"forsince:2:i-ve-lived-in-da-nang-since-2022"},{"col":"forsince","deck":2,"type":"phrase","tag":"ask","en":"I've been freelancing since I left France.","fr":"Je suis freelance depuis que j'ai quitté la France.","ex":"I've been freelancing since I left France, it's a different life.","exFr":"Je suis freelance depuis que j'ai quitté la France, c'est une vie différente.","id":"forsince:2:i-ve-been-freelancing-since-i-left-franc"},{"col":"forsince","deck":2,"type":"phrase","tag":"ask","en":"I haven't eaten since this morning.","fr":"Je n'ai pas mangé depuis ce matin.","ex":"I haven't eaten since this morning, I'm starving.","exFr":"Je n'ai pas mangé depuis ce matin, je meurs de faim.","id":"forsince:2:i-haven-t-eaten-since-this-morning"},{"col":"forsince","deck":2,"type":"phrase","tag":"ask","en":"I've known him since high school.","fr":"Je le connais depuis le lycée.","ex":"I've known him s
