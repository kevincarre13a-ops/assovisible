<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nitnoy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column (max 520px). Home = sticky stats bar + vertical path of unit bands.
   Lesson and Talk are full-screen overlays with a progress bar on top and one big action button at the bottom. */
:root{
  --bg:#eef3ee; --surface:#ffffff; --border:#cfdcd4; --border-input:#6f8a80;
  --text:#15302b; --muted:#4e6b62;
  --accent:#f0a030; --on-accent:#1f1300; --accent-text:#8a4f03; --ring:#8a4f03;
  --accent-soft:#fbe7c6; --accent-dark:#d98a1c;
  --danger:#b3261e; --on-danger:#ffffff; --danger-soft:#f6dcd9;
  --success:#276f45; --on-success:#ffffff; --success-soft:#d6ebdc;
  --shadow-node:0 5px 0 0 rgba(21,48,43,.18); --shadow-sheet:0 -8px 32px rgba(21,48,43,.18);
  --display:Mitr,'Noto Sans Thai',system-ui,sans-serif;
  --body:Sarabun,'Noto Sans Thai',system-ui,sans-serif;
  --r-sm:8px; --r-md:14px; --r-lg:22px;
  --nav-h:60px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10211d; --surface:#182e29; --border:#2c473f; --border-input:#7fa094;
    --text:#ecf2ee; --muted:#a6bdb3;
    --accent:#f2a93b; --on-accent:#1f1300; --accent-text:#f6be6a; --ring:#f2a93b;
    --accent-soft:#3a2d14; --accent-dark:#e0962a;
    --danger:#ff8a80; --on-danger:#2a0b09; --danger-soft:#3c1f1c;
    --success:#6fcf97; --on-success:#0b1f14; --success-soft:#1b3b2a;
    --shadow-node:0 5px 0 0 rgba(0,0,0,.45); --shadow-sheet:0 -8px 32px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10211d; --surface:#182e29; --border:#2c473f; --border-input:#7fa094;
  --text:#ecf2ee; --muted:#a6bdb3;
  --accent:#f2a93b; --on-accent:#1f1300; --accent-text:#f6be6a; --ring:#f2a93b;
  --accent-soft:#3a2d14; --accent-dark:#e0962a;
  --danger:#ff8a80; --on-danger:#2a0b09; --danger-soft:#3c1f1c;
  --success:#6fcf97; --on-success:#0b1f14; --success-soft:#1b3b2a;
  --shadow-node:0 5px 0 0 rgba(0,0,0,.45); --shadow-sheet:0 -8px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance;line-height:1.2}
p{margin:0}
.thai{font-family:var(--display);font-weight:400}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{max-width:520px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{font-family:var(--display);font-size:22px;font-weight:500;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}
.pills{display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px 4px 8px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:16px;height:16px}
.pill.streak svg{color:var(--accent-dark)}
.pill.xp svg{color:var(--success)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--muted);border-radius:0}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent-text)}
.nav button[aria-current="page"] svg{color:var(--accent-dark)}

/* ---------- home ---------- */
.hello{display:flex;flex-direction:column;gap:4px;padding-block:8px 16px}
.hello h1{font-size:30px}
.hello h1 .thai{font-weight:300}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--body);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal{height:6px;border-radius:3px;background:var(--border);margin-top:6px;overflow:hidden}
.goal i{display:block;height:100%;background:var(--success);width:0;transition:width .3s}

.unit{margin-bottom:28px}
.unit-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 16px;margin-bottom:18px}
.unit-head.current{background:var(--accent);color:var(--on-accent);border-color:transparent}
.unit-head.current .u-sub{color:inherit;opacity:.8}
.unit-head.locked{opacity:.6}
.u-num{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.u-title{font-family:var(--display);font-size:19px;font-weight:500;line-height:1.2}
.u-sub{font-size:13px;color:var(--muted)}
.u-prog{font-family:var(--body);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.path{display:flex;flex-direction:column;gap:14px}
.node-row{display:flex;justify-content:center}
.node-row.l{justify-content:flex-start;padding-left:18%}
.node-row.r{justify-content:flex-end;padding-right:18%}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;text-align:center}
.node .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--border);color:var(--muted);box-shadow:var(--shadow-node);transition:transform .12s}
.node .disc svg{width:30px;height:30px}
.node:active .disc{transform:translateY(2px);box-shadow:none}
.node.done .disc{background:var(--accent);border-color:var(--accent-dark);color:var(--on-accent)}
.node.current .disc{background:var(--surface);border-color:var(--accent-dark);color:var(--accent-dark);animation:pulse 1.8s ease-in-out infinite}
.node.locked{opacity:.55}
.node.locked .disc{box-shadow:none}
.node .lab{font-size:13px;font-weight:500;line-height:1.25}
.node .lvl{display:flex;gap:3px;height:6px}
.node .lvl i{width:12px;height:6px;border-radius:3px;background:var(--border)}
.node .lvl i.on{background:var(--accent-dark)}
@keyframes pulse{0%,100%{box-shadow:var(--shadow-node),0 0 0 0 rgba(240,160,48,.55)}60%{box-shadow:var(--shadow-node),0 0 0 12px rgba(240,160,48,0)}}

/* ---------- list screens ---------- */
.section-title{font-size:24px;padding-block:8px 6px}
.lead{color:var(--muted);margin-bottom:16px;max-width:36ch}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-input);border-radius:var(--r-md);padding:0 12px;margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit;height:46px;outline:none}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.group{margin-bottom:18px}
.group h3{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:700;letter-spacing:.03em;padding-block:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:10px 10px 10px 14px;margin-bottom:8px;min-width:0}
.row .txt{flex:1;min-width:0}
.row .th{font-family:var(--display);font-size:20px;line-height:1.3}
.row .ro{font-size:14px;color:var(--accent-text);font-weight:500}
.row .en{font-size:14px;color:var(--muted)}
.row .tag{font-size:11px;font-weight:700;color:var(--success);background:var(--success-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text);flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn.big{width:64px;height:64px;background:var(--accent);color:var(--on-accent)}
.iconbtn.big svg{width:28px;height:28px}
.empty{text-align:center;color:var(--muted);padding:32px 16px;border:1px dashed var(--border);border-radius:var(--r-md)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:var(--r-md);font-weight:700;font-size:16px;width:100%;transition:transform .1s,background .15s}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 0 var(--accent-dark)}
.btn.primary:active{transform:translateY(3px);box-shadow:none}
.btn.secondary{background:var(--surface);border:2px solid var(--border);color:var(--text)}
.btn.ghost{color:var(--accent-text);min-height:40px}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.ok{background:var(--success);color:var(--on-success)}
.btn.bad{background:var(--danger);color:var(--on-danger)}
.btn:disabled{opacity:.45;box-shadow:none;transform:none}
.btn svg{width:20px;height:20px}

/* ---------- overlay screens (lesson, talk) ---------- */
.screen{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen-in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
.lesson-top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.close{width:40px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.close svg{width:22px;height:22px}
.bar{flex:1;height:10px;background:var(--border);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-dark);width:0;transition:width .3s}
.ex{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding-block:8px 16px;min-height:0}
.prompt{font-size:22px;font-family:var(--display);font-weight:500;line-height:1.25}
.prompt .thai{font-size:34px;line-height:1.3}
.prompt small{display:block;font-family:var(--body);font-size:14px;color:var(--muted);font-weight:400;margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px 20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.card .big{font-family:var(--display);font-size:40px;line-height:1.35;font-weight:400}
.card .ro{color:var(--accent-text);font-weight:700;font-size:18px}
.card .en{font-size:18px}
.card .note{font-size:14px;color:var(--muted);margin-top:6px}
.card .play{align-self:flex-start;margin-top:8px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid var(--border);border-radius:var(--r-md);padding:12px 14px;min-height:52px;width:100%;transition:border-color .12s,background .12s}
.opt .k{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border);display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none;font-weight:700}
.opt .t{flex:1;min-width:0}
.opt .t>span{display:block}
.opt .t .th{font-family:var(--display);font-size:22px;line-height:1.3}
.opt .t .ro{font-size:14px;color:var(--accent-text);font-weight:500}
.opt .t .en{font-size:17px}
.opt[aria-pressed="true"]{border-color:var(--ring);background:var(--accent-soft)}
.opt.correct{border-color:var(--success);background:var(--success-soft)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt:disabled{cursor:default}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;padding:10px 0;border-bottom:2px solid var(--border);border-top:2px solid var(--border)}
.tiles.bank{border:0}
.tile{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-sm);padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.2;box-shadow:0 3px 0 0 var(--border)}
.tile .ro{font-weight:700;font-size:16px}
.tile .th{font-family:var(--display);font-size:14px;color:var(--muted)}
.tile.ghosted{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;min-width:0}
.pairs .opt{min-height:60px;justify-content:center;text-align:center}
.pairs .opt .t .th{font-size:20px}
.pairs .opt.locked{opacity:.4;border-color:var(--success)}
.speak{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:8px}
.speak .status{font-size:15px;color:var(--muted);min-height:22px;text-align:center}
.speak .heard{font-family:var(--display);font-size:20px;text-align:center}
.speak .mic{width:84px;height:84px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 5px 0 0 var(--accent-dark)}
.speak .mic svg{width:36px;height:36px}
.speak .mic.listening{animation:pulse 1.2s ease-in-out infinite;background:var(--accent-dark)}
.speak .mic:active{transform:translateY(3px);box-shadow:none}
.hint{font-size:14px;color:var(--muted);text-align:center;max-width:34ch}
.footer{padding-block:12px 16px;display:flex;flex-direction:column;gap:8px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow-sheet);transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet.ok{background:var(--success-soft);color:var(--text)}
.sheet.bad{background:var(--danger-soft);color:var(--text)}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:20px;display:flex;align-items:center;gap:8px}
.sheet h3 svg{width:26px;height:26px;flex:none}
.sheet.ok h3{color:var(--success)}
.sheet.bad h3{color:var(--danger)}
.sheet .ans{font-family:var(--display);font-size:22px}
.sheet .ans small{display:block;font-family:var(--body);font-size:15px;color:var(--muted)}

/* ---------- complete ---------- */
.done-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center}
.done-wrap h2{font-size:30px}
.done-wrap .thai{font-size:40px;font-weight:300;display:block}
.done-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.done-stats .stat{align-items:center;text-align:center}
.done-stats .stat span{white-space:normal;line-height:1.2}

/* ---------- talk ---------- */
.chat{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.bub{max-width:88%;border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;border:2px solid transparent}
.bub.app{align-self:flex-start;background:var(--surface);border-color:var(--border);border-bottom-left-radius:6px}
.bub.you{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:6px}
.bub.now{border-color:var(--ring)}
.bub .who{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.bub .th{font-family:var(--display);font-size:22px;line-height:1.3}
.bub .ro{font-size:14px;color:var(--accent-text);font-weight:500}
.bub .en{font-size:14px;color:var(--muted)}
.bub .tools{display:flex;gap:8px;margin-top:6px}
.bub .tools .iconbtn{width:36px;height:36px}
.bub .tools .iconbtn svg{width:16px;height:16px}
.bub.pending{opacity:.45}
.bub.said{border-color:var(--success)}

/* ---------- settings ---------- */
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.setting .l{min-width:0}
.setting .l b{display:block;font-weight:700}
.setting .l span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:3px;flex:none}
.seg button{padding:6px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.switch{width:50px;height:30px;border-radius:15px;background:var(--border);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
input[type=text]{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--border-input);border-radius:var(--r-sm);padding:8px 10px;width:120px;max-width:40vw}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;opacity:0;transition:all .2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:380px){
  .node-row.l{padding-left:6%}.node-row.r{padding-right:6%}
  .card .big{font-size:34px}
}
</style>

<div class="app" id="app"></div>
<nav class="nav" id="nav" aria-label="Main">
  <div class="nav-in">
    <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h6a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8h7"/><circle cx="18" cy="19" r="2"/></svg>Learn</button>
    <button data-tab="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg>Practice</button>
    <button data-tab="phrases"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>Phrases</button>
    <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
  </div>
</nav>
<div id="overlay"></div>
<div class="sheet" id="sheet" role="status" aria-live="polite"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   CONTENT. Items are [thai, romanisation, english, note].

function adapt(it){
  if (S.settings.gender !== 'f') return it;
  const th = it.th.split(' ').map(t => t === 'ครับ' ? 'ค่ะ' : t === 'ผม' ? 'ฉัน' : t).join(' ');

  return Object.assign({}, it, { th, ro });

const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let micBlocked = false;
function listen(onStatus){
  return new Promise(resolve => {
    if (!SR || micBlocked) return resolve(null);
    let r; try { r = new SR(); } catch(e){ return resolve(null); }
    r.lang = 'th-TH'; r.interimResults = false; r.maxAlternatives = 3;
    let done = false; const finish = v => { if (!done) { done = true; resolve(v); } };
    r.onresult = e => { const alts = []; for (const res of e.results) for (const a of res) alts.push(a.transcript); finish(alts); };
    r.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') micBlocked = true; finish(null); };
    r.onend = () => finish(null);
    try { r.start(); onStatus && onStatus('Listening...'); } catch(e){ finish(null); }
    setTimeout(() => { try { r.stop(); } catch(e){} }, 7000);
  });
}
function similarity(a, b){
  a = joinTh(a).replace(/[^฀-๿]/g, ''); b = joinTh(b).replace(/[^฀-๿]/g, '');
  if (!a.length || !b.length) return 0;
  if (a.includes(b) || b.includes(a)) return 1;
  const m = a.length, n = b.length; let prev = Array.from({length:n+1}, (_, j) => j);
  for (let i=1;i<=m;i++){ const cur=[i]; for (let j=1;j<=n;j++){ cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1]?0:1)); } prev = cur; }
  return 1 - prev[n] / Math.max(m, n);
}

/* ---------- exercise generation ---------- */
function distractors(item, n, pool){
  const seenEn = new Set([item.en.toLowerCase()]); const seenTh = new Set([joinTh(item.th)]);
  const out = [];
  const take = list => { for (const c of shuffle(list)) { if (out.length >= n) break; if (c.id === item.id) continue; if (seenEn.has(c.en.toLowerCase()) || seenTh.has(joinTh(c.th))) continue; if (c.phrase !== item.phrase) continue; out.push(c); seenEn.add(c.en.toLowerCase()); seenTh.add(joinTh(c.th)); } };
  take(pool); if (out.length < n) take(ITEMS.filter(c => c.phrase === item.phrase)); if (out.length < n) take(ITEMS);
  return out;
}
function quizStep(type, item, pool){
  if (type === 'listen' && !hasThaiVoice()) type = 'mc-th';
  if (type === 'build' && !item.phrase) type = 'mc-en';
  const step = { type, item };
  if (type === 'mc-th' || type === 'mc-en' || type === 'listen') step.options = shuffle([item, ...distractors(item, 3, pool)]);
  if (type === 'build') {
    const toks = adapt(item).ro.split(' ');
    const extras = []; const others = shuffle(pool.filter(p => p.id !== item.id));
    for (const o of others) { for (const t of adapt(o).ro.split(' ')) { if (extras.length >= 2) break; if (!toks.includes(t) && !extras.includes(t)) extras.push(t); } if (extras.length >= 2) break; }
    step.bank = shuffle(toks.concat(extras));
  }
  return step;
}
function buildLesson(lesson){
  const items = lesson.items, steps = []; const pool = lesson.unit.lessons.flatMap(l => l.items);
  const quizTypes = items.some(i => i.phrase) ? ['mc-en','build','listen','mc-th','build','mc-en'] : ['mc-th','mc-en','listen','mc-th','mc-en','listen'];
  items.forEach((it, k) => { steps.push({ type:'intro', item: it }); if (k % 2 === 1 || k === items.length - 1) { steps.push(quizStep(quizTypes[k % quizTypes.length], it, pool)); if (k > 0) steps.push(quizStep(quizTypes[(k+3) % quizTypes.length], items[k-1], pool)); } });
  if (!items.some(i => i.phrase) && items.length >= 4) steps.push({ type:'match', pairs: pick(items, 4) });
  const phrases = items.filter(i => i.phrase); const sayPool = phrases.length ? phrases : items;
  pick(sayPool, Math.min(2, sayPool.length)).forEach(it => steps.push({ type:'say', item: it }));
  return steps;
}
function buildPractice(){
  const learned = ITEMS.filter(i => S.items[i.id] && S.items[i.id].seen > 0);
  const base = learned.length >= 4 ? learned : ITEMS.slice(0, 12);
  const score = i => { const s = S.items[i.id] || {seen:0,right:0,wrong:0,last:0}; return (s.right - s.wrong * 2) * 1000 + (s.last ? (Date.now() - s.last) / -36e5 : 0); };
  const chosen = base.slice().sort((a,b) => score(a) - score(b)).slice(0, 8);
  const pool = ITEMS.filter(i => S.items[i.id]);
  const steps = chosen.map((it, k) => quizStep(['mc-th','mc-en','listen','build'][k % 4], it, pool.length >= 4 ? pool : ITEMS));
  const ph = chosen.filter(i => i.phrase); if (ph.length) steps.push({ type:'say', item: ph[0] });
  return steps;
}

  row('Auto-play audio', 'Hear each new word as it appears', sw('autoplay'));
  const rate = el('div', 'seg'); rate.setAttribute('role','group'); rate.setAttribute('aria-label','Voice speed');
  [['0.7','Slow'],['0.85','Normal'],['1','Fast']].forEach(([v, l]) => { const b = el('button', null, l); b.setAttribute('aria-pressed', String(Number(S.settings.rate) === Number(v))); b.addEventListener('click', () => { S.settings.rate = Number(v); save(); me_(); speak('สวัสดีครับ'); }); rate.appendChild(b); });
  row('Voice speed', hasThaiVoice() ? `Thai voice: ${esc(thaiVoice().name)}` : 'No Thai voice found on this device yet', rate);
  row('Microphone', SR ? (micBlocked ? 'Refused here. Open the file in Safari or Chrome to speak.' : 'Speech recognition available') : 'Not supported in this browser. You still get listen-and-repeat.', el('span', 'muted', SR && !micBlocked ? ICON.mic : ICON.x));
  app.appendChild(wrap);
  const danger = el('section'); const rb = el('button', 'btn secondary', 'Reset all progress');
  rb.addEventListener('click', () => { danger.innerHTML = ''; const p = el('p', 'lead', 'This wipes XP, streak and every lesson. There is no undo.'); const yes = el('button', 'btn danger', 'Yes, reset everything'); const no = el('button', 'btn ghost', 'Keep my progress'); yes.addEventListener('click', () => { const name = S.name; S = fresh(); S.name = name; save(); toast('Progress reset'); render(); }); no.addEventListener('click', render); danger.append(p, yes, no); });
  danger.appendChild(rb); app.appendChild(danger);
  app.appendChild(el('p', 'lead', 'Nitnoy keeps everything on this device. Nothing is sent anywhere.'));
  function me_(){ render(); }
}

/* ---------- lesson session ---------- */
let session = null;
function startLesson(lesson){ startSession({ kind:'lesson', lesson, title: lesson.title, steps: buildLesson(lesson) }); }
function startSession(cfg){
  session = Object.assign({ i:0, right:0, wrong:0, firstTry:0, total:0, requeued:new Set(), xp:0, speakOff:S.settings.speakSkip }, cfg);
  session.total = session.steps.length;
  overlay.innerHTML = ''; const sc = el('div', 'screen'); sc.id = 'lesson';
  sc.innerHTML = `<div class="screen-in"><div class="lesson-top"><button class="close" id="close" aria-label="Quit this lesson">${ICON.x}</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Lesson progress"><i id="barfill"></i></div></div><div class="ex" id="ex"></div><div class="footer" id="foot"></div></div>`;
  overlay.appendChild(sc);
  $('#close').addEventListener('click', () => quitPrompt());
  document.body.style.overflow = 'hidden';
  showStep();
}
function quitPrompt(){
  const ex = $('#ex'), foot = $('#foot'); if (!ex) return;
  ex.innerHTML = `<h2 class="prompt">Quit now?</h2><p class="lead">You will lose this lesson's progress, but every word you got right is already remembered.</p>`;
  foot.innerHTML = ''; const stay = el('button', 'btn primary', 'Keep going'); const go = el('button', 'btn ghost', 'Quit'); stay.addEventListener('click', showStep); go.addEventListener('click', closeOverlay); foot.append(stay, go);
}
function closeOverlay(){ overlay.innerHTML = ''; hideSheet(); document.body.style.overflow = ''; session = null; render(); }
function progressPct(){ return Math.round(100 * session.i / session.steps.length); }
function setFooter(label, onClick, disabled){ const f = $('#foot'); f.innerHTML = ''; const b = el('button', 'btn primary', label); b.id = 'main'; b.disabled = !!disabled; b.addEventListener('click', onClick); f.appendChild(b); return b; }
function showStep(){
  hideSheet();
  if (session.i >= session.steps.length) return finishSession();
  const step = session.steps[session.i]; const ex = $('#ex'); ex.innerHTML = '';
  $('#barfill').style.width = progressPct() + '%'; $('.bar').setAttribute('aria-valuenow', progressPct());
  const r = { intro: stepIntro, 'mc-th': stepMC, 'mc-en': stepMC, listen: stepListen, build: stepBuild, match: stepMatch, say: stepSay }[step.type];
  r(step, ex);
}
function playBtn(th, big){ const b = el('button', `iconbtn ${big ? 'big' : ''} play`, ICON.play); b.setAttribute('aria-label', 'Play audio'); b.addEventListener('click', () => { if (!speak(th)) toast('No voice on this device'); }); return b; }
function stepIntro(step, ex){
  const a = adapt(step.item);
  ex.appendChild(el('h2', 'prompt', `<small>New ${a.phrase ? 'sentence' : 'word'}</small>${esc(a.en)}`));
  const c = el('div', 'card'); c.innerHTML = `<div class="big thai">${esc(joinTh(a.th))}</div>${S.settings.rom ? `<div class="ro">${esc(a.ro)}</div>` : ''}${a.note ? `<div class="note">${esc(a.note)}</div>` : ''}`;
  c.appendChild(playBtn(a.th, true)); ex.appendChild(c);
  if (S.settings.autoplay) setTimeout(() => speak(a.th), 150);
  setFooter('Continue', () => { session.i++; showStep(); });
}
function optionButton(a, dir, k){
  const b = el('button', 'opt'); b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<span class="k" aria-hidden="true">${k+1}</span><span class="t">${dir === 'en' ? `<span class="en">${esc(a.en)}</span>` : `<span class="th">${esc(joinTh(a.th))}</span>${S.settings.rom ? `<span class="ro">${esc(a.ro)}</span>` : ''}`}</span>`;
  return b;
}
function stepMC(step, ex){
  const a = adapt(step.item); const toEn = step.type === 'mc-th';
  const h = el('h2', 'prompt', `<small>${toEn ? 'What does this mean?' : 'Pick the Thai for'}</small>${toEn ? `<span class="thai">${esc(joinTh(a.th))}</span>${S.settings.rom ? ` <span class="muted" style="font-size:16px;font-family:var(--body)">${esc(a.ro)}</span>` : ''}` : esc(a.en)}`);
  ex.appendChild(h); if (toEn) { const pb = playBtn(a.th); ex.appendChild(pb); if (S.settings.autoplay) setTimeout(() => speak(a.th), 150); }
  const opts = el('div', 'opts'); let chosen = null;
  step.options.forEach((o, k) => { const b = optionButton(adapt(o), toEn ? 'en' : 'th', k); b.addEventListener('click', () => { if (chosen && chosen.disabled) return; opts.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); chosen = b; chosen.item = o; $('#main').disabled = false; }); opts.appendChild(b); });
  ex.appendChild(opts);
  setFooter('Check', () => { const ok = chosen.item.id === step.item.id; opts.querySelectorAll('.opt').forEach(x => { x.disabled = true; }); chosen.classList.add(ok ? 'correct' : 'wrong'); if (!ok) { [...opts.children][step.options.findIndex(o => o.id === step.item.id)].classList.add('correct'); } grade(step, ok, a); }, true);
}
function stepListen(step, ex){
  const a = adapt(step.item);
  ex.appendChild(el('h2', 'prompt', '<small>Listen</small>Tap what you hear'));
  const c = el('div', 'speak'); c.appendChild(playBtn(a.th, true)); c.appendChild(el('p', 'hint', 'Play it as many times as you like.')); ex.appendChild(c);
  if (S.settings.autoplay) setTimeout(() => speak(a.th), 200);
  const opts = el('div', 'opts'); let chosen = null;
  step.options.forEach((o, k) => { const b = optionButton(adapt(o), 'th', k); b.addEventListener('click', () => { if (b.disabled) return; opts.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); chosen = b; chosen.item = o; $('#main').disabled = false; }); opts.appendChild(b); });
  ex.appendChild(opts);
  setFooter('Check', () => { const ok = chosen.item.id === step.item.id; opts.querySelectorAll('.opt').forEach(x => x.disabled = true); chosen.classList.add(ok ? 'correct' : 'wrong'); if (!ok) [...opts.children][step.options.findIndex(o => o.id === step.item.id)].classList.add('correct'); grade(step, ok, a); }, true);
}
function stepBuild(step, ex){
  const a = adapt(step.item); const target = a.ro.split(' '); const thToks = a.th.split(' ');
  const thFor = t => { const i = target.indexOf(t); if (i >= 0) return thToks[i]; const it = ITEMS.map(adapt).find(x => x.ro.split(' ').includes(t)); if (!it) return ''; const j = it.ro.split(' ').indexOf(t); return it.th.split(' ')[j] || ''; };
  ex.appendChild(el('h2', 'prompt', `<small>Build the sentence</small>${esc(a.en)}`));
  const answer = el('div', 'tiles'); answer.setAttribute('aria-label', 'Your sentence'); const bank = el('div', 'tiles bank'); bank.setAttribute('aria-label', 'Word tiles');
  const placed = [];
  const tile = (t) => { const b = el('button', 'tile'); b.innerHTML = `<span class="ro">${esc(t)}</span>${S.settings.rom ? '' : ''}<span class="th">${esc(thFor(t))}</span>`; b.dataset.t = t; return b; };
  const refresh = () => { answer.innerHTML = ''; placed.forEach(p => { const b = tile(p.t); b.addEventListener('click', () => { placed.splice(placed.indexOf(p), 1); p.src.classList.remove('ghosted'); refresh(); }); answer.appendChild(b); }); $('#main').disabled = placed.length === 0; };
  step.bank.forEach(t => { const b = tile(t); b.addEventListener('click', () => { if (b.classList.contains('ghosted')) return; b.classList.add('ghosted'); placed.push({ t, src: b }); refresh(); }); bank.appendChild(b); });
  ex.append(answer, bank);
  const pb = playBtn(a.th); pb.setAttribute('aria-label', 'Hear the sentence'); ex.appendChild(pb);
  setFooter('Check', () => { const got = placed.map(p => p.t); const ok = got.length === target.length && got.every((t, i) => t === target[i]); answer.querySelectorAll('.tile').forEach(x => x.disabled = true); bank.querySelectorAll('.tile').forEach(x => x.disabled = true); grade(step, ok, a); }, true);
}
function stepMatch(step, ex){
  ex.appendChild(el('h2', 'prompt', '<small>Match the pairs</small>Tap a Thai word, then its meaning'));
  const left = el('div', 'col'), right = el('div', 'col'); const grid = el('div', 'pairs'); grid.append(left, right); ex.appendChild(grid);
  let selL = null, selR = null, locked = 0, mistakes = 0;
  const mk = (o, side) => { const a = adapt(o); const b = el('button', 'opt'); b.setAttribute('aria-pressed','false'); b.innerHTML = `<span class="t">${side === 'L' ? `<span class="th">${esc(joinTh(a.th))}</span>${S.settings.rom ? `<span class="ro">${esc(a.ro)}</span>` : ''}` : `<span class="en">${esc(a.en)}</span>`}</span>`; b.item = o; return b; };
  const check = () => { if (!selL || !selR) return; const ok = selL.item.id === selR.item.id; const L = selL, R = selR; selL = selR = null; if (ok) { L.classList.add('locked'); R.classList.add('locked'); L.disabled = R.disabled = true; L.setAttribute('aria-pressed','false'); R.setAttribute('aria-pressed','false'); markItem(L.item.id, true); locked++; if (locked === step.pairs.length) { session.right++; if (!mistakes) session.firstTry++; session.xp += mistakes ? 1 : 2; $('#main').disabled = false; showSheet(true, mistakes ? `All matched, ${mistakes} slip${mistakes>1?'s':''}.` : 'All matched, first try.', null); } } else { mistakes++; L.classList.add('wrong'); R.classList.add('wrong'); markItem(L.item.id, false); setTimeout(() => { L.classList.remove('wrong'); R.classList.remove('wrong'); L.setAttribute('aria-pressed','false'); R.setAttribute('aria-pressed','false'); }, 500); } };
  shuffle(step.pairs).forEach(o => { const b = mk(o, 'L'); b.addEventListener('click', () => { if (b.disabled) return; left.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); selL = b; speak(adapt(o).th); check(); }); left.appendChild(b); });
  shuffle(step.pairs).forEach(o => { const b = mk(o, 'R'); b.addEventListener('click', () => { if (b.disabled) return; right.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed','false')); b.setAttribute('aria-pressed','true'); selR = b; check(); }); right.appendChild(b); });
  setFooter('Continue', () => { session.i++; showStep(); }, true);
}
function stepSay(step, ex){
  const a = adapt(step.item);
  if (session.speakOff) { session.i++; return showStep(); }
  ex.appendChild(el('h2', 'prompt', `<small>Say it out loud</small>${esc(a.en)}`));
  const c = el('div', 'card'); c.innerHTML = `<div class="big thai">${esc(joinTh(a.th))}</div>${S.settings.rom ? `<div class="ro">${esc(a.ro)}</div>` : ''}`; c.appendChild(playBtn(a.th)); ex.appendChild(c);
  if (S.settings.autoplay) setTimeout(() => speak(a.th), 150);
  const sp = el('div', 'speak'); ex.appendChild(sp);
  const canMic = !!SR && !micBlocked;
  const status = el('p', 'status'); const heard = el('p', 'heard thai');
  if (canMic) {
    const mic = el('button', 'mic', ICON.mic); mic.setAttribute('aria-label', 'Record yourself');
    status.textContent = 'Tap the microphone, then say it.';
    sp.append(mic, status, heard);
    mic.addEventListener('click', async () => { if (mic.classList.contains('listening')) return; mic.classList.add('listening'); status.textContent = 'Listening...'; heard.textContent = ''; const alts = await listen(); mic.classList.remove('listening');
      if (!alts) { if (micBlocked) { status.textContent = 'The microphone is not available here. Use listen and repeat instead.'; renderFallback(); } else { status.textContent = 'Nothing heard. Try again, a bit louder.'; } return; }
      const best = Math.max(...alts.map(t => Math.max(similarity(t, a.th), similarity(t, stripParticles(a.th)))));
      heard.textContent = alts[0]; const ok = best >= 0.55;
      status.textContent = ok ? (best >= 0.85 ? 'Clear. That is it.' : 'Close enough. Nice.') : 'Not quite the same. Listen again and retry, or continue.';
      if (ok) { grade(step, true, a, 'Said it'); } else { $('#main').disabled = false; $('#main').textContent = 'Continue anyway'; markItem(a.id, false); }
    });
    const skip = el('button', 'btn ghost', 'Cannot speak right now'); skip.addEventListener('click', () => { session.speakOff = true; session.i++; showStep(); }); sp.appendChild(skip);
    setFooter('Say it first', null, true);
  } else { renderFallback(); }
  function renderFallback(){
    sp.innerHTML = ''; sp.appendChild(el('p', 'hint', micBlocked ? 'The microphone is blocked in this view. Play it, say it out loud three times, then tap "I said it".' : 'Play it, say it out loud three times, then tap "I said it".'));
    sp.appendChild(playBtn(a.th, true));
    const skip = el('button', 'btn ghost', 'Cannot speak right now'); skip.addEventListener('click', () => { session.speakOff = true; session.i++; showStep(); }); sp.appendChild(skip);
    setFooter('I said it', () => grade(step, true, a, 'Said it'));
  }
}
function grade(step, ok, a, okTitle){
  if (step.type !== 'match') markItem(step.item.id, ok);
  if (ok) { session.right++; if (!session.requeued.has(step.item.id)) session.firstTry++; session.xp += session.requeued.has(step.item.id) ? 1 : 2; }
  else { session.wrong++; if (!session.requeued.has(step.item.id)) { session.requeued.add(step.item.id); const pool = (session.lesson ? session.lesson.unit.lessons.flatMap(l => l.items) : ITEMS); const t = step.type === 'mc-th' ? 'mc-en' : step.type === 'build' ? 'build' : 'mc-th'; session.steps.push(quizStep(t, step.item, pool)); } }
  save();
  const praise = ['Nice.', 'Correct.', 'Yes.', 'Good ear.', 'That is it.'];
  showSheet(ok, ok ? (okTitle || praise[Math.floor(Math.random()*praise.length)]) : 'Not quite', ok ? null : `<div class="ans">${esc(joinTh(a.th))}<small>${S.settings.rom ? esc(a.ro) + ' · ' : ''}${esc(a.en)}</small></div>`);
  if (!ok) speak(a.th);
}
function showSheet(ok, title, bodyHtml){
  sheet.className = `sheet show ${ok ? 'ok' : 'bad'}`;
  sheet.innerHTML = `<div class="sheet-in"><h3>${ok ? ICON.check : ICON.x} ${esc(title)}</h3>${bodyHtml || ''}</div>`;
  const b = el('button', `btn ${ok ? 'ok' : 'bad'}`, 'Continue'); b.id = 'cont'; b.addEventListener('click', () => { session.i++; showStep(); }); $('.sheet-in').appendChild(b);
  const main = $('#main'); if (main) { main.disabled = true; }
  setTimeout(() => b.focus(), 50);
}
function hideSheet(){ sheet.className = 'sheet'; sheet.innerHTML = ''; }
function finishSession(){
  const ex = $('#ex'), foot = $('#foot'); hideSheet();
  const bonus = session.kind === 'lesson' ? 10 : 5; const total = session.xp + bonus;
  S.xp += total; const extended = touchStreak();
  if (session.kind === 'lesson') { const L = S.lessons[session.lesson.id] || (S.lessons[session.lesson.id] = {times:0,best:0}); L.times++; L.best = Math.max(L.best, session.firstTry); S.today.lessons++; }
  save();
  const acc = session.total ? Math.round(100 * session.firstTry / Math.max(1, session.steps.filter(s => s.type !== 'intro').length)) : 0;
  $('#barfill').style.width = '100%';
  ex.innerHTML = `<div class="done-wrap"><div><span class="thai">เก่งมาก</span><h2>${session.kind === 'lesson' ? 'Lesson done' : 'Round done'}</h2><p class="muted">gèng mâak. You are good at this.</p></div>
  <div class="done-stats"><div class="stat"><b>+${total}</b><span>XP</span></div><div class="stat"><b>${Math.min(100, acc)}%</b><span>first try</span></div><div class="stat"><b>${S.streak.count}</b><span>${extended ? 'day streak, extended' : 'day streak'}</span></div></div>
  ${session.wrong ? `<p class="hint">${session.wrong} mistake${session.wrong>1?'s':''} came back at the end and you cleared them.</p>` : '<p class="hint">No mistakes. Try the same lesson again tomorrow to lock it in.</p>'}</div>`;
  foot.innerHTML = ''; const b = el('button', 'btn primary', 'Continue'); b.addEventListener('click', closeOverlay); foot.appendChild(b); b.focus();
}

/* ---------- talk (roleplay) ---------- */
function startTalk(u){
  const t = u.talk; const lines = t.lines.map(l => ({ who:l.who, th: l.who === 'you' ? adapt({th:l.th, ro:l.ro}).th : l.th, ro: l.who === 'you' ? adapt({th:l.th, ro:l.ro}).ro : l.ro, en:l.en }));
  session = { kind:'talk', unit:u, i:0, said:0, lines, speakOff:S.settings.speakSkip };
  overlay.innerHTML = ''; const sc = el('div', 'screen'); sc.id = 'talk';
  sc.innerHTML = `<div class="screen-in"><div class="lesson-top"><button class="close" id="close" aria-label="Quit this conversation">${ICON.x}</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Conversation progress"><i id="barfill"></i></div></div><div class="ex" id="ex"><h2 class="prompt"><small>Talk</small>${esc(t.title)}</h2><p class="lead">${esc(t.scene)} Say every line that is yours.</p><div class="chat" id="chat"></div><div class="speak" id="sp"></div></div><div class="footer" id="foot"></div></div>`;
  overlay.appendChild(sc); document.body.style.overflow = 'hidden';
  $('#close').addEventListener('click', closeOverlay);
  talkStep();
}
function talkStep(){
  const chat = $('#chat'), sp = $('#sp'), foot = $('#foot'); if (!chat) return;
  const L = session.lines; const i = session.i;
  $('#barfill').style.width = Math.round(100 * i / L.length) + '%';
  chat.innerHTML = '';
  L.slice(0, i + 1).forEach((l, k) => {
    const b = el('div', `bub ${l.who} ${k === i ? 'now' : ''} ${l.who === 'you' && k < i ? 'said' : ''}`);
    b.innerHTML = `<span class="who">${l.who === 'you' ? 'You' : 'Them'}</span><span class="th">${esc(joinTh(l.th))}</span>${S.settings.rom ? `<span class="ro">${esc(l.ro)}</span>` : ''}<span class="en">${esc(l.en)}</span>`;
    const tools = el('div', 'tools'); tools.appendChild(playBtn(l.th)); b.appendChild(tools); chat.appendChild(b);
  });
  sp.innerHTML = ''; foot.innerHTML = '';
  if (i >= L.length) return finishTalk();
  const line = L[i];
  if (line.who === 'app') {
    if (S.settings.autoplay) setTimeout(() => speak(line.th), 200);
    const b = el('button', 'btn primary', 'Continue'); b.addEventListener('click', () => { session.i++; talkStep(); }); foot.appendChild(b); b.focus();
  } else {
    const canMic = !!SR && !micBlocked && !session.speakOff;
    const status = el('p', 'status'); const heard = el('p', 'heard thai');
    if (canMic) {
      const mic = el('button', 'mic', ICON.mic); mic.setAttribute('aria-label', 'Say your line'); status.textContent = 'Your turn. Tap the microphone and say the line.';
      sp.append(mic, status, heard);
      mic.addEventListener('click', async () => { if (mic.classList.contains('listening')) return; mic.classList.add('listening'); status.textContent = 'Listening...'; const alts = await listen(); mic.classList.remove('listening');
        if (!alts) { if (micBlocked) { status.textContent = 'Microphone not available here.'; fallback(); } else status.textContent = 'Nothing heard. Try again.'; return; }
        const best = Math.max(...alts.map(t => Math.max(similarity(t, line.th), similarity(t, stripParticles(line.th)))));
        heard.textContent = alts[0];
        if (best >= 0.55) { status.textContent = best >= 0.85 ? 'Clear.' : 'Close enough.'; session.said++; const b = el('button', 'btn ok', 'Continue'); b.addEventListener('click', () => { session.i++; talkStep(); }); foot.innerHTML = ''; foot.appendChild(b); b.focus(); }
        else { status.textContent = 'Not quite. Listen and try again.'; const b = el('button', 'btn ghost', 'Skip this line'); b.addEventListener('click', () => { session.i++; talkStep(); }); foot.innerHTML = ''; foot.appendChild(b); }
      });
      const b = el('button', 'btn ghost', 'Cannot speak right now'); b.addEventListener('click', () => { session.speakOff = true; talkStep(); }); foot.appendChild(b);
    } else fallback();
    function fallback(){ sp.innerHTML = ''; foot.innerHTML = ''; sp.appendChild(el('p', 'hint', 'Your turn. Play the line, say it out loud, then continue.')); sp.appendChild(playBtn(line.th, true)); if (S.settings.autoplay) setTimeout(() => speak(line.th), 200); const b = el('button', 'btn primary', 'I said it'); b.addEventListener('click', () => { session.said++; session.i++; talkStep(); }); foot.appendChild(b); }
  }
  requestAnimationFrame(() => { const ex = $('#ex'); if (ex) ex.scrollTop = ex.scrollHeight; });
}
function finishTalk(){
  const ex = $('#ex'), foot = $('#foot'); const xp = 15; S.xp += xp; const extended = touchStreak(); S.talks[session.unit.talk.id] = (S.talks[session.unit.talk.id] || 0) + 1; save();
  $('#barfill').style.width = '100%';
  ex.innerHTML = `<div class="done-wrap"><div><span class="thai">เก่งมาก</span><h2>Conversation done</h2><p class="muted">You said ${session.said} line${session.said===1?'':'s'} out loud. That is the whole point.</p></div><div class="done-stats"><div class="stat"><b>+${xp}</b><span>XP</span></div><div class="stat"><b>${session.said}/${session.lines.filter(l=>l.who==='you').length}</b><span>lines said</span></div><div class="stat"><b>${S.streak.count}</b><span>${extended ? 'day streak, extended' : 'day streak'}</span></div></div></div>`;
  foot.innerHTML = ''; const b = el('button', 'btn primary', 'Continue'); b.addEventListener('click', closeOverlay); foot.appendChild(b); b.focus();
}

/* ---------- keyboard: Enter = main button ---------- */
document.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.target.tagName === 'INPUT') return; const c = $('#cont'); if (c) { c.click(); return; } const m = $('#main'); if (m && !m.disabled) m.click(); });

/* ---------- boot ---------- */
function start(){ render(); }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start();
window.NITNOY = { get session(){ return session; }, UNITS, ITEMS, buildLesson, buildPractice, similarity };
