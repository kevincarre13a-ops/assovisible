# Fichier généré par eost-tools/build-fn.mjs : ne pas modifier à la main.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Le code des fonctions n'a pas à être servi comme page du site.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Pages du site : servies par la fonction « page » (contenu d'origine + modifications de l'espace administrateur).
[[redirects]]
  from = "/"
  to = "/.netlify/functions/page?l=fr&p=index"
  status = 200
  force = true

