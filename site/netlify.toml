# Club Photo de Morestel — site statique (pas de build).
[build]
  publish = "."

# Protection de l'espace adhérents (fonction edge) : elle ne s'active que si la variable
# d'environnement ADHERENT_PASSWORD est définie dans Netlify. Voir LISEZMOI.md.
[[edge_functions]]
  function = "adherent-auth"
  path = "/adherent"
[[edge_functions]]
  function = "adherent-auth"
  path = "/adherent.html"
[[edge_functions]]
  function = "adherent-auth"
  path = "/supports/*"
[[edge_functions]]
  function = "adherent-auth"
  path = "/data/cours.json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Les données (JSON) doivent se mettre à jour immédiatement quand le club les modifie.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
