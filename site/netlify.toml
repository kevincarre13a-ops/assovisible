[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Anciennes adresses de la première maquette
[[redirects]]
  from = "/evenements*"
  to = "/activites.html#evenements"
  status = 301
[[redirects]]
  from = "/visites*"
  to = "/activites.html#visites"
  status = 301
[[redirects]]
  from = "/actualites*"
  to = "/activites.html"
  status = 301
[[redirects]]
  from = "/soutenir*"
  to = "/contact.html#adhesion"
  status = 301

# L'ancienne adresse Netlify renvoie vers le nom de domaine officiel
[[redirects]]
  from = "https://lalbarelle-hotel-dieu-belleville.netlify.app/*"
  to = "https://lalbarelle-hotel-dieu-belleville.fr/:splat"
  status = 301
  force = true
