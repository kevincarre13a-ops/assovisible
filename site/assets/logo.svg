<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="cbsTitle">
  <title id="cbsTitle">Logo du Club Bisontin de Scrabble</title>
  <rect width="160" height="160" rx="30" fill="#8C5A2A"/>
  <rect x="10" y="10" width="140" height="140" rx="22" fill="#C98A4B"/>
  <!-- Tuile C -->
  <g>
    <rect x="18" y="52" width="40" height="56" rx="6" fill="#EADFC0" stroke="#8C5A2A" stroke-width="2"/>
    <text x="38" y="92" font-family="Georgia, serif" font-weight="700" font-size="34" text-anchor="middle" fill="#5E3A1A">C</text>
    <text x="52" y="104" font-family="Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#8C5A2A">3</text>
  </g>
  <!-- Tuile B -->
  <g>
    <rect x="60" y="40" width="40" height="56" rx="6" fill="#EADFC0" stroke="#8C5A2A" stroke-width="2"/>
    <text x="80" y="80" font-family="Georgia, serif" font-weight="700" font-size="34" text-anchor="middle" fill="#5E3A1A">B</text>
    <text x="94" y="92" font-family="Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#8C5A2A">3</text>
  </g>
  <!-- Tuile S -->
  <g>
    <rect x="102" y="52" width="40" height="56" rx="6" fill="#EADFC0" stroke="#8C5A2A" stroke-width="2"/>
    <text x="122" y="92" font-family="Georgia, serif" font-weight="700" font-size="34" text-anchor="middle" fill="#E2588F">S</text>
    <text x="136" y="104" font-family="Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#8C5A2A">1</text>
  </g>
</svg>
